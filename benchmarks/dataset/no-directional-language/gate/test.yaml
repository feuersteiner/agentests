version: 1
id: no-directional-language
title: No directional language
description: Help articles, emails to users and interface text name the control the reader should use and never locate it by its position on the screen, its colour or the look of its icon.
select:
  glob: ['content/help/**/*.md', 'emails/**/*.md', 'locales/**/*.json']
  grep: '\b([Ll]eft|[Rr]ight)[- ]?(hand|side|sidebar|panel|pane|column|corner|edge|menu|rail|bar|most)\b|\b([Oo]n|[Tt]o|[Aa]t|[Ii]n|[Ff]rom|[Tt]owards?) the (far |top |bottom |upper |lower )?(left|right)\b|\b(at|on|far) (left|right)\b|\b([Tt]op|[Bb]ottom|[Uu]pper|[Ll]ower|[Ff]ar)[- ](left|right)\b|\b([Tt]op|[Bb]ottom)\b(?![- ](tips?|plans?|priorit(y|ies)|up|ups|level|picks?|sellers?|choices?|rated|quality|line|dollar|notch|ten|five|three)\b)|[Cc]orner|[Ss]ide ?bar|\b[Ss]ide (panel|menu)|\b[Aa]bove\b|\b[Bb]elow\b|[Bb]eneath|[Uu]nderneath|\b[Bb]eside\b|\b[Nn]ext to\b|[Ss]croll|\b(green|blue|red|orange|yellow|purple|pink|gr[ae]y|black|white|teal)\b|\b[Ii]cons?\b|\b[Gg]ear\b|\b[Cc]og\b|[Pp]encil|\b[Dd]ots\b|[Tt]hree[- ]dot|[Ee]llipsis|[Kk]ebab|[Hh]amburger|[Cc]hevron|[Cc]aret|\b[Aa]rrows?\b|[Mm]agnifying|[Tt]rash|\b[Bb]in\b|[Pp]lus (sign|symbol|button|icon)|\+ ?(sign|button|icon)|\(\+\)|"\+"|\b[Ss]ymbol|\b[Ss]tar\b|\b[Bb]ell\b|[Ll]ightning|\b[Ee]ye\b|[Ss]haped|\b[Tt]he X\b|⋮|⋯|⚙'
assert:
  - id: no-screen-position
    description: No control, menu, tab, section or label is located by where it sits on the screen.
    error: Name the control, menu, tab or section instead of saying where it sits on the screen.
    grep: '(?<=(?:^|\n)(?:[^*\n]|\*(?!\*)|\*\*[^*\n]*\*\*)*)(?:\b([Ll]eft|[Rr]ight)[- ]?(hand|side|sidebar|panel|pane|column|corner|edge|menu|rail|bar|most)\b|\b([Oo]n|[Tt]o|[Aa]t|[Ii]n|[Ff]rom|[Tt]owards?) the (far |top |bottom |upper |lower )?(left|right)\b|\b(at|on|far) (left|right)\b|\b([Tt]op|[Bb]ottom|[Uu]pper|[Ll]ower|[Ff]ar)[- ](left|right)\b|\b([Tt]op|[Bb]ottom)\b(?![- ](tips?|plans?|priorit(y|ies)|up|ups|level|picks?|sellers?|choices?|rated|quality|line|dollar|notch|ten|five|three)\b)|[Cc]orner|[Ss]ide ?bar|\b[Ss]ide (panel|menu)|\b[Bb]eside\b|\b[Nn]ext to\b|[Ss]croll)'
    decide: 'The text never says where on the screen a part of the app is, such as a button, link, menu, tab, panel, field or badge, for example "in the right sidebar", "on the left", "at the top", "in the top right corner", "next to the form name" or "scroll down to". This holds even when the control is also named, as in "click Publish in the top right corner". These do not count: words that are part of a control''s name, written in bold, such as **Align left** or **Back to top**; mouse actions such as a right-click; and these words in another sense that says nothing about the screen, such as "right away", "the right plan", "top tips", "3 days left" or "on top of" meaning "in addition".'
  - id: no-above-or-below
    description: No button, link or other control is located as above or below something.
    error: Name the button, link or control by its label instead of saying it is above or below.
    grep: '(?<=(?:^|\n)(?:[^*\n]|\*(?!\*)|\*\*[^*\n]*\*\*)*)(?:\b[Aa]bove\b|\b[Bb]elow\b|[Bb]eneath|[Uu]nderneath)'
    decide: 'The text never says that a button, link, menu, tab, panel or field is above or below something, for example "the button below", "the link above" or "the Share tab, below the Publish button". These do not count: "above" or "below" pointing to a part of the text itself that is not a button or link, such as "the steps below", "the table below" or "the section above"; "under" followed by the name of a menu, tab or section, as in "under Billing"; and "above" or "below" in another sense that says nothing about the screen, such as a price above 20 euros.'
  - id: no-looks
    description: No control, menu or label is identified by its colour, its shape or the picture on its icon.
    error: Name the control by its label instead of describing its colour, shape or icon.
    grep: '\b(green|blue|red|orange|yellow|purple|pink|gr[ae]y|black|white|teal)\b|\b[Ii]cons?\b|\b[Gg]ear\b|\b[Cc]og\b|[Pp]encil|\b[Dd]ots\b|[Tt]hree[- ]dot|[Ee]llipsis|[Kk]ebab|[Hh]amburger|[Cc]hevron|[Cc]aret|\b[Aa]rrows?\b|[Mm]agnifying|[Tt]rash|\b[Bb]in\b|[Pp]lus (sign|symbol|button|icon)|\+ ?(sign|button|icon)|\(\+\)|"\+"|\b[Ss]ymbol|\b[Ss]tar\b|\b[Bb]ell\b|[Ll]ightning|\b[Ee]ye\b|[Ss]haped|\b[Tt]he X\b|⋮|⋯|⚙'
    decide: 'The text never points the reader to a button, link, menu, tab, field or badge by how it looks: not by its colour, as in "the green button" or "fields marked in red", not by its shape, and not by the picture on its icon, as in "the gear icon", "the pencil", "the three dots", "the plus sign" or "the trash can". This holds even when the control is also named, as in "the blue Save button". Everything else passes, including alt text or a caption that says what an image shows, and colours or pictures that do not point to a part of the app, such as brand colours, a chart or an illustration.'
