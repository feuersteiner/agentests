version: 1
id: pull-request-target-never-runs-pr-code
title: Privileged pull request workflows never run the pull request's code
description: A workflow on pull_request_target or workflow_run that has secrets or a write token never checks out and installs, builds, tests or runs the pull request's code, and runs nothing from a downloaded artifact.
select:
  glob: ['.github/workflows/*.yml', '.github/workflows/*.yaml']
  grep: 'pull_request_target|workflow_run'
  decide: 'This file is a GitHub Actions workflow whose `on:` section lists pull_request_target or workflow_run among the events that trigger it. A workflow triggered only by other events, such as pull_request, push or schedule, is not, even when a comment or step mentions pull_request_target or workflow_run.'
assert:
  - id: no-pull-request-checkout-executed
    description: No step checks out or fetches the pull request's head and then installs, builds, tests or runs it, unless the workflow has no secret and no write token.
    error: Run the pull request's code only in a workflow on pull_request and upload what it produces as an artifact; do the privileged part in a workflow_run workflow that uses the artifact as data. Or give this workflow no secrets and read-only permissions.
    decide:
      - 'This workflow has neither a repository secret nor a GITHUB_TOKEN that can write. Judge it from the text of the file only, by two checks. (1) The file contains no expression `secrets.NAME` with a name other than GITHUB_TOKEN. (2) Every job has read-only permissions: a `permissions` key at the top of the file or on the job sets each scope it lists to `read` or `none`, or is `read-all` or `{}`, and no job sets a scope to `write` or uses `write-all`. A job with no `permissions` key on it and none at the top of the file has a token that can write, so it fails check (2). The file passes only when both checks hold.'
      - 'No step of this workflow runs code from the pull request''s head. First find the steps that get the pull request''s head: `actions/checkout` whose `ref` input is `github.event.pull_request.head.sha`, `github.event.pull_request.head.ref`, `refs/pull/<number>/merge`, `refs/pull/<number>/head`, `github.event.workflow_run.head_sha` or `github.event.workflow_run.head_branch`; `gh pr checkout`; or a `git fetch` of a pull request ref. Two cases are not the pull request''s head: `actions/checkout` with no `ref` input, which gets the base or default branch, and `workflow_run.head_sha` in a job whose `if:` requires `github.event.workflow_run.event == ''push''`, which is a branch of this repository. If no step gets the pull request''s head, the file passes. Otherwise it fails when a later step of the same job installs dependencies (`npm ci`, `npm install`, `yarn`, `pip install`), builds, tests or lints, runs a package script (`npm test`, `npm run ...`, `make`), runs one of the checked-out files (`node <file>`, `bash <file>`), or uses a local action (`uses: ./...`). Steps that only read the checked-out files as data, such as `git diff`, `git show`, `cat`, `wc` or `jq`, run nothing.'
  - id: no-artifact-code-executed
    description: No step executes a file from an artifact downloaded from another run, unless the workflow has no secret and no write token.
    error: Use the downloaded artifact only as data, by reading, posting, uploading or deploying its files; never run a script or program from it.
    grep: '[Aa]rtifact|run download'
    decide:
      - 'This workflow has neither a repository secret nor a GITHUB_TOKEN that can write. Judge it from the text of the file only, by two checks. (1) The file contains no expression `secrets.NAME` with a name other than GITHUB_TOKEN. (2) Every job has read-only permissions: a `permissions` key at the top of the file or on the job sets each scope it lists to `read` or `none`, or is `read-all` or `{}`, and no job sets a scope to `write` or uses `write-all`. A job with no `permissions` key on it and none at the top of the file has a token that can write, so it fails check (2). The file passes only when both checks hold.'
      - 'No step of this workflow executes a file from an artifact it downloads (with `actions/download-artifact`, `dawidd6/action-download-artifact`, `gh run download`, or the artifacts API through `actions/github-script`). Executing means running a script or program from the artifact, sourcing it, installing it as a package, or using it as an action, for example `node out/report.js`, `bash out/deploy.sh`, `source out/env.sh`, `npm install ./out` or `./out/tool`. Using the artifact as data executes nothing: reading text, numbers or JSON from it, posting it in a comment, uploading it to a coverage service, or deploying its files as a static site.'
