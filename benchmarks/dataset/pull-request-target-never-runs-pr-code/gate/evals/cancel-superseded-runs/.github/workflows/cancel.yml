name: Cancel superseded runs

on:
  workflow_run:
    workflows: [CI]
    types: [requested]

permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - uses: styfle/cancel-workflow-action@0.12.1
        with:
          workflow_id: ${{ github.event.workflow.id }}
          access_token: ${{ github.token }}
