name: Coverage upload

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  upload:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Read the pull request number and commit
        id: pr
        run: |
          echo "number=$(tr -cd '0-9' < coverage-report/pr-number.txt)" >> "$GITHUB_OUTPUT"
          echo "sha=$(tr -cd '0-9a-f' < coverage-report/head-sha.txt)" >> "$GITHUB_OUTPUT"
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-report/lcov.info
          override_pr: ${{ steps.pr.outputs.number }}
          override_commit: ${{ steps.pr.outputs.sha }}
          fail_ci_if_error: true
