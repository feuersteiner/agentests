name: Docs preview

on: pull_request_target

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
      - uses: ./.github/actions/build-site
      - name: Deploy preview
        run: >-
          npx --yes netlify-cli@17 deploy --dir site/dist --alias "pr-${{ github.event.number }}"
          --site "${{ vars.NETLIFY_SITE_ID }}" --auth "${{ secrets.NETLIFY_TOKEN }}"
