name: Size report

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Compare the size of src/index.js
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          before=$(git show "$base:src/index.js" | wc -c)
          after=$(wc -c < src/index.js)
          echo "src/index.js: $before -> $after bytes" > size.txt
          echo >> size.txt
          git diff --stat "$base" HEAD >> size.txt
      - name: Comment
        run: gh pr comment "${{ github.event.number }}" --repo "$GITHUB_REPOSITORY" --body-file size.txt
        env:
          GH_TOKEN: ${{ github.token }}
