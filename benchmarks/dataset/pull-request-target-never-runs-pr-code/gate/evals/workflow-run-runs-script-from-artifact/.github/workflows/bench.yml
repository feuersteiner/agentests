name: Benchmarks

on: pull_request

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: mkdir out && npm run --silent bench > out/results.md
      - run: cp bench/comment.js out/ && echo "${{ github.event.number }}" > out/pr-number.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: out
