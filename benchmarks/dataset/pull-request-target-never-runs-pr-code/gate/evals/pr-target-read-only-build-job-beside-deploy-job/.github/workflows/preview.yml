name: Preview

on:
  pull_request_target:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build:site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - name: Deploy preview
        id: deploy
        run: |
          npx --yes netlify-cli@17 deploy --dir site --alias "pr-${{ github.event.number }}" \
            --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_TOKEN" --json > deploy.json
          echo "url=$(jq -r .deploy_url deploy.json)" >> "$GITHUB_OUTPUT"
        env:
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
      - name: Comment the preview URL
        run: >-
          gh pr comment "${{ github.event.number }}" --repo "$GITHUB_REPOSITORY"
          --body "Preview: ${{ steps.deploy.outputs.url }}"
        env:
          GH_TOKEN: ${{ github.token }}
