library:
  - changed-files:
      - any-glob-to-any-file: src/**
tests:
  - changed-files:
      - any-glob-to-any-file: test/**
benchmarks:
  - changed-files:
      - any-glob-to-any-file: bench/**
docs:
  - changed-files:
      - any-glob-to-any-file: ['README.md', 'CHANGELOG.md']
ci:
  - changed-files:
      - any-glob-to-any-file: ['.github/**', 'scripts/**']
