name: Lint changed files

on: pull_request

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint the JavaScript files this pull request changes
        run: |
          git diff --name-only --diff-filter=ACMR \
            "${{ github.event.pull_request.base.sha }}" HEAD -- '*.js' > changed.txt
          if [ -s changed.txt ]; then xargs node scripts/lint.js < changed.txt; fi
