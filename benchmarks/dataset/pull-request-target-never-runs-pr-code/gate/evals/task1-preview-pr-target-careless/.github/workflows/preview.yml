name: Preview

# pull_request_target so that pull requests from forks can use NETLIFY_TOKEN too.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:site
      - name: Deploy preview
        id: deploy
        run: |
          npx --yes netlify-cli@17 deploy --dir site/dist --alias "pr-${{ github.event.number }}" \
            --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_TOKEN" --json > deploy.json
          echo "url=$(jq -r .deploy_url deploy.json)" >> "$GITHUB_OUTPUT"
        env:
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
      - name: Comment the preview URL
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Preview of this pull request: ${{ steps.deploy.outputs.url }}',
            });
