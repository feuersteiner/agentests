name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run coverage
      - name: Upload coverage
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true
      # Pull requests, from forks too, cannot read CODECOV_TOKEN here. Save the report instead:
      # coverage.yml uploads it from a workflow_run, which can read the secret.
      - name: Save the coverage report
        if: github.event_name == 'pull_request'
        run: |
          mkdir coverage-report
          cp lcov.info coverage-report/
          echo "${{ github.event.number }}" > coverage-report/pr-number.txt
          echo "${{ github.event.pull_request.head.sha }}" > coverage-report/head-sha.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: coverage-report
          path: coverage-report

  site:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:site
      - name: Deploy to production
        if: github.event_name == 'push'
        run: >-
          npx --yes netlify-cli@17 deploy --prod --dir site/dist
          --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_TOKEN"
        env:
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
