name: Benchmarks

# pull_request_target, so the token can comment on pull requests from forks as well.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run --silent bench > bench.md
      - uses: actions/github-script@v7
        with:
          script: |
            const results = require('fs').readFileSync('bench.md', 'utf8');
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `### Benchmarks\n\n${results}`,
            });
