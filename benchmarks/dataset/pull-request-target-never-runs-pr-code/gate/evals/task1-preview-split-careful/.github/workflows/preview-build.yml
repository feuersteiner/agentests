name: Preview build

on: pull_request

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:site
      - run: echo "${{ github.event.number }}" > pr-number.txt
      - uses: actions/upload-artifact@v4
        with:
          name: preview
          path: |
            site/dist
            pr-number.txt
