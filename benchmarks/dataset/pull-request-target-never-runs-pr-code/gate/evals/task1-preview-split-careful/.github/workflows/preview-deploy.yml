name: Preview deploy

# Runs after "Preview build" with access to the secrets. It never checks out or runs the
# pull request's code: it deploys the built files as they are.
on:
  workflow_run:
    workflows: [Preview build]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: preview
          path: preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Read the pull request number
        id: pr
        run: echo "number=$(tr -cd '0-9' < preview/pr-number.txt)" >> "$GITHUB_OUTPUT"
      - name: Deploy to Netlify
        id: deploy
        run: |
          npx --yes netlify-cli@17 deploy --dir preview/site/dist \
            --alias "pr-${{ steps.pr.outputs.number }}" \
            --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_TOKEN" --json > deploy.json
          echo "url=$(jq -r .deploy_url deploy.json)" >> "$GITHUB_OUTPUT"
        env:
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
      - name: Comment the preview URL
        run: >-
          gh pr comment "${{ steps.pr.outputs.number }}" --repo "$GITHUB_REPOSITORY"
          --body "Preview of this pull request: ${{ steps.deploy.outputs.url }}"
        env:
          GH_TOKEN: ${{ github.token }}
