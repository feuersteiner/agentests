name: Welcome

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Post the contributor checklist
        run: node scripts/welcome.js "${{ github.event.number }}"
        env:
          GH_TOKEN: ${{ github.token }}
