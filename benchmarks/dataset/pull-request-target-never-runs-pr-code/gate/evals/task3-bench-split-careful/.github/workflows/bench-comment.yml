name: Benchmark comment

on:
  workflow_run:
    workflows: [Benchmarks]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bench-results
          path: bench-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Post the results
        run: |
          number=$(tr -cd '0-9' < bench-results/pr-number.txt)
          { echo '### Benchmarks'; echo; cat bench-results/results.md; } > comment.md
          gh pr comment "$number" --repo "$GITHUB_REPOSITORY" --body-file comment.md
        env:
          GH_TOKEN: ${{ github.token }}
