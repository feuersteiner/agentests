name: Benchmarks

on: pull_request

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: mkdir bench-results && npm run --silent bench > bench-results/results.md
      - run: echo "${{ github.event.number }}" > bench-results/pr-number.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results
