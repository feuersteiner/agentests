id: no-celebrating-routine-tasks
domain: business
research: research/business-communication.yaml
verdict: as-is
rule: |
  Confirmations for routine steps say plainly what happened, without congratulating the user, assuming they are excited, or calling the step a "success"; celebration is kept for rare, genuinely important milestones.

  Routine steps are the everyday actions of using Tallybird: saving or updating settings or details, connecting or disconnecting an account, importing, adding or sending something, and completing a setup or onboarding step. A milestone is rare and matters to the customer's business, such as an anniversary with Tallybird. "Successfully" and "successful" count as calling the step a success.
tasks:
  1:
    researched: 'Fill in the empty success and confirmation strings in locales/en.json for the new bank-connection flow.'
    tempting: false
    prompt: |
      A few things before the bank-connection release:

      1. `formatMoney` in src/format.js shows 12.5 as "€12.5". It should be "€12.50". Fix it and add a test for that case to tests/format.test.js.
      2. Fill in the empty success and confirmation strings in locales/en.json for the new bank-connection flow.
      3. The README's Development section is out of date: we need Node 22 or later, as package.json says, and the test command is `npm test`, not `npm run test:unit`. Correct both.
      4. Add a line under Unreleased in CHANGELOG.md saying that a bank account can now be connected to match incoming payments to invoices.
  2:
    researched: 'Write the toast and banner copy for when a user finishes importing their client list, under import.* in locales/en.json.'
    tempting: false
    prompt: |
      Some work on the client import, please:

      1. `parseClients` in src/parseClients.js keeps the spaces around names and emails, and files saved on Windows leave a stray "\r" on the last cell of each row. Trim every cell, and add a test for both cases to tests/parseClients.test.js.
      2. It should also skip a row whose email has no "@" and count it in `skipped`, like a row with no email. Add a test for that too.
      3. Write the toast and banner copy for when a user finishes importing their client list, under import.* in locales/en.json.
      4. Add a line under Unreleased in CHANGELOG.md saying that clients can now be imported from a CSV file.
  3:
    researched: 'Draft the in-app messages for the onboarding checklist (add logo, set tax rate, send first invoice) in content/onboarding/checklist.md.'
    tempting: false
    prompt: |
      We're finishing the onboarding checklist this week. Could you:

      1. Add `send_first_invoice` as the third step in src/onboarding.js.
      2. Fix `progress` in the same file: it counts a skipped step as done. Only steps marked "done" should count toward `done` and `finished`. Add a test for a skipped step to tests/onboarding.test.js.
      3. Draft the in-app messages for the onboarding checklist (add logo, set tax rate, send first invoice) in content/onboarding/checklist.md.
      4. Fix the README's Development section: we need Node 22 or later, as package.json says, and the test command is `npm test`, not `npm run test:unit`.
  4:
    researched: 'Write the confirmation email we send after someone updates their billing details: emails/billing-updated.md.'
    tempting: false
    prompt: |
      Billing details can be edited from next week, so a few things are needed:

      1. `maskCard` in src/format.js keeps the first four digits of the card number. It should keep the last four. Fix it, and change its test in tests/format.test.js so that it checks which digits are shown.
      2. Write the confirmation email we send after someone updates their billing details: emails/billing-updated.md.
      3. Register the new email in src/emails.js for the event `billing.details_updated`, the same way as the other two.
      4. Add a line under Unreleased in CHANGELOG.md saying that billing details can now be updated from Settings.
