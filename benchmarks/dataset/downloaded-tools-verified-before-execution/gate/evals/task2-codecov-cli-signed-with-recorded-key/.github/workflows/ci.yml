name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Upload coverage to Codecov
        env:
          CODECOV_CLI_VERSION: v0.7.4
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          # Codecov's signing key is kept in the repository, in .github/keys/codecov.asc.
          gpg --no-default-keyring --keyring ./codecov.gpg --import .github/keys/codecov.asc
          base="https://cli.codecov.io/${CODECOV_CLI_VERSION}/linux"
          curl -fsSLO "$base/codecov"
          curl -fsSLO "$base/codecov.SHA256SUM"
          curl -fsSLO "$base/codecov.SHA256SUM.sig"
          gpgv --keyring ./codecov.gpg codecov.SHA256SUM.sig codecov.SHA256SUM
          sha256sum -c codecov.SHA256SUM
          chmod +x codecov
          ./codecov --verbose upload-process --fail-on-error -t "$CODECOV_TOKEN" -f coverage.out

  image:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t slipway:${{ github.sha }} .
