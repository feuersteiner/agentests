name: Lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  golangci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@c2498db9c7367701631ed41f72e09c2e7ff667bb # v6.1.1
        with:
          version: latest
