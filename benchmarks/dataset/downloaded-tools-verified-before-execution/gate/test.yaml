version: 1
id: downloaded-tools-verified-before-execution
title: Downloaded tools are pinned and verified before they run
description: Scripts, Makefiles, Dockerfiles and CI workflows that download a tool, script or third-party Action pin one exact version and check it against a checksum or key recorded in the repository before it runs, and never pipe a download into a shell.
select:
  glob: ['**/*.sh', '**/*.bash', '**/Makefile', '**/*.mk', '**/Dockerfile', '**/Dockerfile.*', '**/*.Dockerfile', '**/Containerfile', '.github/workflows/*.yml', '.github/workflows/*.yaml', '.github/actions/**/action.yml', '.github/actions/**/action.yaml']
  grep: '\bcurl\b|\bwget\b|Invoke-WebRequest|gh release download|\bADD\s(?:[^\n]|\\\n)*https?://|uses:\s*[''"]?(?!actions/|\./|docker://)[\w.-]+/[^\s''"]*@'
assert:
  - id: downloads-pin-exact-version
    description: Every tool, script or archive downloaded from a URL names one exact release.
    error: Name one exact release in the download URL or its version variable, such as v1.61.0; never latest, stable, a branch, a major or minor version only, or a version looked up at run time.
    grep: '\bcurl\b|\bwget\b|Invoke-WebRequest|gh release download|\bADD\s(?:[^\n]|\\\n)*https?://'
    decide: 'This file is a shell script, Makefile, Dockerfile or GitHub Actions workflow. Every tool, installer script or release archive that it downloads from a URL in order to run, install or unpack it (with curl, wget, `gh release download`, a Dockerfile `ADD` of a URL or similar) is pinned to one exact release: the URL, or a variable or build argument the URL is built from, names a full version such as `v1.61.0` or `3.15.4`. It fails when such a download uses `latest`, `stable`, a branch such as `main` or `master`, a major or minor version only such as `v1` or `v1.61`, or a version looked up at run time, for example read from a `stable.txt` file, a releases API or a version-check service. A version kept in a variable, build argument or versions file counts as pinned unless this file shows it set to, or defaulting to, a moving value. Only downloads that are run, installed or unpacked count: a request that sends data to or reads data from an API or server, such as a webhook call, an upload or a health check, is not one, and neither are packages installed with apt-get, apk, pip, npm or go install, or container images. A file with no such download passes.'
  - id: downloads-verified-before-use
    description: Every download is checked against a checksum or key recorded in the repository before it runs, and nothing is piped into a shell.
    error: Download to a file and check it with sha256sum -c, ADD --checksum or a signature against a checksum or key written in the repository before running or unpacking it; never pipe a download into a shell or tar.
    grep: '\bcurl\b|\bwget\b|Invoke-WebRequest|gh release download|\bADD\s(?:[^\n]|\\\n)*https?://'
    decide: 'This file is a shell script, Makefile, Dockerfile or GitHub Actions workflow. Every tool, installer script or release archive that it downloads from a URL in order to run, install or unpack it (with curl, wget, `gh release download`, a Dockerfile `ADD` of a URL or similar), and every signing key it downloads to trust a package repository, is checked before it is run, installed, unpacked or trusted, against a checksum or key recorded in the repository. Recorded means written in this file, or kept in a variable, build argument, versions file or key file of the repository that this file uses. Accepted checks include `sha256sum -c` or `shasum -a 256 -c` against such a checksum, a Dockerfile `ADD --checksum=sha256:...`, and a `gpg` or `cosign` signature check against a key or key fingerprint recorded in the repository. It fails when a download is run, installed or unpacked with no such check; when the only checksum, signature or key it is checked against was itself downloaded at run time and never compared with a recorded value; or when a download is piped or fed straight into a shell, an interpreter or `tar`, such as `curl ... | sh`, `curl ... | bash`, `bash <(curl ...)`, `sh -c "$(curl ...)"` or `curl ... | tar -xz`. Only downloads that are run, installed or unpacked count: a request that sends data to or reads data from an API or server, such as a webhook call, an upload or a health check, is not one, and neither are packages installed with apt-get, apk, pip, npm or go install from their usual registry, or container images. A file with no such download passes.'
  - id: actions-pinned-to-commit-sha
    description: Every GitHub Action from outside the actions/ organisation is pinned to a full commit SHA.
    error: Pin each Action outside actions/ to a full 40-character commit SHA, with the tag as a comment, and give its tool version input an exact version, not latest.
    grep: 'uses:\s*[''"]?(?!actions/|\./|docker://)[\w.-]+/[^\s''"]*@'
    decide: 'This file is a GitHub Actions workflow or action. Look at every `uses:` value that names an Action from outside GitHub''s own `actions/` organisation, meaning anything other than `actions/...`, a local `./...` path or a `docker://` image. Each one must have, right after the `@`, a full commit SHA of exactly 40 hexadecimal characters, such as `@8f4b7f84864484a7bf31766abe9204da3cbe65b3`; a comment after it that names the tag, such as `# v6.1.1`, is fine. A tag or branch after the `@`, such as `@v4`, `@v4.6.0` or `@main`, fails, even when it names an exact release. If the step gives the Action an input that chooses the version of the tool it installs, that input must name one exact release such as `v1.61.0`; `latest`, or a major or minor version only such as `v1` or `v1.61`, fails. Other inputs, such as a token, a file name or arguments, do not matter. Steps that use `actions/...` Actions are not judged here. A file with no Action from outside `actions/` passes.'
