version: 1
id: ssrf-guard-revalidates-redirects
title: The SSRF guard covers every redirect hop
description: Python code under app/ sends requests to URLs from users with http.client, which follows no redirect, checks the peer address of every connection before sending, and limits the redirects it follows by hand.
select:
  glob: 'app/**/*.py'
  grep: 'urlopen|build_opener|OpenerDirector|http\.client|HTTPS?Connection|import requests|from requests|requests\.(get|post|put|patch|delete|head|request|Session)|httpx|aiohttp|urllib3|pycurl'
assert:
  - id: no-redirect-following-client
    description: Requests to URLs from users are sent with http.client, not with a library that follows redirects and connects on its own.
    error: Send requests to a user's URL with http.client, as _get in app/preview.py does; urlopen, urllib openers and requests follow redirects to any address and connect without a check, even when the first URL was checked.
    grep: 'urlopen|build_opener|OpenerDirector|import requests|from requests|requests\.|httpx|aiohttp|urllib3|pycurl'
    decide:
      - 'Every HTTP request this file sends goes to a URL that is fixed in the code or comes from the settings, such as a constant or a base URL from a config module with a path added.'
      - 'Every HTTP request this file sends to a URL that is not fixed in the code or the settings (for example a URL a function receives as a parameter, or one taken from a request body, from stored member data, from a webhook registration, from a fetched page or from a Location header) is sent with http.client (HTTPConnection or HTTPSConnection) or a socket, which follow no redirects and let the code check the connection. It fails when such a request is sent with urllib.request.urlopen, an opener from urllib.request.build_opener, requests, httpx, aiohttp or urllib3, because they connect to the host name themselves and follow redirects without any check, even when the first URL was checked.'
  - id: peer-address-checked
    description: Every connection to the host of a URL from a user has its peer address checked before anything is sent.
    error: After connection.connect(), check connection.sock.getpeername()[0] with is_public_address from app.net and send nothing when it fails, for the first request and every redirect hop; checking the URL with is_public_url alone leaves a gap, because the connection looks the host up again.
    grep: 'http\.client|HTTPS?Connection|socket'
    decide:
      - 'Every HTTP request this file sends goes to a URL that is fixed in the code or comes from the settings, such as a constant or a base URL from a config module with a path added.'
      - 'Every connection that this file opens itself with http.client (HTTPConnection or HTTPSConnection) or a socket, to the host of a URL that is not fixed in the code or the settings (for example a URL a function receives as a parameter, or one taken from a request body, from stored member data, from a webhook registration, from a fetched page or from a Location header), is checked before anything is sent on it: the code checks the connected socket''s peer address with is_public_address, for example is_public_address(connection.sock.getpeername()[0]) after connection.connect(), and sends nothing when the check fails; or it connects to an IP address that it resolved and checked with is_public_address itself. A request sent through a function in this file that makes this check is checked. Checking the URL with is_public_url and then connecting to the host name, which looks it up again, does not check the connection, and neither does a check made earlier, such as when the URL was registered. Requests sent with urlopen, requests or another HTTP library are not judged by this question, and a file that opens no such connection passes.'
  - id: redirect-hops-limited
    description: Redirects followed by hand stop after a fixed number of hops.
    error: Follow at most a fixed number of redirects, for example with for _ in range(MAX_REDIRECTS + 1), and give up when they run out.
    grep: '[Rr]edirect|REDIRECT|[Ll]ocation|30[1278]|is_redirect'
    decide: 'When the code in this file follows HTTP redirects itself, reading the Location header of a 3xx response and sending a new request to it (in a loop or by calling itself), it stops after a fixed maximum number of redirects: for example a for loop over range(MAX_REDIRECTS), or a count of hops compared with a maximum, after which it gives up. It fails when a while True loop or a recursive call keeps following redirects until a response is not a redirect. A file that does not follow redirects itself passes, for example one that treats a redirect as a failure, sends a single request, or leaves redirects to an HTTP library.'
