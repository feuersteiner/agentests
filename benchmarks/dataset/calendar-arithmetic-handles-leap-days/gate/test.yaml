version: 1
id: calendar-arithmetic-handles-leap-days
title: Calendar arithmetic handles leap days
description: In the Python code under billing/, certs/ and account/, a date some years or months after another is computed calendar-aware, with 29 February and month ends moved to a valid day, never by bumping the year or month number as it is or by adding 365 or 30 days.
select:
  glob: ['billing/**/*.py', 'certs/**/*.py', 'account/**/*.py']
  grep: '[Yy]ear|YEAR|[Mm]onth|MONTH|timedelta|\b[Dd]ays?\b|DAYS|[Ww]eeks?\b|WEEKS|ordinal|\b36[56]\b'
assert:
  - id: new-year-or-month-handles-missing-days
    description: A date given a new year or month number handles a day the new month lacks.
    error: A new year or month number with the same day fails for 29 February and the 29th to 31st. Use relativedelta(years=1) or relativedelta(months=1), or cap the day at calendar.monthrange(year, month)[1].
    grep: 'year|month'
    decide: 'This Python code never makes a later date by adding to a date''s year or month number while keeping the same day, as in `d.replace(year=d.year + 1)`, `d.replace(month=d.month + 1)` or `date(d.year + 1, d.month, d.day)`, wherever that appears in the file, unless the same code also makes the day valid for the new month: it caps the day at the last day of that month, for example with `calendar.monthrange`, or catches the `ValueError` and uses a set valid date such as 28 February or 1 March. Returning `None`, raising an error or skipping the date does not make it valid. Code that adds years or months with `relativedelta`, or by calling a function defined in another file, passes, and so does code that only reads or prints a date''s year or month.'
  - id: no-fixed-days-for-a-year-or-month
    description: No year or month is written as a fixed number of days.
    error: 365 or 30 days is not a year or a month and lands on a different day. Add calendar years or months with relativedelta, or with a helper that caps the day at the end of the month.
    grep: 'timedelta|[Dd]ays\s*=|ordinal|86_?400|\b36[56]\b|\b3[01]\b|\b52\b'
    decide: 'This Python code never adds a fixed number of days to a date in place of a year or a month. That happens when the code adds 365, 366, 30 or 31 days, or 52 weeks, to a date and its names, comments or docstrings call the period or the resulting date a year, a month, annual, yearly, monthly, 12 months, next year or next month, for example `issued_on + timedelta(days=365)` for a certificate valid for one year, or `BILLING_MONTH = timedelta(days=30)`; 365 or 366 days or 52 weeks with no description also counts as a year. A period the code itself describes in days, such as a 14-day trial, a 30-day grace period or a certificate valid for 90 days, is not a year or a month and passes. Subtracting days is not adding, and code that adds no days to a date passes.'
  - id: month-addition-carries-into-next-year
    description: Adding months past December moves into the next year.
    error: Adding to the month number past 12 gives an invalid month. Carry into the next year, for example with divmod(month - 1 + n, 12), or use relativedelta(months=n).
    grep: 'month'
    decide: 'If this Python code adds months to a date by adding to its month number, for example `d.month + 1` or `d.month + n`, it also handles a result past December, 12, by moving into the next year, for example with `divmod(d.month - 1 + n, 12)` or an `if month > 12` check that adds one to the year. Code that does not add to a month number passes: for example code that uses `relativedelta`, calls a function defined in another file, adds only years or days, or only reads or prints a date''s month.'
