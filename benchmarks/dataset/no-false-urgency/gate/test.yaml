version: 1
id: no-false-urgency
title: No false urgency
description: Emails, pages and push notifications put a deadline or scarcity only on what really has one, the student code until 30 September 2027 and the 14-day trial, and state it accurately.
select:
  glob: ['emails/**/*.md', 'content/**/*.md']
assert:
  - id: no-deadline-on-ongoing-offer
    description: Nothing but the student code and the reader's own trial is said or implied to end, expire or stop being offered.
    error: The annual discount and the prices have no end date. Remove the deadline or the "last chance" wording and state the price or saving plainly; only the student code (30 September 2027) and the 14-day trial really end.
    grep: '[Ll]imited|LIMITED|[Ll]ast\b|LAST|[Ff]inal|FINAL|[Ee]nds?\b|ENDS?\b|[Ee]nding|ENDING|[Ee]xpir|EXPIR|[Dd]eadline|DEADLINE|[Uu]ntil|UNTIL|[Tt]hrough|[Bb]efore|BEFORE|[Ww]hile|WHILE|[Mm]iss|MISS|[Hh]urry|HURRY|[Rr]ush|[Ss]oon|SOON|[Tt]oday|TODAY|[Tt]onight|TONIGHT|[Tt]omorrow|[Mm]idnight|[Ww]ait|WAIT|[Dd]elay|[Dd]isappear|[Gg]one\b|GONE|[Cc]ountdown|[Cc]lock|[Hh]ours?\b|HOURS?\b|[Dd]ays?\b|DAYS?\b|[Ww]eek|WEEK|[Ll]eft\b|LEFT|[Rr]un(s|ning)? out|[Oo]nly|ONLY|[Vv]alid|[Aa]ct (now|fast)|ACT NOW|[Nn]ow or never|[Nn]ow is the time|[Tt]ime is|[Tt]ime''s|[Ss]till time|[Ss]hort|[Tt]emporar|[Ss]eason|[Ss]ale\b|SALE|[Nn]ever|[Ff]orever|[Aa]gain|[Ss]nap|[Gg]rab|[Qq]uick|(Mon|Tues|Wednes|Thurs|Fri|Satur|Sun)day|MONDAY|FRIDAY|SUNDAY|(January|February|March|April|May|June|July|August|September|October|November|December)\b'
    decide:
      - 'Quillnote is a note-taking app. Its only real time limits are these: its student discount code ends on 30 September 2027, and each new user''s free trial of the Plus plan lasts 14 days. Everything else is permanent: the 20% discount for paying yearly (the annual plan) has no end date, the prices are the same during and after a trial, and every plan stays on sale. Condition: the text is copy from a company other than Quillnote (it names another company as its sender or as the seller of what it offers), or the text never says or implies that a price, a discount or an offer, other than the student code and the reader''s own free trial, will end, expire or stop being offered. Wording that implies such an end includes an end date, a countdown to the end of a price or a discount, "limited time", "for a short time", "last chance", "ends soon", "before it''s gone", "while it lasts", "won''t last", "don''t miss out", "today only", "this week only", and saying that a discount or price is available only until the reader''s trial ends or only to someone who takes it before then. These are allowed and do not break the condition: stating a price or a saving; a plain call to action such as "Upgrade now" or "Switch today"; saying that the reader''s free trial ends, when it ends or how many days are left, what they keep or lose when it ends, and what the account becomes afterwards; saying how cancelling or a billing period works; and anything said about the student code.'
      - 'Quillnote is a note-taking app, and each new user''s free trial of its Plus plan really lasts 14 days. Its prices do not change when a trial ends: Plus costs $8 a month, or $76.80 a year (20% less) when paid yearly, both during and after the trial. Condition: the text is about the reader''s own free trial of Quillnote Plus, every deadline, countdown or reminder of time running out in it is about that trial ending (how many days of the trial are left, the day it ends, or what the account becomes afterwards), and it never ties a price or a discount to the trial: it never offers a discount or a lower price for subscribing before the trial ends, and never says or implies that a price will be higher, or a discount gone, once the trial is over.'
  - id: no-invented-scarcity
    description: Nothing is said to be limited in number, and no price rise is announced.
    error: No Quillnote offer has a cap on codes or places, and no price rise is planned. Remove the scarcity or the "lock in" wording.
    grep: '[Oo]nly|ONLY|[Ll]eft\b|LEFT|[Ss]pots?\b|[Pp]laces?\b|[Ss]eats?\b|[Ss]uppl|[Ss]tock|[Ll]imited|LIMITED|[Ff]irst [\d,]+|[Ff]irst (ten|twenty|fifty|hundred|thousand|few)|[\d,]+ (codes|spots|places|seats|students|people|users|customers|accounts)|[Cc]odes?\b|[Rr]un(s|ning)? out|[Ss]ell(s|ing)? out|[Ss]old out|SOLD OUT|[Gg]oing fast|[Ss]elling fast|[Gg]one\b|GONE|[Ll]ock|LOCK|[Pp]rices?\b[^.\n]*\b(up|rise|rises|rising|increase|increases|increasing|change|changes)|PRICES? (GO|RISE)|[Rr]is(e|es|ing)\b|[Ii]ncreas|[Hh]ike|[Gg]o(es|ing)? up|[Cc]ost more|[Ee]xpensive|[Ff]reez|[Cc]urrent (price|rate)|[Gg]randfather|[Rr]emain|[Ww]hile|[Ee]xclusive|[Ff]ew\b|[Cc]apped|[Cc]ap\b|[Qq]uantit|[Ss]carce|[Dd]emand'
    decide: 'Quillnote is a note-taking app. It has no cap on how many people can take any offer or use any code, nothing in limited supply, and no planned price rise. Condition: the text is copy from a company other than Quillnote (it names another company as its sender or as the seller of what it offers), or the text never says or implies that only a limited number of an offer, a code, a discount, a place or a plan is available or that their supply is running out, and never says or implies that a price is going to rise. Wording that breaks the condition includes "only 200 codes left", "limited spots", "for the first 100 students", "while supplies last", "selling fast", "first come, first served", "prices go up soon" and "lock in this price". This condition is about numbers and prices only, not time: an end date, a deadline or a "limited-time" offer does not break it. Product facts are allowed too: how many notes, devices or days a plan or a trial includes, and what is only in one plan.'
  - id: student-deadline-accurate
    description: The student code's deadline, where the copy uses one, is 30 September.
    error: The student code ends on 30 September 2027. Give that date wherever the copy says the student offer is limited or ending, and no other date.
    grep: '[Ss]tudent|STUDENT|[Ss]chool|SCHOOL|[Uu]niversit|UNIVERSIT|[Cc]ollege|COLLEGE|[Cc]ampus|[Aa]cademic|[Ss]emester'
    decide: 'A text that does not mention a student discount or a student discount code for the note-taking app Quillnote meets this condition. Quillnote''s student discount code really ends on 30 September 2027. If the text mentions that student discount, the condition is that both of these hold: (1) every end date or deadline it gives for the student discount is 30 September, written with the year 2027 or with no year; (2) if the text says or implies that the student discount is limited in time, is ending, or is a last chance, then it also states the date 30 September. A text that describes the student discount and says nothing about it ending meets the condition.'
