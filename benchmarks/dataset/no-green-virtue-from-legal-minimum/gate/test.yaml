version: 1
id: no-green-virtue-from-legal-minimum
title: No green virtue from a legal minimum
description: Pages, packs and ads never sell being microbead-free or having a CFC-free propellant, which UK law requires, as an environmental benefit; they may state them as plain facts.
select:
  glob: ['content/**/*.md']
  grep: '[Mm]icro-?\s?([Bb]eads?|[Pp]lastics?)|MICRO-?\s?(BEADS?|PLASTICS?)|[Pp]lastic[- ][Ff]ree|PLASTIC[- ]FREE|[Pp]lastic ([Bb]eads?|[Pp]articles?|[Bb]its|[Ss]crubs?|[Ee]xfoliants?|[Nn]asties)|[Ff]ree ([Ff]rom|[Oo]f) ([Aa]ny )?[Pp]lastics?|CFC|[Cc]hloro-?fluoro|[Oo]zone|OZONE|[Pp]ropellant|PROPELLANT'
assert:
  - id: microbead-free-not-sold
    description: Being free of plastic microbeads is not presented as an environmental benefit or a selling point.
    error: 'UK law has banned plastic microbeads in rinse-off cosmetics since 2018, so being microbead-free is not a green benefit. Take it out of the benefits, headlines, badges and differentiators and state it only as a plain product fact, or leave it out; sell the recycled-plastic bottles or the refill pouches instead.'
    grep: '[Mm]icro-?\s?([Bb]eads?|[Pp]lastics?)|MICRO-?\s?(BEADS?|PLASTICS?)|[Pp]lastic[- ][Ff]ree|PLASTIC[- ]FREE|[Pp]lastic ([Bb]eads?|[Pp]articles?|[Bb]its|[Ss]crubs?|[Ee]xfoliants?|[Nn]asties)|[Ff]ree ([Ff]rom|[Oo]f) ([Aa]ny )?[Pp]lastics?'
    decide: 'In the UK, rinse-off cosmetics (face washes, scrubs, cleansers, body washes, shower gels, shampoos and toothpastes) have been banned by law from containing plastic microbeads since 2018, so every one of them is microbead-free. Being free of microbeads is therefore a legal minimum for a rinse-off product, not an environmental benefit. The same feature goes by other names: free of microplastics, no plastic beads, plastic-free exfoliation, a plastic-free scrub. Condition: the text never presents a rinse-off product being free of microbeads as an environmental benefit or a selling point. It breaks the condition only if that feature is: (1) called good for, kind to, safe for or protecting the ocean, the sea, rivers, marine life, wildlife, the planet or the environment, or called eco-friendly, green or sustainable; (2) an item in a list of benefits, highlights, green credentials, differences from other brands or reasons to buy; (3) a headline, a heading, an ad headline, a tagline, a badge or a pack flash; (4) contrasted with other brands or products; or (5) described as the company''s choice, commitment or promise, or as something it refuses to use. Judge only the words about microbeads themselves: green claims about other features in the same text, such as a bottle made from recycled plastic or refill pouches, do not count against a plain statement about microbeads. These meet the condition: the feature stated as a plain product fact, for example in a specification, details or ingredients list, also with its legal status, such as "Microbead-free (required by UK law)"; writing about plastic pollution that does not present a product as free of microbeads; naming what a product exfoliates with, such as ground apricot shell; and other features, such as a bottle made from recycled plastic, refill pouches or plastic-free packaging, which are not about microbeads. A text that never says a product is free of microbeads, microplastics or plastic beads meets the condition.'
  - id: cfc-free-not-sold
    description: A CFC-free propellant is not presented as an environmental benefit or a selling point.
    error: 'CFCs are banned in every aerosol, so a CFC-free propellant is not a green benefit. Take "CFC-free" and "ozone-friendly" out of the benefits, headlines, badges, pack flashes and differentiators and state the propellant only as a plain product fact, or leave it out.'
    grep: 'CFC|[Cc]hloro-?fluoro|[Oo]zone|OZONE|[Pp]ropellant|PROPELLANT'
    decide: 'CFCs have been banned in aerosols in the UK for decades, so every aerosol sold there, such as a deodorant, a hairspray or a dry shampoo, has a CFC-free propellant. Being CFC-free is therefore a legal minimum for an aerosol, not an environmental benefit. Condition: the text never presents an aerosol''s propellant, or its being CFC-free, as an environmental benefit or a selling point. It breaks the condition only if that feature is: (1) called good for, kind to, safe for or protecting the ozone layer, the atmosphere, the planet or the environment, or called ozone-friendly, eco-friendly or green; (2) an item in a list of benefits, highlights, green credentials, differences from other brands or reasons to buy; (3) a headline, a heading, an ad headline, a tagline, a badge or a pack flash such as "CFC-FREE"; (4) contrasted with other brands or products; or (5) described as the company''s choice, commitment or promise. These meet the condition: the propellant, or its being CFC-free, stated as a plain product fact, for example in a specification or ingredients list, also with its legal status, such as "CFC-free propellant, as required by law" or "Propellant: butane, propane"; safety warnings about a flammable propellant or a pressurised can; and other features, such as recycled plastic or refill pouches, which are not about the propellant. A text that never mentions CFCs, the ozone layer or a propellant meets the condition.'
