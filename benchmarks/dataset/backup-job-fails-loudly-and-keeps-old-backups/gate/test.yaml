version: 1
id: backup-job-fails-loudly-and-keeps-old-backups
title: Backup jobs fail loudly and keep old backups until the new one is verified
description: Shell backup and export jobs alert and exit non-zero on any failure, check that each dump or archive has a plausible size, and delete older backups only after the new one is uploaded and verified.
select:
  glob: ['ops/**/*.sh', 'scripts/**/*.sh', 'bin/**/*.sh']
  grep: '[Bb]ackup|BACKUP|[Dd]ump|DUMP|[Ss]napshot'
assert:
  - id: failures-alert-and-exit-non-zero
    description: Every failure of the job alerts through the monitored channel and ends it with a non-zero exit.
    error: Make every failure page on-call and exit non-zero, for example `set -euo pipefail` with an EXIT trap that calls `ops/notify.sh` when the status is non-zero; a log line or stderr message is not an alert.
    decide:
      - 'This file is a shell script. If it is not a backup or export job, meaning it neither dumps a database nor archives files nor copies such a dump or archive to a bucket or another host, it passes. If it is one, both of these hold. First, no failure goes unnoticed: every pipeline whose earlier commands include a dump, archive or upload step (such as `pg_dump | gzip > file` or `pg_dumpall | gzip > file`) is covered by `set -o pipefail` (or `set -euo pipefail`) in this file or by a check of `PIPESTATUS`, because otherwise the shell sees only the status of the last command; a size check after the pipeline does not make up for it, since a dump that stopped halfway can still be large. And no step''s failure is swallowed, such as with `|| true`, `|| echo ...` or by running it in the background without waiting for it. Second, every failure, whether a failed command or the job''s own `exit 1` after a failed check, calls `ops/notify.sh` (by any path, such as `"$here/notify.sh"`) and ends the job with a non-zero exit status. Either of two patterns does this: an `EXIT` trap that calls `ops/notify.sh` when the exit status is non-zero; or `set -e` with an `ERR` trap that calls `ops/notify.sh` (after the trap runs, `set -e` still ends the script with a non-zero status), plus a call to `ops/notify.sh` before each explicit `exit 1`. Output only to stdout, stderr or a log file is not an alert. A script with no pipeline does not need `pipefail`.'
      - 'This file is another company''s script, not Acme Tutors'': it does not mention Acme, and none of its bucket names, host names or paths contains `acme`.'
  - id: output-size-checked
    description: Each dump or archive is checked against a plausible minimum size, and the job fails below it.
    error: Compare each dump or archive with at least half its normal size (about 1 GB for Acme Tutors' database dump, 3 GB for an uploads archive) and exit non-zero below it; a non-empty check is not enough, since a gzip of nothing is still about 20 bytes.
    decide:
      - 'This file is a shell script. If it is not a backup or export job, meaning it neither dumps a database nor archives files, it passes. If it is one: for every database dump and every file archive the job creates, the file compares its size in bytes (of the local file, or of the uploaded object) with a minimum of at least half its normal size, and when the size is below that minimum the job exits with a non-zero status. An Acme Tutors database dump (from `pg_dump` or `pg_dumpall`) is normally about 2 GB, so its minimum is at least 1 GB (1,000,000,000 bytes or 1 GiB), and an archive of the uploads directory is normally about 6 GB, so its minimum is at least 3 GB. A check only that the file exists or is not empty (`-s`, size greater than 0), or a minimum of a few kilobytes or megabytes, does not count. A second copy of a dump that was already checked needs no check of its own.'
      - 'This file is another company''s script, not Acme Tutors'': it does not mention Acme, and none of its bucket names, host names or paths contains `acme`.'
  - id: prunes-only-after-verified-upload
    description: Older backups are deleted only after the new backup was uploaded and checked at its destination.
    error: Delete older backups last, only after checking the new upload at its destination, for example with `aws s3api head-object`; an expiry rule or a deletion that runs regardless of earlier steps can delete the last good backup.
    grep: '\brm\b|[Dd]elete|DELETE|[Pp]rune|[Ee]xpir|[Ll]ifecycle|[Rr]etention|-mtime|unlink'
    decide: 'This file is a shell script. If it deletes no older backup, it passes; removing the job''s own temporary working copy of the new dump or archive, such as `rm -rf "$work"` or `rm -f` of the local file it has just uploaded, is not deleting an older backup. Otherwise, for each bucket or directory from which it deletes older backups (with `aws s3 rm`, `aws s3api delete-object`, `find ... -delete`, `rm`, or `aws s3 sync --delete`), the file first uploads the new backup to that same bucket or directory and then checks that copy there, for example with `aws s3api head-object` on that bucket or `aws s3 ls` of the new object, with or without comparing its size; the deletion runs only after that check, on the path where every earlier step succeeded. So each of these fails: a deletion before the upload; a deletion right after an upload command with no check of the uploaded copy; deleting old backups from a bucket whose new copy was not itself checked, even when the copy in another bucket was; a deletion that runs even after an earlier step failed, such as in an `EXIT` trap or after `|| true`; and an expiry or lifecycle rule set on a bucket, which deletes old backups by age whatever happens to new ones.'
