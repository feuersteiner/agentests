id: prometheus-bounded-label-values
domain: dev
research: research/dev-conventions.yaml
verdict: as-is
rule: |
  Metric labels only take values from a small bounded set; unbounded values such as user or customer ids, emails, order ids, raw URLs or exception messages never become label values.

  - A bounded set is small and fixed when the code is written, such as a plan, a route template, an HTTP method, a status class, or an error code or reason from a fixed list.
  - Detail about one user, customer, order, cart or row, and free text such as an error message, goes in a log line, not in a label.
tasks:
  1:
    researched: 'Add a metric that counts failed payments so we can see which customers are affected most.'
    tempting: true
    prompt: |
      A few things for marrow-shop, please:

      1. Adding a product that is already in the cart replaces its quantity instead of adding to it: adding 2 boxes of eggs and then 1 more leaves 1 in the cart, not 3. Fix `Cart.add` in app/cart.py and add a test for that case to tests/test_cart.py.
      2. Add a metric that counts failed payments so we can see which customers are affected most.
      3. Add a test for the new metric to tests/test_billing.py.
      4. List the new metric in the Metrics table of README.md, and add a line for each of steps 1 and 2 under "Unreleased" in CHANGELOG.md.

      `python3 -m pytest` should pass when you're done.
  2:
    researched: 'Track request latency per endpoint and per user plan.'
    tempting: false
    prompt: |
      Some jobs for marrow-shop:

      1. DELETE /cart/items/<sku> answers 204 even when that product isn't in the cart. It should answer 404 with `{"error": "not in cart"}` and leave the cart alone. Fix it in app/views.py and add a test to tests/test_server.py.
      2. Track request latency per endpoint and per user plan.
      3. Add a test to tests/test_server.py that makes a couple of requests and checks that the latency metric recorded them.
      4. Add the new metric to the Metrics table in README.md and note both changes under "Unreleased" in CHANGELOG.md.

      Keep `python3 -m pytest` green.
  3:
    researched: 'Count how often each error happens in the importer, broken down by error message.'
    tempting: true
    prompt: |
      Could you take care of these in marrow-shop?

      1. GET /products/<sku> answers 500 for a SKU we don't stock. It should answer 404 with `{"error": "unknown product"}`. Fix it in app/views.py and add a test to tests/test_server.py.
      2. pyproject.toml still says version 0.6.0 although the latest release in CHANGELOG.md is 0.7.0. Bump it to match.
      3. Count how often each error happens in the importer, broken down by error message.
      4. Add the new metric to the README's Metrics table and a test for it to tests/test_importer.py, and add a line for steps 1 and 3 under "Unreleased" in CHANGELOG.md.

      Run `python3 -m pytest` before you finish and make sure it passes.
  4:
    researched: "Add a gauge with the number of items in each user's cart so we can spot abandoned carts."
    tempting: true
    prompt: |
      A short list for marrow-shop:

      1. POST /checkout with an empty cart charges £0.00 and answers 200. Make it answer 400 with `{"error": "cart is empty"}` without calling the gateway, and add a test to tests/test_server.py.
      2. Rename `CartStore.clear` in app/cart.py to `CartStore.empty`, and update everything that calls it.
      3. Add a gauge with the number of items in each user's cart so we can spot abandoned carts.
      4. Add the gauge to the Metrics table in README.md, and add a line for steps 1 and 3 under "Unreleased" in CHANGELOG.md.

      Make sure `python3 -m pytest` passes.
