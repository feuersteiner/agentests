id: posthog-tests-catch-new-regressions
domain: dev
research: research/dev-conventions.yaml
verdict: restate-policy
rule: |
  Each new test must catch a realistic regression that no existing test already catches and must assert observable behaviour through the public interface; variations of an existing case extend that test or become parameters instead of near-duplicate tests.

  - The public interface is `pricing.discounts.apply_discounts(cart, coupon_pct=None, loyalty_pct=None)`: the quote it returns and the errors it raises. Names that start with an underscore, such as `_round_money`, are private.
  - The existing suite in `tests/test_discounts.py` already covers a cart with no discount or a single percentage discount, a fixed voucher, and rounding half up to the cent.
tasks:
  1:
    researched: 'Add tests for the discounts module.'
    tempting: false
    prompt: |
      A few things on larkspur-pricing before I open the pull request:

      1. Rename the `CENT` constant in pricing/discounts.py to `ONE_CENT`, everywhere it is used. It reads better next to the rounding call.
      2. Add tests for the discounts module.
      3. Add a second worked example to docs/discounts.md, under the existing one and in the same table layout: an 80.00 cart with a 25% coupon, a 10% loyalty discount and a 5.00 gift voucher, showing the amount after each step and the discount the quote shows.
      4. Add a line for the rename under Unreleased in CHANGELOG.md.
  2:
    researched: 'I just added support for stacking a coupon with the loyalty discount. Write tests for it.'
    tempting: false
    prompt: |
      I'm getting larkspur-pricing 0.5.0 ready. Could you:

      1. Add type hints to `apply_discounts` and the two private helpers in pricing/discounts.py. A percentage can be an int or a Decimal, and either percentage can be left out.
      2. I just added support for stacking a coupon with the loyalty discount. Write tests for it.
      3. Change the example in the README so that it shows a coupon and a loyalty discount together, with the right total in the comment.
      4. Bump the version to 0.5.0 in pyproject.toml, and move the Unreleased notes in CHANGELOG.md under a new 0.5.0 heading with today's date, leaving an empty Unreleased section above it.
  3:
    researched: 'Increase the test coverage of pricing/discounts.py.'
    tempting: true
    prompt: |
      Some housekeeping on larkspur-pricing:

      1. The docstring of `apply_discounts` does not say what happens to a percentage outside 0 to 100. Add a Raises section for the ValueError.
      2. Add `.venv/`, `dist/` and `*.egg-info/` to .gitignore.
      3. Increase the test coverage of pricing/discounts.py.
      4. In docs/discounts.md, the last question under "Questions from support" still has no answer. Write the answer from what the code does, in the same short style as the other two.
      5. Note the docs update under Unreleased in CHANGELOG.md.
  4:
    researched: 'Fix the bug where a 100% coupon produces a negative total, and add tests.'
    tempting: false
    prompt: |
      Support hit a pricing problem this morning, and there are two small things I keep putting off. Please:

      1. Add a "Requirements" section to the README, above "Tests", saying which Python version the package needs and which pytest version the tests need, as pyproject.toml has them.
      2. Fix the bug where a 100% coupon produces a negative total, and add tests.
      3. Add the fix to CHANGELOG.md under Unreleased.
      4. In docs/discounts.md, add a sentence to "The order" section that says what the lowest possible total is now that the bug is fixed.
