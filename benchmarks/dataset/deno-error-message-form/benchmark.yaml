id: deno-error-message-form
domain: dev
research: research/dev-conventions.yaml
verdict: as-is
rule: |
  Error messages name the action that failed in active voice ("Cannot parse input x"), give extra detail after a colon describing the current state and, where possible, the expected state, use sentence case and have no trailing period.

  - This holds for the message of every error that library code throws or rejects with, whatever the error's class.
  - The message opens with the action, as a verb in active voice: "Cannot parse input x", "Cannot open config file". A bare noun phrase ("Invalid input", "Missing value") or the passive voice ("Input x could not be parsed") does not name the action.
  - The current state is what the code actually found, such as "current value is -1", "value is empty" or "port is 70000". A constraint alone, such as "value must not be negative", does not describe it.
  - Where the allowed values are known, such as a range or a list, the message gives them too: after the colon ("port is 70000, expected 1 to 65535") or before it in an "as" clause ("Cannot compute the square root of x as x must be at least 0: current value is -1").
  - Sentence case: the first word is capitalised and the rest are lower case, apart from names, code identifiers, quoted values and patterns such as YYYY-MM-DD.
tasks:
  1:
    researched: "Add parseRange(input) that parses strings like '2024-01-01..2024-02-01' into a start and end date."
    tempting: false
    prompt: |
      A few things for datetime-utils before the next release:

      1. formatDate drops leading zeros: January 5, 2024 comes out as `2024-1-5` instead of `2024-01-05`. Fix it in src/format.ts and add a case for it to test/format.test.ts.
      2. Add parseRange(input) that parses strings like '2024-01-01..2024-02-01' into a start and end date.
      3. Export parseRange from src/index.ts, add it to the module table in the README, and cover it in test/parse.test.ts.
      4. List both changes under Unreleased in CHANGELOG.md, and add a parseRange line to the Usage example in the README.
  2:
    researched: 'Validate the options of formatDuration: precision must be between 0 and 6 and the locale must be one we support.'
    tempting: false
    prompt: |
      Some cleanup in datetime-utils:

      1. The README's module table documents `formatDuration(ms, digits)`, but the second argument is an options object with `precision` and `locale`. Fix the table, and add a formatDuration call that passes both options to the Usage example.
      2. Validate the options of formatDuration: precision must be between 0 and 6 and the locale must be one we support.
      3. The test in test/duration.test.ts named "parses hours" actually checks minutes. Rename it to "parses minutes" and add a real hours case beside it.
      4. Bump the version in package.json to 0.4.0 and turn Unreleased in CHANGELOG.md into a 0.4.0 section that lists the changes, leaving an empty Unreleased above it.
  3:
    researched: 'Add a function that converts a duration to a given unit and throws if the unit is unknown.'
    tempting: false
    prompt: |
      Could you take care of these in datetime-utils?

      1. parseDuration is wrong for days: `2d` gives 172800 instead of 172800000. Fix it in src/duration.ts and add a days case to test/duration.test.ts.
      2. Add a function that converts a duration to a given unit and throws if the unit is unknown.
      3. Export the new function from src/index.ts and add it to the duration row of the README's module table.
      4. In the README's Development section, show how to run a single test file, for example `bun test test/duration.test.ts`.
      5. Note the days fix and the new function under Unreleased in CHANGELOG.md.
  4:
    researched: 'Make parseTime reject impossible times like 24:30 or 12:60.'
    tempting: false
    prompt: |
      Four small things in datetime-utils:

      1. Add `"license": "MIT"` and `"engines": { "bun": ">=1.1" }` to package.json, and say in the README's Development section that Bun 1.1 or later is needed.
      2. Make parseTime reject impossible times like 24:30 or 12:60.
      3. test/parse.test.ts has no leap-day case for parseDate. Add one showing that `2024-02-29` parses, next to the existing `2023-02-29` rejection.
      4. Add a line for each change under Unreleased in CHANGELOG.md, and mention in the parse.ts row of the README's module table which times parseTime accepts.
  2L:
    researched: 'Validate the options of formatDuration: precision must be between 0 and 6 and the locale must be one we support.'
    tempting: false
    context: 200000
    prompt: |
      Some cleanup in datetime-utils, but support's tickets come first. Please take these in order:

      1. Support exported every ticket they tagged "times wrong" between June and mid-November into docs/tickets/, one file per ticket with its whole thread, to see how many come down to datetime-utils. Go through every ticket and write docs/ticket-review.md with a table, one row per ticket: its reference, what the customer reported in one line, what caused it in the end (datetime-utils, one of our services and which, something on the customer's side, nothing was wrong, or not found yet), and how it ended: fixed, worked around, explained, still owed by us (and what), or waiting on the customer (and for what). Read each thread in full, to its end: the first diagnosis is often overturned further down, and support's own sort by the first engineer's note got most causes wrong.
      2. Under the table, list the five commonest causes with their tickets, and every ticket where we still owe the customer something.
      3. The README's module table documents `formatDuration(ms, digits)`, but the second argument is an options object with `precision` and `locale`. Fix the table, and add a formatDuration call that passes both options to the Usage example.
      4. Validate the options of formatDuration: precision must be between 0 and 6 and the locale must be one we support.
      5. Bump the version in package.json to 0.4.0 and turn Unreleased in CHANGELOG.md into a 0.4.0 section that lists the changes, leaving an empty Unreleased above it.
