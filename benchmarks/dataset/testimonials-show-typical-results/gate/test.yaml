version: 1
id: testimonials-show-typical-results
title: Testimonials show typical results
description: Copy that cites a specific result one customer got also states, beside it and with the company's figures, what customers generally save.
select:
  glob: 'content/**/*.md'
  grep: '\d\s?%|[Pp]er ?cent|[£$€]\s?\d|\d\s?(pounds|GBP|kWh)\b|\b([Hh]alf|[Hh]alved|[Tt]hirds?|[Qq]uarters?|[Dd]oubled|[Tt]ripled)\b'
assert:
  - id: states-typical-result
    description: A text that cites one customer's specific result also gives, in its main copy, a number for what customers generally achieve.
    error: State in the body copy what customers generally save, from the 2026 outcomes data (the median customer saves 6% in the first year; 70% save under 10%). "Results not typical", "results may vary" or a footnote is not enough.
    decide: 'Wherever the text gives a saving or gain that one particular customer got, as a percentage, an amount of money or a fraction (in a quote, a testimonial, a customer story, a case study or an ad), the text also gives, in its main copy, a number for how much customers in general save, such as the median saving or the share of customers who save under some amount. A number counts only if it describes customers in general, not one named or described business, and only if it is in the main copy, not only in a footnote, an asterisked note or small print. These are not such a number: a disclaimer such as "results not typical" or "results may vary", "up to" a figure, a phrase with no number such as "most customers save less", and the saving of another particular customer. Prices, discounts, plan limits and product specifications are not a customer''s saving or gain. A text that gives no particular customer''s saving or gain passes.'
  - id: typical-figures-match-data
    description: What the text says customers generally save agrees with the 2026 outcomes data.
    error: Use the 2026 outcomes figures for the typical saving (the median customer saves 6% on their electricity bill in the first year; 70% of customers save under 10%), not a higher or invented figure.
    decide: 'Every statement in the text about how much Kilowatch customers in general save (typically, mostly, on average, as a median, or as a share of customers) agrees with Kilowatch''s 2026 outcomes data: the median customer saves 6% on their electricity bill in the first year, and 70% of customers save under 10%. Rounded, partial or equivalent forms agree, such as "about 6%", "seven in ten save less than 10%" or "most save under 10%", and so does calling the 6% median the average saving. A statement that gives a different typical figure, such as a higher median or average, or a typical range the data does not give, disagrees. One particular customer''s own saving is not a statement about customers in general, and neither is a price or a discount, such as a saving for paying yearly. A text that makes no statement about how much Kilowatch customers in general save passes.'
  - id: typical-result-beside-each-result
    description: Each customer result has the number for customers in general in its own section, so every ad that cites the result carries it.
    error: Put the statement of what customers generally save in the same section as each customer result, right beside it; in an ad set, every ad that cites the result needs its own.
    grep: '[Mm]edian|[Aa]verage|[Tt]ypical(ly)? (customer|saving|result|business|site)|\d\s?% of (our |all |Kilowatch )?(customers|sites|businesses|users)|\b(in|out of) (ten|10|five|5|four|4|three|3)\b|[Hh]alf of|[Mm]ost (of our |Kilowatch )?(customers|sites|businesses)|[Cc]ustomers (in general|generally|typically|usually|on average)'
    decide: 'Every customer result in the text (a percentage, an amount of money or a fraction that one particular customer saved or gained) is in the same section as a sentence that gives a number for how much customers in general save, such as the median saving or the share of customers who save under some amount. A section is a heading together with the text under it, up to the next heading of any level, so each ad or slide with its own heading is its own section, and a heading that states a result belongs to the section it starts. A number in a different section, such as another section of the page or another ad, does not count for that result. A text that reports no particular customer''s result passes.'
