version: 1
id: no-unqualified-green-claims
title: No unqualified green claims
description: Fernleaf Botanics pages, captions and emails make no broad environmental claim without one of the two substantiated facts in the same sentence, and claim no environmental benefit beyond those two facts.
select:
  glob: ['content/**/*.md', 'emails/**/*.md']
  grep: '\b[Ee]co\b|\b[Ee]co-|\b[Ee]co[A-Zf]|\b[Ee]colog|\bECO\b|\bECO-|[Gg]reen|GREEN|[Ss]ustainab|SUSTAINAB|[Pp]lanet|PLANET|[Ee]arth|EARTH|[Ee]nvironment|ENVIRONMENT|\b[Nn]ature\b|\bNATURE\b|[Cc]limate|CLIMATE|[Cc]arbon|CARBON|CO2|CO₂|[Ee]missions?\b|[Ff]ootprint|[Nn]et[- ]?[Zz]ero|[Oo]ffset|[Pp]lastic|PLASTIC|[Rr]ecycl|RECYCL|[Cc]ompost|[Bb]iodegrad|[Ww]aste|WASTE|[Ll]andfill|[Pp]ollut|[Oo]cean|[Rr]eef|[Ff]orests?\b|[Pp]lant(s|ed|ing)? (a |one )?trees?|[Rr]enewable|[Ss]olar|[Cc]ircular|[Cc]onscious|[Rr]esponsibl|[Gg]uilt[- ]free|[Ww]ildlife|[Rr]efill|REFILL|[Cc]ardboard'
assert:
  - id: broad-claim-qualified
    description: Every broad environmental claim has one of the two substantiated facts in the same sentence.
    error: 'Put one of the two substantiated facts in the same sentence as the broad claim (the refill pouch uses 70% less plastic than the bottle it refills, by weight; the shipping boxes are 100% recycled cardboard), or remove the broad claim.'
    decide:
      - 'The text names a company or brand other than Fernleaf Botanics as the seller of what it promotes or as the sender of the message, and never mentions Fernleaf. A supplier, a courier or a testing lab that the text mentions is not the seller or the sender.'
      - 'Fernleaf Botanics, a skincare brand, has evidence for exactly two environmental facts: its refill pouch uses 70% less plastic than the Everyday Cleanser bottle it refills, by weight, and its shipping boxes are made from 100% recycled cardboard. The condition: every broad environmental claim in the text comes with one of these two facts, placed in one of these ways: (a) in the same sentence as the broad claim, which includes a fact that follows the broad words after a colon or a dash, as in "a kinder way to shop: every order ships in a box made from 100% recycled cardboard"; (b) when the broad claim is in a heading, in the heading itself or in the first sentence below the heading; (c) when the broad claim is a hashtag, anywhere in the caption that the hashtag ends. One of the two facts placed in one of these ways is enough, even when the broad words say more than the fact. A fact placed anywhere else does not count. A broad environmental claim is a general statement that a product, its packaging, its delivery or the company is good for the environment or does it less harm, such as "eco-friendly", "green", "sustainable", "planet-friendly", "better for the planet", "kind to the earth", "earth-conscious", "low-impact", "a greener choice", "guilt-free" or "doing our bit for the planet", including in a title, a description, a subject line or a hashtag. These are not broad environmental claims: any statement about plastic or a plastic saving, such as "less plastic", or about recycled material or cardboard, in words or in a hashtag; the name of Earth Day, and a heading such as "Our planet", when it does not itself say that the product or company is good for the environment; "natural", "vegan", "cruelty-free" and "fragrance-free"; the word green used for a colour or in the name of an ingredient; practical statements about how refilling works, such as keeping the bottle and pouring in a pouch; and a hashtag that only names a product, a brand or refills. A text with no broad environmental claim meets the condition.'
  - id: no-other-environmental-benefit
    description: The copy claims no environmental benefit other than less plastic in the refill pouch and recycled cardboard shipping boxes.
    error: 'Fernleaf holds evidence for two environmental facts only: the refill pouch uses 70% less plastic than the bottle it refills, by weight, and the shipping boxes are 100% recycled cardboard. Remove any other environmental benefit, such as recyclable, compostable, plastic-free, carbon-neutral or less waste.'
    decide:
      - 'The text names a company or brand other than Fernleaf Botanics as the seller of what it promotes or as the sender of the message, and never mentions Fernleaf. A supplier, a courier or a testing lab that the text mentions is not the seller or the sender.'
      - 'Fernleaf Botanics, a skincare brand, has evidence for exactly two environmental facts and no others: its refill pouch uses 70% less plastic than the Everyday Cleanser bottle it refills, by weight, and its shipping boxes are made from 100% recycled cardboard. The condition: the text claims no environmental benefit of another kind for Fernleaf, its products, their packaging or their delivery. Benefits of another kind include being recyclable, compostable, biodegradable, plastic-free or zero-waste; being carbon-neutral, low-carbon or net zero, or offsetting emissions; using renewable energy; being reef-safe or ocean-friendly; saving water or energy; planting trees; and producing less waste or a smaller footprint. These are not benefits of another kind, whatever figure or item they name: a claim that something uses less plastic, and a claim that something is made from recycled material or recycled cardboard. Broad words such as "eco-friendly", "green" or "sustainable" do not count here either, and neither do "natural", "vegan", "cruelty-free", "fragrance-free" or practical statements about how refilling works. A text that claims no benefit of another kind meets the condition.'
  - id: facts-stated-no-stronger
    description: The plastic saving and the recycled cardboard are claimed for no more than the refill pouch and the shipping boxes, and the saving for no more than 70%.
    error: 'State the facts as they are: the refill pouch uses 70% less plastic than the Everyday Cleanser bottle it refills, by weight, and the shipping boxes are 100% recycled cardboard. Do not raise the figure or extend either fact to other products or packaging.'
    grep: '[Pp]lastic|PLASTIC|[Rr]ecycl|RECYCL|[Cc]ardboard|\d ?%|[Pp]er ?cent|[Ll]ess\b|LESS|[Ff]ewer|[Ss]av(e|es|ed|ing)\b|[Cc]ut|[Rr]educ|[Hh]alf|[Tt]hirds?\b|[Pp]ackag|PACKAG|[Mm]aterial|[Gg]lass|[Aa]lumin'
    decide:
      - 'The text names a company or brand other than Fernleaf Botanics as the seller of what it promotes or as the sender of the message, and never mentions Fernleaf. A supplier, a courier or a testing lab that the text mentions is not the seller or the sender.'
      - 'Fernleaf Botanics, a skincare brand, has exactly two environmental facts: (1) its refill pouch uses 70% less plastic than the Everyday Cleanser bottle it refills, by weight; (2) its shipping boxes are made from 100% recycled cardboard. The condition: whenever the text claims that something of Fernleaf''s uses less plastic or is made from recycled material, it claims no more than these facts. So a plastic saving is claimed only for the refill pouch, or for refilling, compared with the bottle it refills, and never as more than 70% (not "80%", "up to 90%" or "almost no plastic"); it is not claimed for the whole range, all packaging, every order or another product, and not as a comparison with other brands. Recycled material is claimed only for the shipping boxes, not for "all our packaging", the bottles, the jars or the pouch. Saying that the pouch uses less plastic than the bottle without a figure, leaving out "by weight", and giving a smaller figure are allowed. A text that makes no such claim meets the condition.'
