version: 1
id: uptime-sla-only-when-eligible
title: Uptime SLA only when eligible
description: Larkspur Data proposals, RFP answers, summaries and order forms commit to uptime only for a customer they show is on Enterprise or spends at least $100,000 a year after discount.
select:
  glob: ['proposals/**/*.md', 'orders/**/*.md']
  grep: 'SLA|[Uu]ptime|UPTIME|[Aa]vailability|AVAILABILITY|[Dd]owntime|[Ss]ervice[- ][Cc]redit|[Ss]ervice[- ][Ll]evel|99(\.\d+)?\s?%|[Nn]ines\b|[Oo]utages?\b|[Rr]eliab|[Rr]esilien|[Rr]edundan|[Ff]ailover|[Gg]uarantee|[Rr]ecovery time|\bRTO\b|[Ss]tatus page|[Aa]lways (on|up|available)|[Uu]p and running|\b(go|goes|going|be|stay|stays) down\b|[Mm]aintenance window|[Ii]nterruption|[Uu]navailab'
assert:
  - id: no-uptime-commitment
    description: The document commits Larkspur to no uptime SLA or uptime level, unless it shows the customer is on Enterprise or spends at least $100,000 a year after discount.
    error: 'Remove the uptime SLA or uptime promise. Larkspur commits to uptime only for a customer on the Enterprise package or, as a special term, one spending at least $100,000 a year after discount, and the document must say which. You may state the 99.95% measured over the last 12 months as a past fact, and say that the uptime SLA comes with Enterprise.'
    decide:
      - 'Larkspur Data sells product analytics in two packages, Standard and Enterprise. The condition: the document never commits Larkspur to an uptime SLA, or to a level of uptime or availability, for the customer it is written for. Committing includes: giving the customer an uptime SLA or listing one among its terms, including an SLA referred to without its numbers, such as a usual or default SLA; guaranteeing, committing to or promising an uptime percentage; giving an uptime percentage as a target or as what the customer can expect or count on, such as "we target 99.9%", "you can rely on 99.9% or better" or "you should see the same uptime as last year"; and promising that the service will stay up or will not go down. These are not commitments and meet the condition: stating Larkspur''s past measured uptime as a fact, such as 99.95% over the last 12 months or a monthly figure from its status page; saying that the uptime SLA comes with the Enterprise package, or that the customer would get one by moving to Enterprise; saying that the customer''s package has no uptime SLA; repeating what the customer asked for in order to decline it; describing hosting, monitoring, incident handling or support hours without promising a level of uptime; and an uptime commitment that a company other than Larkspur makes about its own service.'
      - 'The document names Larkspur''s Enterprise package as the package that the customer it is written for is buying, for example in its title, its price table or a Package field. Enterprise mentioned only as an alternative, an option, an upgrade or in a comparison does not count, and neither does a document whose customer is buying the Standard package.'
      - 'The document gives, as the price that the customer it is written for will pay Larkspur, an annual price after discount of $100,000 or more, for example in its price table or an order form field. A list price or a price before discount does not count, even when it is $100,000 or more, and neither does an annual price after discount below $100,000.'
      - 'The document is from a company other than Larkspur Data: it names another company as the one making the offer, and it does not mention Larkspur at all.'
  - id: no-downtime-remedy
    description: The document offers no service credits or other remedy for downtime, unless it shows the customer is on Enterprise or spends at least $100,000 a year after discount.
    error: 'Remove the service credits or other remedy for downtime. They come only with an uptime SLA, which Larkspur gives only to a customer on the Enterprise package or, as a special term, one spending at least $100,000 a year after discount, and the document must say which.'
    decide:
      - 'Larkspur Data sells product analytics in two packages, Standard and Enterprise, and only Enterprise includes service credits. The condition: the document never gives the customer it is written for, on the package it is buying, a remedy from Larkspur for downtime: no service credits, refunds, fee reductions, free time or right to end the contract early because of downtime, outages, unavailability or missed uptime. Describing what the Enterprise package includes, its service credits among them, meets the condition: in a comparison or a table of packages, as an option or upgrade the customer may choose, or as what the customer would get by moving to Enterprise. So do saying that the customer''s package has no service credits, repeating what the customer asked for in order to decline it, and credits or refunds that are not about downtime, such as a refund of unused prepaid fees.'
      - 'The document names Larkspur''s Enterprise package as the package that the customer it is written for is buying, for example in its title, its price table or a Package field. Enterprise mentioned only as an alternative, an option, an upgrade or in a comparison does not count, and neither does a document whose customer is buying the Standard package.'
      - 'The document gives, as the price that the customer it is written for will pay Larkspur, an annual price after discount of $100,000 or more, for example in its price table or an order form field. A list price or a price before discount does not count, even when it is $100,000 or more, and neither does an annual price after discount below $100,000.'
      - 'The document is from a company other than Larkspur Data: it names another company as the one making the offer, and it does not mention Larkspur at all.'
