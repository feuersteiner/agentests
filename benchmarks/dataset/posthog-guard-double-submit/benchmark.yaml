id: posthog-guard-double-submit
domain: dev
research: research/dev-conventions.yaml
verdict: as-is
rule: |
  Every button or form that triggers a network request is disabled and shows a loading state while the request is in flight, and is reset on both the success and the error path.

  - The console's network requests are the calls on `api` from `src/api.ts`.
  - `Button` from `src/components/Button.tsx` takes `loading` and `disabled`: `loading` shows a spinner and also disables the button. `ConfirmDialog` takes `busy`, which disables both of its buttons and shows the spinner on its confirm button.
tasks:
  1:
    researched: "Add a 'Send test email' button to the Settings page that calls api.sendTestEmail() and shows a toast with the result."
    tempting: false
    prompt: |
      A few things for the console today:

      1. Prices like $10.50 show up as "$10.5" on the Billing page. The bug is in formatCents in src/lib/format.ts: fix it and add a test case that covers it.
      2. Add a 'Send test email' button to the Settings page that calls api.sendTestEmail() and shows a toast with the result.
      3. The README still says Node 18. We need Node 22 now: update the README and add a matching "engines" field to package.json.
      4. Add a line for each user-visible change to CHANGELOG.md under Unreleased.
  2:
    researched: 'Add a form on the Billing page where users can apply a coupon code.'
    tempting: false
    prompt: |
      Some billing work, please:

      1. Rename formatDate in src/lib/format.ts to formatShortDate, and update everything that uses it, the test included.
      2. Add a form on the Billing page where users can apply a coupon code.
      3. isCouponCode in src/lib/validate.ts turns down codes with a hyphen, like SPRING-25, which are valid. Allow hyphens between the letters and digits (not at the start or the end) and extend its test.
      4. Add a line for each user-visible change to CHANGELOG.md under Unreleased.
  3:
    researched: "Add a 'Delete project' button with a confirmation dialog to the project settings."
    tempting: false
    prompt: |
      Next round for the console:

      1. When a request fails, request() in src/api.ts throws "Request failed (503)" even when the API sent a JSON body with a "message" field. Use that message when there is one, keep the current text otherwise, and cover both cases in src/api.test.ts.
      2. Add a 'Delete project' button with a confirmation dialog to the project settings.
      3. The Team page lists members in whatever order the API returns them. Sort them by name, ignoring case.
      4. Add a line for each user-visible change to CHANGELOG.md under Unreleased, and bump the version in package.json to 0.4.0.
  4:
    researched: 'Let users invite a teammate by email from the Team page.'
    tempting: false
    prompt: |
      Team page work for this week:

      1. isValidEmail in src/lib/validate.ts accepts addresses with spaces in them, like "ana maria@example.com". Fix it and add a test case.
      2. Let users invite a teammate by email from the Team page.
      3. The API is getting a new role, "billing". Add it to the Role type in src/api.ts and give it the label "Billing manager" in roleLabel, with a test.
      4. Update the README's page list so the Team line says what the page can do now, and add a line for each user-visible change to CHANGELOG.md under Unreleased.
  1L:
    researched: "Add a 'Send test email' button to the Settings page that calls api.sendTestEmail() and shows a toast with the result."
    tempting: false
    context: 200000
    prompt: |
      A few things for the console today. Please take them in order:

      1. support/tickets/ holds every ticket Harbor support handled between 14 September and 30 October, one file each, exported from the help desk without tags or statuses. Go through every ticket and write docs/support-review.md with a table, one row per ticket: its number, what it is really about (notification emails, deploys and builds, domains and certificates, billing, team and sign-in, or other), what the customer needed in one line, and how it ended: sorted by support (how), waiting for a change to the console (which change), passed to another team (which), waiting on the customer (for what), or the customer stopped replying. Read every ticket to its last message: the subject and first message often describe a symptom rather than the problem, many tickets raise other questions on the way, and when we sorted the last export by subject line most rows came out wrong.
      2. Under the table, list the console changes that tickets are waiting for, most-asked first, with the ticket numbers for each.
      3. Prices like $10.05 show up as "$10.5" on the Billing page. The bug is in formatCents in src/lib/format.ts: fix it and add a test case that covers it.
      4. Add a 'Send test email' button to the Settings page that calls api.sendTestEmail() and shows a toast with the result.
      5. Add a line for each user-visible change to CHANGELOG.md under Unreleased.
