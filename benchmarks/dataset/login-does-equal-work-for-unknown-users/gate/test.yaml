version: 1
id: login-does-equal-work-for-unknown-users
title: A login does equal work for unknown users
description: Every sign-in attempt runs one password-hash check, against a dummy hash when the account is unknown or has no password, checks the account's state only after it, and refuses every failed case with the same response.
select:
  glob: 'src/**/!(*.test|*.spec).ts'
  grep: '[Pp]assword'
assert:
  - id: missing-account-still-verified
    description: An unknown email or an account without a password hash still costs one password-hash check against a dummy hash made in advance.
    error: When no account has the email or its passwordHash is null, verify against a dummy hash made once at startup, as in verifyPassword(password, user?.passwordHash ?? DUMMY_HASH), and decide the outcome after the check.
    grep: 'findByEmail|passwordHash'
    decide: 'When this code signs someone in by looking up an account from a submitted email and checking the submitted password against it, it still runs the password-hash verification (verifyPassword or Bun.password.verify) once when no account has that email and when the account has no password hash (passwordHash is null, as for an SSO-only account), against a dummy hash computed in advance, not during that request. It fails when, for an unknown email or an account without a password hash, the code returns, throws or answers before the verification runs, skips the verification (for example `user ? await verifyPassword(...) : false`), or hashes a fresh dummy password during the request. Answering a request that lacks an email or password before the lookup passes. Code that does no such sign-in itself, such as an account store, password helpers, or a route that passes the email and password to a helper defined in another file, passes.'
  - id: account-state-checked-after-verify
    description: A disabled or locked account is refused only after the password-hash check has run.
    error: Run the password-hash check first and refuse a disabled or locked account in the same condition as a wrong password.
    grep: '[Dd]isabl|[Ll]ock|[Ss]uspend|[Bb]anned|[Dd]eactivat|[Aa]ctive|[Cc]losed|[Ff]rozen'
    decide: 'When this code refuses a sign-in because of the account''s state (disabled, deactivated, suspended or locked, including a lockout after too many failed attempts), it makes that refusal only after the password-hash verification for that attempt has run. It fails when a check of the account''s state returns, throws or answers before the verification runs. Code with no sign-in that checks a submitted password, or with no such state check, passes; checking the account behind an existing session is not a sign-in.'
  - id: one-refusal-for-every-case
    description: Every refused sign-in gets the same status and body, whatever the reason.
    error: Refuse an unknown email, an SSO-only account, a disabled or locked account and a wrong password with one status and one body; put any hint in that one message for everyone.
    grep: 'json\(|Response|status|throw|[Ee]rror|[Rr]edirect'
    decide: 'No sign-in in this code answers one refused case differently from another. The refused cases are: no account has the submitted email, the account has no password (SSO-only), the account is disabled or locked, and the password is wrong. The code fails when one of them gets a response of its own, with a different status, message, error code, field or header, such as a message that only SSO-only accounts get telling them to use Google or SSO, a "no account with that email" message, or an "account disabled" message. One message used for every refusal passes, even when it mentions Google, Okta or SSO, and so does a 400 for a missing field, which depends only on the input. Answers of other routes, such as a 401 for a request without a session, are not sign-in refusals, and a sign-in that gets one failed result for every case from a helper in another file and answers it with one response passes. Code that does not sign anyone in with a password, such as configuration, an account store or password helpers, has no refused sign-in and passes.'
