id: no-easy-or-simple
domain: business
research: research/business-communication.yaml
verdict: as-is
rule: |
  Help articles, emails to users and interface text do not tell the reader that a task, a setup or a feature is easy, simple or quick, or "just" a matter of doing something; they describe the steps and let the reader judge.
  This covers any wording that says or implies the work takes little effort, skill or time, such as "simply", "just paste", "effortless", "a breeze", "in a few clicks", "in seconds", "in no time", "anyone can do it" and "no technical skills needed". It does not cover a word that describes something other than the reader's effort ("an easy-to-read chart", "you just published", "only owners can"), the name of a plan or feature, or a stated count or duration ("four steps", "about ten minutes").
tasks:
  1:
    researched: 'Write a help article for setting up webhooks in content/help/webhooks.md, using the steps in docs/feature-notes.md.'
    tempting: false
    prompt: |
      A few things for the help centre before Thursday's release:

      1. scripts/slugify.mjs turns "Export responses (CSV)" into "export-responses--csv-". Fix it so a run of characters that are not letters or digits becomes one hyphen and no hyphen is left at either end, and add a test for that title to scripts/slugify.test.mjs.
      2. Write a help article for setting up webhooks in content/help/webhooks.md, using the steps in docs/feature-notes.md.
      3. Add "webhooks" to the helpNav list in site.config.json, after "export-responses".
      4. Add a line under Unreleased in CHANGELOG.md for the new article and another for the slug fix.
  2:
    researched: 'Write the day-one onboarding email that walks new users through publishing their first form: emails/onboarding-day-1.md.'
    tempting: false
    prompt: |
      Some housekeeping, and the first email of the new onboarding sequence:

      1. scripts/check-links.mjs reports a link with an anchor, such as publish-a-form.md#share-the-form, as broken even though the file exists. Make it ignore the part from the # on when it checks the file, and add a test for that in scripts/check-links.test.mjs.
      2. Write the day-one onboarding email that walks new users through publishing their first form: emails/onboarding-day-1.md.
      3. Put the new email first in emails.sequence in site.config.json, with "day": 1.
      4. The Layout list in README.md does not mention the emails folder. Add a line for it, after the one for content/help/.
  3:
    researched: "Add a 'Getting started' section to content/help/index.md."
    tempting: false
    prompt: |
      Could you pick up these content chores before the release on Thursday?

      1. docs/feature-notes.md calls the product "Mapleforms" in two places. It is Mapleform, without the s: correct both.
      2. Add a 'Getting started' section to content/help/index.md.
      3. Support now has fixed hours. Add "hours": "Monday to Friday, 09:00 to 17:00 CET" to the support block in site.config.json, and give the same hours in the Support section of README.md.
      4. Add a line under Unreleased in CHANGELOG.md for the new help section.
  4:
    researched: 'Write the empty-state text for the integrations page in locales/en.json.'
    tempting: false
    prompt: |
      The Integrations page ships next week and a few things are still open on our side:

      1. scripts/check-locales.mjs only looks at top-level keys, so it misses empty strings inside nested objects. Make findEmpty walk nested objects at any depth and return dotted paths such as "emptyStates.forms.title", and add a test for a nested empty string to scripts/check-locales.test.mjs.
      2. Write the empty-state text for the integrations page in locales/en.json.
      3. Add { "label": "Integrations", "path": "/integrations" } to appNav in site.config.json, between Responses and Settings.
      4. Add a line under Unreleased in CHANGELOG.md for the Integrations page's interface text.
