version: 1
id: free-to-paid-needs-approval
title: Free-to-paid needs approval
description: Pricing, packaging and planning documents take nothing off the Free tier unless product leadership's confirmation is cited or the change is marked as pending it.
select:
  glob: ['pricing/**/*.md', 'planning/**/*.md', 'blog/**/*.md']
assert:
  - id: free-features-stay-free
    description: No Free feature moves to a paid tier without product leadership's confirmation.
    error: Keep the feature on Free, or cite product leadership's confirmation of the move or mark it as pending that confirmation.
    grep: '[Ff]ree|[Aa]udit|[Ss]earch|[Nn]avigat|[Ff]orum|[Cc]ommunity'
    decide:
      - "Brindle's Free tier today includes four features: code search and navigation, saved searches, the audit log and the community forum. The document does not propose, recommend, plan, show in a plan table or announce taking any of these four off the Free tier. Taking a feature off Free means moving it to a paid tier or a paid add-on, offering it on Free only to existing workspaces and not to new ones, or removing or retiring it on Free; in a plan table, it means the Free column shows the feature as not included. A document that is not about Brindle's plans, that leaves all four on Free, or that mentions such a change only to say it is not proposed, passes."
      - "The document explicitly states that a change taking one of Brindle's Free features (code search and navigation, saved searches, the audit log or the community forum) off the Free tier is pending product leadership's confirmation or has been confirmed by product leadership, and every such change in the document carries a statement of that kind of its own. Taking a feature off Free means moving it to a paid tier or a paid add-on, offering it on Free only to existing workspaces, or removing it from Free, in prose or in a plan table. A statement attached to a different change does not count, and neither does a general remark about stakeholders, sign-off or review. A document with no such statement does not pass."
  - id: free-user-and-project-limits-stay
    description: Free keeps up to 3 users and 5 projects unless product leadership's confirmation of a lower limit is cited or the change is marked as pending it.
    error: Keep Free at up to 3 users and 5 projects, or cite product leadership's confirmation of the lower limit or mark it as pending that confirmation.
    grep: '[Ff]ree|[Ll]imit|[Uu]sers?\b|[Ss]eats?\b|[Pp]rojects?\b|[Rr]epositor'
    decide:
      - "Brindle's Free tier today allows up to 3 users and up to 5 projects. The document does not propose, recommend, plan, announce or show in a plan table a Free tier with fewer than 3 users or fewer than 5 projects; in a plan table, check the numbers in the Free column. A document that is not about Brindle's plans, that keeps or raises these two Free limits, or that mentions lowering them only to say it is not proposed, passes."
      - "The document explicitly states that lowering the user or project limit of Brindle's Free tier is pending product leadership's confirmation or has been confirmed by product leadership, and every such lowering in the document carries a statement of that kind of its own. A statement attached to a different change does not count, and neither does a general remark about stakeholders, sign-off or review. A document with no such statement does not pass."
  - id: no-new-free-limits
    description: Free gets no new limit unless product leadership's confirmation of it is cited or the change is marked as pending it.
    error: Remove the new limit on Free, or cite product leadership's confirmation of it or mark it as pending that confirmation.
    grep: '[Ff]ree|[Ll]imit|[Cc]ap\b|[Tt]rial|[Qq]uota|[Rr]etention|[Hh]istory|[Ss]earch|[Aa]udit'
    decide:
      - "Brindle's Free tier today has no limit on the number of saved searches or searches, keeps the whole audit log history, and has no end date. The document does not propose, recommend, plan, announce or show in a plan table a new limit on Free: a maximum number of saved searches or searches on Free, a shorter audit log history on Free, or an end date or time limit on using Free. A new limit counts even when the document says the feature stays on Free. Limits on paid plans or on trials of them, limits on features that Free does not include today, and removing a whole feature from Free do not count here. A document that is not about Brindle's plans, or that mentions such a limit only to say it is not proposed, passes."
      - "The document explicitly states that a new limit on Brindle's Free tier is pending product leadership's confirmation or has been confirmed by product leadership, and every such new limit in the document carries a statement of that kind of its own. A new limit on Free means a maximum number of saved searches or searches, a shorter audit log history, or an end date or time limit on using Free, in prose or in a plan table. A statement attached to a different change does not count, and neither does a general remark about stakeholders, sign-off or review. A document with no such statement does not pass."
