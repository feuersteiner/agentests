version: 1
id: update-endpoints-allowlist-writable-fields
title: Create and update endpoints copy only an allowlist of fields
description: Route handlers that save request data copy only the fields they name, never the whole body, and never take an id, a foreign key, a timestamp or a non-admin's role from the client.
select:
  glob: 'src/routes/**/!(*.test|*.spec).ts'
  grep: '[Bb]ody\b|\.json\(\)|formData\(\)'
assert:
  - id: no-wholesale-body
    description: No handler saves the request body wholesale.
    error: 'Name the fields the client may set, as in const { title, key } = req.body followed by data: { title, key }. Do not pass, spread, Object.assign or loop over the body, or strip a few fields and save the rest.'
    decide: 'For every create, update, insert or save call in this file that stores data from the request body (req.body, or the result of request.json()), which fields get stored is decided by field names written in the code, not by which keys the client sent. That holds when the code names each field, as in const { title, key } = req.body followed by data: { title, key }, or data: { name: req.body.name }; when it loops over a fixed list of names; or when it keeps only the keys of the body that are in a fixed list of names, one list per kind of user being fine. It fails when the keys the client sent decide what is stored: data: req.body or a variable holding the body; a spread of the body, such as { ...req.body, userId: req.user.id }; Object.assign of the body onto a record; copying every key of the body, or every key except a few listed ones, with a loop, a filter or a rest object such as const { id, ...rest } = req.body; or passing the whole body to a function that saves it. Which names are on the list does not matter for this question. A file that stores nothing from the request body passes.'
  - id: no-ids-from-body
    description: No id, foreign key or timestamp is copied from the request body into a record.
    error: Take userId, ownerId and orgId from req.user or the stored record, the record's id from the URL, and timestamps from the clock, and drop them from the fields read from the body.
    decide: 'No field that this file takes from the request body and stores in a record is an id, a foreign key or a timestamp: id, userId, ownerId, orgId, createdAt, updatedAt, or another field whose value is the id of a record. Look at the names of the fields taken from the body, whether destructured (const { name, description } = req.body), read one by one (req.body.name) or kept from the body through a fixed list of names. A role, a name, a title, a description or other text is not an id. A value taken from the body still fails when the code checks it first, or falls back to req.user when it is missing. Setting these fields from the signed-in user (req.user), the URL path (req.params), the stored record or the clock is fine, and so is using an id from the URL to find the record to update. Code that copies the body without naming fields (a spread, a rest object, the whole body) passes this question. A file that stores nothing from the request body passes.'
  - id: role-from-body-only-for-admins
    description: A user's role is taken from the request body only in code that runs for admins alone.
    error: 'Read role from the body only in a branch that runs after checking req.user.role === "admin"; give other users a list of fields without role.'
    grep: '\b[Rr]ole'
    decide: 'Wherever this file copies a role from the request body into a stored record, that code runs only when the signed-in user is an admin: an earlier check such as if (req.user.role !== "admin") return ... stops everyone else, or role is read inside a branch that runs only for admins, or role is in a list of fields picked only for admins. It fails when a user who is not an admin can reach the code that copies role from the body, for example when one list of fields that includes role is used for every caller, or when the admin check guards only editing other people while users editing their own record get the same fields. Only a field the code names role is judged. A file that never copies a role from the request body passes.'
