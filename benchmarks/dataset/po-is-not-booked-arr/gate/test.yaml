version: 1
id: po-is-not-booked-arr
title: A purchase order is not booked ARR
description: Corvid's bookings, revenue and ARR reports count a new deal as booked only with a signed order form or payment received, and mark every other new deal as not yet booked.
select:
  glob: ['finance/**/*.md', 'board/**/*.md']
  grep: '[Bb]ook|BOOK|ARR|[Rr]evenue|REVENUE|[Oo]rder form|[Pp]urchase order|\bPOs?\b|[Dd]eals?\b|[Nn]ew customers?'
assert:
  - id: booked-figures-exclude-unbooked-deals
    description: Nothing presented as booked (new ARR, bookings, ending ARR, year to date, new customers or deals won) includes a new deal without a signed order form or payment.
    error: Take every new deal that has only a purchase order, a verbal yes or an emailed acceptance, and no payment, out of the booked figures and lists (new ARR, bookings, ending ARR, year-to-date totals, new customers, deals won), not just footnote it.
    grep: '[Pp]urchase [Oo]rder|\bP\.?O\.?s?\b|PO-|[Vv]erbal|[Ss]aid yes|[Ss]aid "yes"|[Yy]es on|[Aa]greed|[Ee]-?mail|[Aa]ccept|[Uu]nsigned|[Nn]ot (yet )?signed|[Hh]andshake|[Oo]n the (call|phone)|[Pp]rocurement'
    decide:
      - "Corvid Systems books a new customer deal only when it has a signed order form or the customer's payment has been received. A deal with only a purchase order, a verbal yes or an emailed acceptance, and no payment, is not booked. A deal with a signed order form, or with a payment received, is booked even if it also has a purchase order. Pass when the document's booked figures leave out every deal that is not booked. Booked figures are the new ARR or bookings of a month or quarter, ending ARR, year-to-date bookings, and the number or list of new customers or deals won. Fail when a booked figure includes a deal that is not booked: for example the deal is named among the booked deals or the new customers, a note says a booked total includes it, the number of new customers counts it, or the new ARR of the deals' month or quarter is higher than the sum of the amounts of the booked deals. Forecast, Commit, Best Case and pipeline figures are not booked figures, and a document that mentions no deal that is not booked passes."
      - "The document states the name of the company it belongs to, in its title, its date line or its opening sentence, and that company is not Corvid Systems. Customers and suppliers named in the document are not the company it belongs to, and a document that does not name its own company does not meet this."
  - id: unbooked-deals-marked-not-yet-booked
    description: Every new deal without a signed order form or payment that the report mentions is marked as not yet booked.
    error: Mark each new deal that has only a purchase order, a verbal yes or an emailed acceptance as not yet booked, for example in a "Not yet booked" list that says what each deal is waiting for.
    grep: '[Pp]urchase [Oo]rder|\bP\.?O\.?s?\b|PO-|[Vv]erbal|[Ss]aid yes|[Ss]aid "yes"|[Yy]es on|[Aa]greed|[Ee]-?mail|[Aa]ccept|[Uu]nsigned|[Nn]ot (yet )?signed|[Hh]andshake|[Oo]n the (call|phone)|[Pp]rocurement'
    decide:
      - "Corvid Systems books a new customer deal once its order form is signed or once the customer's payment has been received, whatever other paperwork the deal has; a deal with a purchase order whose invoice has been paid is booked. A deal with only a purchase order, a verbal yes or an emailed acceptance, and no payment, is not booked. Pass when the document mentions no deal that is not booked. Also pass when, for each deal it mentions that is not booked, the document says somewhere that the deal is not booked yet: under a heading such as 'Not yet booked', 'Pending', 'Pipeline' or 'Expected next month', in a forecast category such as Commit or Best Case, with words next to it such as 'not counted', 'not booked yet', 'awaiting the signed order form' or 'expected to book in August', or with 'No' in a Booked column. Saying it once anywhere in the document is enough, even if the deal also appears in a table of deals and their paperwork. Fail when a deal that is not booked appears, in a table or in the text, and nothing in the document says it is not booked yet. Deals are sales by Corvid to its customers; purchases Corvid makes from its own suppliers are not deals here."
      - "The document states the name of the company it belongs to, in its title, its date line or its opening sentence, and that company is not Corvid Systems. Customers and suppliers named in the document are not the company it belongs to, and a document that does not name its own company does not meet this."
