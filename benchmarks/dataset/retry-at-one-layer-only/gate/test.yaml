version: 1
id: retry-at-one-layer-only
title: Retries at one layer only
description: Service clients, queue jobs and endpoints add no retry around a call that the shared HTTP session or the job runner already retries.
select:
  glob: ['app/clients/**/*.py', 'app/jobs/**/*.py', 'app/api/**/*.py']
  grep: '[Rr]etr(y|ies|ied|ying)|RETR(Y|IES)|[Aa]ttempt|\b[Tt]ries\b|[Bb]ackoff|[Rr]esilien|\bwhile\b|range\(|sleep\('
assert:
  - id: no-retry-around-session-calls
    description: No new retry around a request through the shared session or a call to InventoryClient or PricingClient, which the session already retries.
    error: The shared session in app/http.py already retries these requests three times; tune its Retry there, or retry only errors it never retries (such as 429), instead of adding a second retry layer.
    grep: 'SESSION|\.session\b|session=|InventoryClient|PricingClient|get_stock|get_price'
    decide:
      - 'In this Python file, no request sent through the shared HTTP session `SESSION` (imported from `app.http`) and no call to a method of `InventoryClient` or `PricingClient` (such as `get_stock(...)` or `get_price(...)`; these clients send their requests through `SESSION`) is tried again after it fails: there is no loop that repeats such a request or call after an error, no retry decorator on a function or method that makes one, and no retry helper or wrapper that is given one. `SESSION` already retries its requests, so any such retry is a second retry layer. Setting a session''s own `Retry(...)` is not a retry, and a file that makes no such request or call passes.'
      - 'In this Python file, every retry (a loop that tries a request again after it fails, a retry decorator, or a retry helper) wraps only requests sent through a session that this file itself creates without retries, that is with `Session(...)` and no `retry` argument, or with `retry=None`. No retry in it wraps a request sent through the shared session `SESSION` from `app.http`, or a call to a client that this file does not give such a session.'
      - 'In this Python file, every retry (a loop that tries a request or call again after it fails, a retry decorator, or a retry helper) retries only HTTP error responses whose status is 429, or another status other than 502, 503 and 504, and re-raises connection errors and timeouts (`TransportError`) and 502, 503 and 504 responses without trying again. A retry that catches `Exception`, `TransportError`, or `HTTPError` without checking its status does not meet this, and neither does a retry decorator or helper whose arguments in this file do not show that limit.'
  - id: no-retry-inside-queue-jobs
    description: No retry inside a queue job, which the job runner already re-runs up to five times.
    error: The job runner already re-runs a failed job up to five times (app/jobs/config.py); tune the job settings there, or skip and log the item that failed, instead of retrying inside the job.
    grep: '@job\('
    decide: 'This is a Python module of a shop service. A function decorated with `@job(...)` is a queue job, and the job runner already re-runs a queue job up to five times when it raises any error. Passes when no code that runs inside such a job, in the job function itself or in a helper in this file that the job calls, tries an operation again after it fails: no loop that repeats a failed call, no retry decorator, and no retry helper or wrapper. Catching the error of one item, logging it and moving on to the next item without trying it again is not a retry, and neither is a loop over items or batches. A file with no `@job(...)` function passes.'
