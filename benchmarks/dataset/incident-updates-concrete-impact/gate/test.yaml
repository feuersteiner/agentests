version: 1
id: incident-updates-concrete-impact
title: Incident notices state concrete impact
description: Shelfwise's notices to merchants about an incident or outage say what fails, whether checkout, orders, payments and data are affected, what is being done and when the next update comes, with no empty reassurance.
select:
  glob: ['content/status/**/*.md', 'emails/**/*.md', 'support/macros/**/*.md', 'locales/**/*.json']
  grep: '[Ii]ncident|INCIDENT|[Oo]utage|OUTAGE|[Dd]isrupt|[Dd]egraded|[Dd]owntime|[Ii]nterruption|[Ii]nvestigat|[Aa]ffect|[Ii]ssues?\b|ISSUE|[Pp]roblems? (with|affecting)|[Dd]ifficult|[Gg]litch|[Hh]iccup|[Bb]ack to normal|[Uu]p and running|[Rr]esolved|(not|n[''’]t) (be )?(load|work|show|display|appear|open|respond|available|accessible|reachable)|[Uu]navailable|[Ss]low(ly|ness|er| to load| loading)|[Ff]ailing|[Bb]roken|[Ss]tatus page|[Ii][Nn][Cc]-?[0-9]|\b(is|are|was|were|went|been|be|goes|go) down\b|[Ww]orr(y|ied)|[Rr]est assured|[Tt]emporar|[Ww]e[''’]re aware|[Ww]e are aware|[Ll]ooking into|[Rr]oll(ing|ed)? ?back|[Pp]atience|[Ee]xperienc\w* (some |an? |intermittent |temporary )?(problem|error|delay|trouble|slow)|[Nn]ext update|[Ww]e[''’]ll (update|keep) you|[Bb]e back|[Bb]ack (shortly|soon)|[Hh]ang tight|[Ss]it tight|[Ff]ixing|\b[Aa] fix\b|\b[Tt]he fix\b'
  decide: 'Shelfwise is a storefront app that independent shops (its merchants) use to run their online stores: storefronts, product photos, themes, checkout, orders, payments, payouts and a store admin. The condition for selection: the text contains a notice from Shelfwise to its merchants about a Shelfwise incident or outage, that is, about some part of Shelfwise failing, down, broken, slow or degraded for many stores at once, either while it lasts or after it is over. Such a notice may be a status page post, an email, an in-app banner or alert among other interface strings, or a support reply about that problem. It is still such a notice when the problem was caused by another company that Shelfwise relies on, such as a payment or hosting provider, and Shelfwise is telling its merchants about it. A text that names Shelfwise can be such a notice, and so can a text that names no company, if the problem it describes is with online stores or a store admin. These are not such a notice: a notice in which a company other than Shelfwise tells its own customers about a problem with its own product, and Shelfwise is not mentioned; a text that names no company and is about a different kind of product, such as payroll, banking or note-taking; a message about one merchant''s own account, order, payment, refund or settings, such as a declined card or one product that was not saved; and any text that does not tell readers that something has gone wrong, such as a welcome email, a feature announcement or a how-to.'
assert:
  - id: says-what-is-and-is-not-affected
    description: The notice names the failing feature in merchant terms and says whether checkout, orders, payments and data are affected.
    error: 'Say what fails in terms a merchant would notice (which feature, what shoppers see), and say for each of checkout, orders, payments and data whether it is affected, for example "Checkout, orders and payments are working normally, and no data has been lost."'
    decide: 'Look only at the notice about the Shelfwise incident or outage in the text; in a file of interface strings, look only at the strings that make up that notice. The condition is that both of these are true. (1) The notice names what is failing in terms a merchant would notice: the feature or part of the store or admin that does not work, and what merchants or shoppers see, such as "product photos aren''t loading on some storefronts" or "the orders page won''t open in the admin". Vague wording alone, such as "some issues", "technical difficulties", "a service disruption", "some features" or "degraded performance", does not meet (1). (2) The notice says, for each of these four, whether it is affected: checkout, orders, payments, and data. Each of the four must be mentioned, by name or a plain equivalent, as affected, or as working normally or not affected. Plain equivalents: for checkout, shoppers being able to check out or buy; for orders, orders or sales; for payments, payments, charges or payouts; for data, store data, products, customer details, or that nothing was lost or deleted. One sentence may cover several, as in "Checkout, orders and payments are working normally and no data has been lost." If any of the four is not mentioned, (2) is not met.'
  - id: says-what-is-being-done
    description: The notice says what is being done and when the next update comes, or that the incident is resolved and what was fixed.
    error: 'Say what Shelfwise is doing about it (for example rolling back a change or deploying a fix) and when the next update will come, for example "Next update by 11:00 UTC"; once it is over, say it is resolved and what was fixed.'
    decide: 'Look only at the notice about the Shelfwise incident or outage in the text; in a file of interface strings, look only at the strings that make up that notice. The condition is that one of these is true. (a) The notice says what Shelfwise is doing about the problem, naming a step such as investigating the cause, rolling back a change, deploying a fix or restoring a service, and it also says when the next update will come, as a clock time ("by 11:00 UTC") or a time span ("within the hour", "in 30 minutes"). (b) The notice says that the incident is over or resolved, and says what was fixed or changed. Phrases such as "our team is on it", "we''re working hard", "we''ll keep you posted" or "we''ll update you as soon as we can" do not name a step or give a time.'
  - id: no-empty-reassurance
    description: The notice offers no reassurance that states no fact, such as "don't worry" or "back to normal soon".
    error: 'Replace the reassurance with the facts: what fails, what still works, what is being done and when the next update comes.'
    decide: 'Look only at the notice about the Shelfwise incident or outage in the text; in a file of interface strings, look only at the strings that make up that notice. The condition: the notice contains no reassurance that states no fact. That means it does not tell the reader not to worry or that there is nothing to worry about (as in "don''t worry", "no need to worry", "nothing to worry about", "rest assured", "no cause for concern"), and it does not promise that things will be fine or back to normal soon without giving a time or a fact (as in "it''s only temporary", "everything will be back to normal soon", "we''ll have this sorted in no time", "this should be fixed shortly"). These meet the condition: statements of fact, even reassuring ones, such as "no data has been lost", "your orders are safe", "checkout is working normally" or "we expect the fix to be complete by 11:00 UTC"; an apology; and thanking the reader for their patience.'
