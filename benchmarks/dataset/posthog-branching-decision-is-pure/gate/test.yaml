version: 1
id: posthog-branching-decision-is-pure
title: A branching decision is a pure function
description: In the billing modules, a function that chooses a business outcome takes plain values and does not query the database, call a client or read the clock.
select:
  glob: 'billing/**/*.py'
assert:
  - id: decision-does-no-io
    description: The function that chooses an outcome does not query the database or call a client.
    error: Move the conditions into a function that takes plain values and returns the outcome; load the values and write or send the result in its caller.
    # One function, up to the next def, that both touches a connection, repository or client and holds a comparison.
    grep: '\bdef[ \t](?:(?!\n[ \t]*(?:async[ \t]+)?def[ \t])[\s\S])*?(?:(?:\brepo\.\w+\(|\bconn(?:ection)?\b|\bcursor\b|\.execute\(|\bsession\b|[Cc]lient\b|\brequests\.|\bhttpx\.|\bsmtplib\.)(?:(?!\n[ \t]*(?:async[ \t]+)?def[ \t])[\s\S])*?(?:==|!=|<=|>=|[ \t]<[ \t]|[ \t]>[ \t]|\bnot[ \t]+in\b|\b(?:if|elif|and|or)\b[^\n]*[ \t]in[ \t]|\bcase[ \t][^\n]*:|\b(?:if|elif|and|or|not)[ \t]+(?:not[ \t]+)?\w+\.\w+)|(?:==|!=|<=|>=|[ \t]<[ \t]|[ \t]>[ \t]|\bnot[ \t]+in\b|\b(?:if|elif|and|or)\b[^\n]*[ \t]in[ \t]|\bcase[ \t][^\n]*:|\b(?:if|elif|and|or|not)[ \t]+(?:not[ \t]+)?\w+\.\w+)(?:(?!\n[ \t]*(?:async[ \t]+)?def[ \t])[\s\S])*?(?:\brepo\.\w+\(|\bconn(?:ection)?\b|\bcursor\b|\.execute\(|\bsession\b|[Cc]lient\b|\brequests\.|\bhttpx\.|\bsmtplib\.))'
    decide:
      - 'In this file, any function whose own body queries the database, calls a repository or query function (such as a `repo.` call or `conn.execute`) or calls an external client contains no condition that compares a business value, such as a plan, a status, a count, a date, an age or number of days, or keywords in a text, with a constant or a threshold in order to choose an outcome. Conditions that only test what a separate decision function returned (such as `if allowed:` or `if action is Action.RETRY:`) or whether a record was found do not count. A file where no function has such a condition satisfies this.'
      - 'The comparisons that choose a business outcome in this file (on a plan, a record''s status, a count, a date, a number of days or keywords in a text) are written in a function whose parameters are all plain values such as strings, numbers, booleans, dates, enums or simple records, with no database connection, cursor, session, repository or client among them, and that function only returns the outcome without saving or sending anything.'
      - 'Nowhere in this file is a plan, a record''s status, a count, a date, a number of days or a keyword in a text compared with a constant or a threshold to choose a business outcome; at most, the file acts on the decision that a function imported from another module returned.'
  - id: decision-reads-no-clock
    description: The function that chooses an outcome gets the current time as a value and does not read the clock.
    error: Pass the current time into the function that decides, and read the clock in its caller.
    # One function, up to the next def, that touches no connection, repository or client, reads the clock and holds a comparison.
    grep: '\bdef[ \t](?:(?!\n[ \t]*(?:async[ \t]+)?def[ \t])(?!(?:\brepo\.\w+\(|\bconn(?:ection)?\b|\bcursor\b|\.execute\(|\bsession\b|[Cc]lient\b|\brequests\.|\bhttpx\.|\bsmtplib\.))[\s\S])*?(?:(?:\bnow\(|\btoday\(|\butcnow\(|\btime\.time\(|\bmonotonic\(|\btime_ns\()(?:(?!\n[ \t]*(?:async[ \t]+)?def[ \t])(?!(?:\brepo\.\w+\(|\bconn(?:ection)?\b|\bcursor\b|\.execute\(|\bsession\b|[Cc]lient\b|\brequests\.|\bhttpx\.|\bsmtplib\.))[\s\S])*?(?:==|!=|<=|>=|[ \t]<[ \t]|[ \t]>[ \t]|\bnot[ \t]+in\b|\b(?:if|elif|and|or)\b[^\n]*[ \t]in[ \t]|\bcase[ \t][^\n]*:|\b(?:if|elif|and|or|not)[ \t]+(?:not[ \t]+)?\w+\.\w+)|(?:==|!=|<=|>=|[ \t]<[ \t]|[ \t]>[ \t]|\bnot[ \t]+in\b|\b(?:if|elif|and|or)\b[^\n]*[ \t]in[ \t]|\bcase[ \t][^\n]*:|\b(?:if|elif|and|or|not)[ \t]+(?:not[ \t]+)?\w+\.\w+)(?:(?!\n[ \t]*(?:async[ \t]+)?def[ \t])(?!(?:\brepo\.\w+\(|\bconn(?:ection)?\b|\bcursor\b|\.execute\(|\bsession\b|[Cc]lient\b|\brequests\.|\bhttpx\.|\bsmtplib\.))[\s\S])*?(?:\bnow\(|\btoday\(|\butcnow\(|\btime\.time\(|\bmonotonic\(|\btime_ns\())'
    decide: 'In this file, any function whose own body reads the current time (with datetime.now(), date.today(), time.time() or another clock call) contains no condition that compares a business value, such as a plan, a status, a count, a date, an age or number of days, or keywords in a text, with a constant, a threshold or the current time in order to choose an outcome. Conditions that only test what a separate decision function returned (such as `if allowed:` or `if action is Action.RETRY:`) or whether a record was found do not count, and neither does passing the time to another function or adding days to it. A file where no function has such a condition satisfies this.'
