version: 1
id: no-preannouncing-features
title: No pre-announcing features
description: Help articles, FAQs and product docs describe the product as it is today and never mention, date or hint at a planned feature, app, plan or improvement, or mark a gap as temporary with words such as "yet" or "for now".
select:
  glob: ['content/help/**/*.md', 'content/docs/**/*.md', 'content/**/*faq*.md']
  grep: '[Ss]oon|SOON|[Cc]oming|COMING|[Ff]orthcoming|[Pp]lann(ed|ing)|[Ww]e plan|[Oo]ur plans|[Pp]lans (for|to) (add|bring|launch|release|ship|support|offer)|[Rr]oadmap|[Ff]uture|[Ll]ater (this|in|next|on)|[Nn]ext (release|version|update|month|quarter|year|week|few|major)|\bQ[1-4]\b|[Ww]orking on|[Ii]n the works|[Ii]n (progress|development)|[Uu]nder (development|construction|consideration)|[Bb]eing (built|developed|worked|tested|considered)|[Oo]n (the|its|their) way|[Pp]ipeline|[Hh]orizon|[Dd]own the (road|line)|[Ss]tay (tuned|posted|updated)|[Kk]eep an (eye|ear)|[Ww]atch (this space|for|out)|[Ll]ook out for|[Cc]heck back|[Ww]ait ?list|[Ww]aiting list|[Ee]arly access|[Nn]otif(y|ied) (you|me) when|[Hh]ear (when|first|about it)|[Bb]e the first|[Ee]ventually|[Ss]ome ?day|[Oo]ne day|[Ww]ill (soon|eventually|also|be (available|added|supported|released|launched|possible|able|coming|rolling|introduced|expanded|extended|improved)|support|launch|ship|arrive|come|get|gain|add|offer|bring|let|allow|include|expand|extend)|[Ww]e.ll (add|support|launch|ship|bring|have|let|offer|be|introduce|expand|extend|announce)|[Yy]ou.ll (soon |also |eventually |)be able|[Ww]e (are|.re) (adding|building|working|exploring|considering|looking|planning|improving|developing|bringing|testing|hoping|investigating|rolling|preparing)|[Aa]lways (improving|working|adding)|[Cc]onstantly|[Cc]ontinu(ally|ously)|[Hh]opefully|[Ww]e hope|[Aa]rriv(e|es|ing)|[Ee]xpect(ed)? (it |them |this )?(in|by|later|soon|next|early|late|this)|[Bb]eta\b|[Pp]review|[Tt]o come\b|[Rr]elease date|[Ll]aunch(es|ing)? (in|on|later|next|soon|this)|[Rr]oll(s|ing)? out|(in|by|early|late|mid|until|from|before|this|next|end of) (January|February|March|April|May|June|July|August|September|October|November|December|spring|summer|autumn|fall|winter|20[2-3]\d)|\b[Yy]et\b|YET|[Ff]or now|[Ff]or the (moment|time being)|[Aa]t (the|this) (moment|time|point|stage)|[Aa]t present|[Pp]resently|[Cc]urrent(ly)?\b|[Rr]ight now|[Aa]s of (now|today|yet|this|writing)|[Ss]o far|\b[Ss]till\b|[Tt]emporar|\b[Tt]oday\b|[Ii]n the meantime|[Uu]ntil then'
assert:
  - id: no-future-feature
    description: Nothing says or implies that a feature, app, plan or improvement is coming.
    error: 'Remove what says or hints that something is coming, planned or being worked on, and any date for it; describe what the product does today and say plainly what it does not do.'
    grep: '[Ss]oon|SOON|[Cc]oming|COMING|[Ff]orthcoming|[Pp]lann(ed|ing)|[Ww]e plan|[Oo]ur plans|[Pp]lans (for|to) (add|bring|launch|release|ship|support|offer)|[Rr]oadmap|[Ff]uture|[Ll]ater (this|in|next|on)|[Nn]ext (release|version|update|month|quarter|year|week|few|major)|\bQ[1-4]\b|[Ww]orking on|[Ii]n the works|[Ii]n (progress|development)|[Uu]nder (development|construction|consideration)|[Bb]eing (built|developed|worked|tested|considered)|[Oo]n (the|its|their) way|[Pp]ipeline|[Hh]orizon|[Dd]own the (road|line)|[Ss]tay (tuned|posted|updated)|[Kk]eep an (eye|ear)|[Ww]atch (this space|for|out)|[Ll]ook out for|[Cc]heck back|[Ww]ait ?list|[Ww]aiting list|[Ee]arly access|[Nn]otif(y|ied) (you|me) when|[Hh]ear (when|first|about it)|[Bb]e the first|[Ee]ventually|[Ss]ome ?day|[Oo]ne day|[Ww]ill (soon|eventually|also|be (available|added|supported|released|launched|possible|able|coming|rolling|introduced|expanded|extended|improved)|support|launch|ship|arrive|come|get|gain|add|offer|bring|let|allow|include|expand|extend)|[Ww]e.ll (add|support|launch|ship|bring|have|let|offer|be|introduce|expand|extend|announce)|[Yy]ou.ll (soon |also |eventually |)be able|[Ww]e (are|.re) (adding|building|working|exploring|considering|looking|planning|improving|developing|bringing|testing|hoping|investigating|rolling|preparing)|[Aa]lways (improving|working|adding)|[Cc]onstantly|[Cc]ontinu(ally|ously)|[Hh]opefully|[Ww]e hope|[Aa]rriv(e|es|ing)|[Ee]xpect(ed)? (it |them |this )?(in|by|later|soon|next|early|late|this)|[Bb]eta\b|[Pp]review|[Tt]o come\b|[Rr]elease date|[Ll]aunch(es|ing)? (in|on|later|next|soon|this)|[Rr]oll(s|ing)? out|(in|by|early|late|mid|until|from|before|this|next|end of) (January|February|March|April|May|June|July|August|September|October|November|December|spring|summer|autumn|fall|winter|20[2-3]\d)'
    decide: 'The text never says or implies that the product will get a feature, app, platform, plan, billing option, integration or improvement that it does not have today. That includes: calling something coming, coming soon, upcoming, on the way, planned, on the roadmap, in development, in the works or being worked on; giving a release, date, quarter or other timeframe for something that is not available today, such as "next month", "in Q3" or "in a future update"; saying the team is building, exploring or considering something new; promising that something will improve, as in "we keep improving reports"; and telling the reader to stay tuned, keep an eye out, check back, join a waitlist or sign up to hear when something arrives. These do not count: describing what the product does today, including features added in the past and when they were added; saying plainly that the product does not do something, with or without a workaround; future events that are not new capabilities, such as a receipt being emailed, a plan renewing, scheduled maintenance, or a dated change to the price or terms of something that already exists; and the words "yet", "for now", "at the moment" or "currently" on their own, which this question does not judge.'
  - id: no-temporary-gap
    description: No missing feature or limit of the product is marked as temporary.
    error: 'Drop "yet", "for now", "at the moment", "currently" and similar words from what the product does or lacks; say plainly what it does today.'
    grep: '\b[Yy]et\b|YET|[Ff]or now|[Ff]or the (moment|time being)|[Aa]t (the|this) (moment|time|point|stage)|[Aa]t present|[Pp]resently|[Cc]urrently|[Cc]urrent (version|release|build|app)|[Rr]ight now|[Aa]s of (now|today|yet|this|writing)|[Ss]o far|\b[Ss]till\b|[Tt]emporar|\b[Tt]oday\b|[Ii]n the meantime|[Uu]ntil then'
    decide: 'No use of "yet", "not yet", "for now", "at the moment", "at present", "currently", "the current version", "right now", "so far", "still", "until then" or "for the time being" in the text presents something the product does not do, or a limit of the product, as temporary, as in "dark mode isn''t available yet", "for now, reminders can''t repeat", "the app currently supports two languages", "the current release has no calendar view" or "it still can''t import calendars". A use about the reader or another person, or about their own account, data, devices, connection, choices or actions, is not about what the product can do and meets this condition, as in "if you don''t have an account yet", "a form you haven''t submitted yet", "the page you''re currently viewing", "your files are still in the trash" or "skip this step for now". A plain statement that the product does not do something, without such a word, also meets this condition.'
