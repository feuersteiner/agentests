version: 1
id: no-free-credits-to-close
title: No free credit to close a deal
description: Larkspur Data's proposals, order forms and customer emails give nothing at no charge (no free or bonus credit, free months, free add-ons or free usage before the paid term) unless they name one of the three programmes and keep to its terms.
select:
  glob: ['proposals/**/*.md', 'orders/**/*.md', 'outbox/**/*.md']
  grep: '[Ff]ree|FREE|[Cc]redit|[Cc]harg|[Cc]ost|[Pp]ric|[Pp]ay|[Bb]ill|[Ii]nvoic|[Ww]aiv|[Cc]omplimentar|[Bb]onus|[Gg]ift|[Oo]n us\b|[Oo]n the house|[Cc]over|\b[Mm]onths?\b|\b[Ww]eeks?\b|\b[Dd]ays?\b|[Tt]erm\b|[Tt]rial|[Uu]sage|\$|€|£'
assert:
  - id: no-free-extras
    description: The document gives no free or bonus credit, free months or paid add-on at no charge, unless it names one of Larkspur Data's three programmes as the reason.
    error: 'Remove the free credit, free months or free add-on. Larkspur Data gives value at no charge only under the competitor contract buyout, competitor renewal win-back or startup plan roll-off programme, when the customer''s notes place the deal in one; lean on the ladder discount, a price lock or payment terms instead.'
    grep: '[Ff]ree|FREE|[Cc]redit|[Nn]o (extra |additional )?(charge|cost)|[Ww]ithout (charge|cost)|[Aa]t no (extra |additional )?(charge|cost)|[Ww]aiv|[Cc]omplimentar|[Bb]onus|[Gg]ift|[Oo]n us\b|[Oo]n the house|[Tt]hrow(n|ing)? in|[Ee]xtra|[Aa]dditional|[Ii]nclud|[Mm]onths?\b|[Ww]eeks?\b|[Tt]rial'
    decide:
      - 'The text is about selling usage credit for a product: a customer pays for a year of credit, or pays each month for its usage. The condition: the text does not give or offer the customer anything for free on top of what it pays for. So it offers no free, bonus or extra usage credit, whatever the credit is called (for example an onboarding, welcome, goodwill, launch or migration credit, or a usage buffer); no free month or months of usage within or added to a term (for example "your first month is free" or "13 months for the price of 12"); and no paid add-on or service, such as Premium support or Warehouse sync, at no charge for any period. These are not free extras and meet the condition: a discount on the price of the credit the customer buys (a percentage off, or paying less than the list value of the credit); a price lock; payment terms such as quarterly instalments; a larger purchase at a higher discount step; the onboarding workshop, email support and named account manager that every annual plan includes; a credit owed for downtime under a service level agreement; a refund or correction of a billing mistake; and a mention of free credit or free months only to say that they are not offered. Whether usage before a term starts is billed is checked separately and does not count here.'
      - 'Every free extra in the text is given under one of Larkspur Data''s three programmes, and the text names that programme as the reason for it: the competitor contract buyout, the competitor renewal win-back or the startup plan roll-off. A free extra is free or bonus usage credit, a free month or months of usage, or a paid add-on at no charge. These are not free extras: a discount on the price, a price lock, payment terms, and the onboarding workshop, email support and named account manager that every annual plan includes. A free extra given for any other reason, or under any other programme or offer (for example a loyalty, onboarding, launch, goodwill or signing offer), does not meet the condition.'
      - 'The text is from a company other than Larkspur Data: it names a company other than Larkspur Data as the seller of what it offers (for example in its signature, its heading or its product name), and it never mentions Larkspur Data. The customer the text is addressed to is not the seller. A text that names no seller does not meet this condition.'
  - id: no-free-usage-before-term
    description: Usage before the paid term starts is billed, and the term is not started later to leave usage unbilled, unless the document names one of Larkspur Data's three programmes as the reason.
    error: 'Bill usage before the annual term at the standard monthly rates, or start the term earlier so that it covers that usage; do not cover the gap for free or start the term later while usage continues, unless the customer''s notes place the deal in the competitor contract buyout, competitor renewal win-back or startup plan roll-off programme and the document names it.'
    grep: '[Gg]ap|[Bb]efore|[Uu]ntil|[Tt]ill\b|[Bb]etween|[Ss]tart|[Bb]egin|[Bb]ill|[Ii]nvoic|[Cc]harg|[Ww]aiv|[Cc]over|[Bb]ridg|[Rr]an out|[Rr]uns? out|[Ee]xpir|[Dd]efer|[Dd]elay|[Pp]ostpon|[Pp]ush|[Ff]ree|[Ww]rit(e|ten) off|[Aa]bsorb|[Oo]n us\b|[Oo]n the house|[Cc]redit'
    decide:
      - 'The text is about selling usage credit for a product: a customer pays for a year of credit with an annual term, or pays each month, at list rates, for its usage outside an annual term. The condition: the text does not let the customer use the product for free before its paid term starts. So it does not say or offer that usage before a new term starts, in a gap between contracts or after prepaid credit has run out is free, waived, covered or absorbed by the seller, credited back, written off or not billed; and it does not move a term''s start later while the customer keeps using the product without paying for the time until then. These meet the condition: billing such usage at the standard monthly or pay-as-you-go rates; starting the paid term earlier so that it covers that usage; a later start date when the usage until then is billed as usual; payment terms such as quarterly instalments or an invoice due 30 days after the term starts; and a mention of free usage before the term only to say that it is not offered. Free credit or free months within a term are checked separately and do not count here.'
      - 'Every period of free usage before a paid term starts that the text gives (usage in a gap between contracts, after prepaid credit has run out, or before a later term start, left unbilled, waived, covered or credited back) is given under one of Larkspur Data''s three programmes, and the text names that programme as the reason for it: the competitor contract buyout, the competitor renewal win-back or the startup plan roll-off. Free usage before a paid term given for any other reason, or under any other programme or offer (for example a loyalty, onboarding, goodwill or signing offer), does not meet the condition.'
      - 'The text is from a company other than Larkspur Data: it names a company other than Larkspur Data as the seller of what it offers (for example in its signature, its heading or its product name), and it never mentions Larkspur Data. The customer the text is addressed to is not the seller. A text that names no seller does not meet this condition.'
  - id: programme-terms-kept
    description: Anything given for free under one of the three programmes stays within that programme's terms.
    error: 'Keep to the programme''s terms. Competitor contract buyout: free usage credit for the months left on the competitor contract, up to six. Competitor renewal win-back: the first month of usage free. Startup plan roll-off: free usage from the end of the startup plan to the start of the annual term, up to 30 days.'
    grep: '[Bb]uy-?out|[Ww]in-?back|[Rr]oll-?off|[Pp]rogram'
    decide: 'Larkspur Data gives things for free only under three programmes, each with a limit. Competitor contract buyout: free usage credit covering the months left on the customer''s contract with a competitor, at most six months of usage. Competitor renewal win-back: the first month of usage free, and no more than that one month. Startup plan roll-off: free usage from the end of the customer''s Larkspur Data startup plan to the start of its annual term, at most 30 days. The condition: nothing the text gives for free under one of these three programmes goes beyond that programme''s limit. Discounts, payment terms and what every annual plan includes are not given under these programmes and are not judged here, and neither is anything given under another programme or offer. A text that gives nothing for free under these three programmes meets the condition.'
