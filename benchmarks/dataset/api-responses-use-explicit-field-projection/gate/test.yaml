version: 1
id: api-responses-use-explicit-field-projection
title: API responses use explicit field projection
description: marginalia's handlers send response structs or maps with listed fields chosen for the audience, never model rows, and no public response holds an email, IP hash, password hash or role.
select:
  glob: ['internal/handler/**/!(*_test).go', 'internal/router/**/!(*_test).go']
  grep: 'JSON\s*\(|json\.(NewEncoder|Marshal)'
assert:
  - id: no-row-sent
    description: No response body is a database row, a slice of rows or a store result passed on as it is.
    error: Declare a response struct with only the fields this audience needs, fill it field by field from the row, and send that instead of the row.
    grep: 'model\.|store\.|\bdb\.|\bDB\b|gorm'
    decide: 'In this Go file of marginalia, a blog API, every `h.store` method returns database rows: values of package `model`, or slices of them. Every response body that this file passes to `writeJSON` (its last argument), to an `Encode` method or to `json.Marshal` is built by the code of this file, as one of these: a composite literal, written at the call or assigned to a variable before it, such as `itemResponse{ID: row.ID, Name: row.Name}` or a map literal whose values are plain values or single fields such as `row.Name`; a slice that the code creates and fills with such literals or with the results of a function that converts a row into a response value; a call to a function that converts rows into response values, such as `toItemResponses(rows)`; or, inside a helper like `writeJSON` itself, the helper''s own parameter. A variable that holds what an `h.store` call returned, even after some of its fields were changed or cleared, and a map literal with such a variable as one of its values, are not built by the code of this file.'
  - id: no-model-type-in-response-type
    description: No response type holds or embeds a model type, or is defined from one.
    error: Give the response type only plain fields, or small response structs of its own, copied field by field from the rows; never a model type.
    grep: 'model\.'
    decide: 'In marginalia, a Go blog API, the struct types of package model (model.Comment, model.User, model.Post) are database rows. Does every struct type declared in this file with json tags on its fields avoid holding a row? It holds a row when one of its fields has a type from package model, such as model.User, *model.User, []model.Comment or map[int64]model.Post, or when it embeds a model type, as in struct { model.User; ... }. A type declared from a model type, as in type publicUser model.User, also holds a row. Function parameters and local variables of model types are not struct fields and do not count.'
  - id: no-private-field-in-public-response
    description: No public response holds an email address, IP hash, password hash or role.
    error: Leave email addresses, IP hashes, password hashes and roles out of every response of the public group.
    grep: '[Ee]mail|EMAIL|IPHash|IpHash|ip_hash|[Pp]assword|[Rr]ole\b|ROLE'
    decide:
      - 'In this Go file of marginalia, a blog API of posts, comments and the users who write them, the routes of the public group are open to anyone, and the only handlers outside it are the editors'' moderation handlers, whose method names start with `Admin`. No response sent by a handler whose name does not start with `Admin` has a field or key for an email address, an IP hash, a password hash or a role, such as a response struct with an `Email` or `Role` field, and no such handler sends a `model.Comment`, which has an `Email` field, or a `model.User`, which has `Email` and `Role` fields. Reading these fields to validate, store or compare them is not sending them. Responses of handlers whose names start with `Admin` may hold any of them.'
      - 'This file is not part of marginalia: its import block names no package whose path starts with corvidfinch.example/marginalia, and the words post, comment, user, writer and editor appear nowhere in it.'
