id: posthog-thin-entrypoints
domain: dev
research: research/dev-conventions.yaml
verdict: restate-policy
rule: |
  HTTP handlers, CLI commands and background task bodies only read input, wire dependencies and format output; every business decision or calculation they need lives in a function they call, placed in the area's existing logic module when there is one.

  - Business logic for an area lives in that area's module under `app/logic/` (orders logic in `app/logic/orders.py`, carts logic in `app/logic/carts.py`); `app/views/*.py` and `app/cli.py` hold the entrypoints.
  - A database query is business logic too: an entrypoint runs no SQL itself.
  - Checking that an input is present and well-formed, turning an error from the logic into a status code or message, and shaping a result for output are the entrypoint's own work.
tasks:
  1:
    researched: 'Add a POST /orders/<id>/refund endpoint. Orders can be refunded up to 30 days after payment, and shipping is only refunded if nothing has shipped yet.'
    tempting: false
    prompt: |
      A few things for the order service:

      1. The router answers 404 when the path exists but the method is wrong (try POST /orders/1). It should answer 405 with {"error": "method not allowed"}. Fix that in app/http.py and add a test for it to tests/test_http.py.
      2. Add a POST /orders/<id>/refund endpoint. Orders can be refunded up to 30 days after payment, and shipping is only refunded if nothing has shipped yet.
      3. Add the new endpoint to the endpoints table in the README, and note both changes under Unreleased in CHANGELOG.md.
      4. larkspur.db keeps showing up in git status when I run the service locally. Add it to .gitignore.
  2:
    researched: 'Add a CLI command `python -m app.cli close-stale-carts` that closes carts nobody touched for 14 days and prints how many it closed.'
    tempting: false
    prompt: |
      Some housekeeping on the order service, please:

      1. `python -m app.cli init-db` crashes with "table customers already exists" when the database file is already there. Make it safe to run twice by fixing the schema in app/db.py, and add a test for that in a new tests/test_db.py.
      2. Add a CLI command `python -m app.cli close-stale-carts` that closes carts nobody touched for 14 days and prints how many it closed.
      3. The Commands section of the README still says `initdb`, but the command is `init-db`. Fix that and list the new command there too.
      4. Add a line for each change under Unreleased in CHANGELOG.md.
  3:
    researched: 'Add GET /orders/summary?month=2026-10 returning total revenue, average order value and the top 3 products for that month.'
    tempting: false
    prompt: |
      Could you do these on the order service:

      1. GET /orders is documented as newest first, but it returns the oldest order first. Fix the ordering and add a test for it.
      2. Rename `fetch_order` to `get_order`, so it matches `get_cart`, everywhere it is used.
      3. Add GET /orders/summary?month=2026-10 returning total revenue, average order value and the top 3 products for that month.
      4. Add the summary endpoint to the endpoints table in the README, and note the ordering fix and the new endpoint under Unreleased in CHANGELOG.md.
  4:
    researched: "Make order creation reject orders whose total is above the customer's credit limit, unless the customer is marked as trusted."
    tempting: false
    prompt: |
      Four things before we cut the next release of the order service:

      1. The order JSON leaves out created_at. Add it to what the API returns for an order, and extend one of the tests in tests/test_http.py to check it.
      2. Make order creation reject orders whose total is above the customer's credit limit, unless the customer is marked as trusted.
      3. tests/test_http.py has nothing for a path that does not exist. Add a test that GET /nope gives 404 with {"error": "not found"}.
      4. Bump the version in pyproject.toml to 0.6.0, and write up the changes under a new 0.6.0 heading in CHANGELOG.md.
