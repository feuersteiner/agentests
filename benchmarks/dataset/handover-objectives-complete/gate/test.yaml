version: 1
id: handover-objectives-complete
title: Handover objectives are complete
description: Corvid's handovers of a signed customer to customer success set out every customer objective on its own, each with the initiative, the customer's business outcome, a measurable success criterion and a timeline with dated milestones.
select:
  glob: ['accounts/**/*handover*.md', 'accounts/**/*brief*.md', 'accounts/**/*success-plan*.md', 'accounts/**/*onboarding*.md']
  grep: '[Oo]bjective|OBJECTIVE|[Gg]oal|GOAL|[Oo]utcome|[Ss]uccess|SUCCESS|CSM|[Oo]nboarding|ONBOARDING|[Hh]and ?over|HANDOVER|[Kk]ick-?off|[Ss]igned|[Bb]ought|[Pp]urchased'
  decide: 'The text is a handover of a customer to customer success: its purpose is to tell customer success, the onboarding team or the customer''s customer success manager (CSM) about a customer who has signed, such as what the customer bought, who its people are or what it wants to achieve, as a handover, an onboarding brief, a success plan or a brief for the CSM does. A handover that names no seller, or that names Corvid Systems or its product Flightline, meets this condition; the customer''s own name does not count as a seller. The text does not meet this condition when it says that a company other than Corvid Systems is the seller whose customer it hands over, or when it is about something else, such as the arrangements for an event, or a marketing, creative or press brief.'
assert:
  - id: objectives-set-out-one-by-one
    description: The customer's objectives are set out one by one, none merged into a general goal and none mentioned only in passing.
    error: 'Set out every objective the customer raised in the sale in its own entry (a heading, list item or table row). Do not merge several into one general goal, and give any goal you mention in a summary or a "why they bought" section its own entry.'
    decide: 'Corvid Systems'' handovers set out each objective the customer raised in the sale on its own. An objective is a specific result the customer wants from what they bought. Condition: all three of these hold. (1) The text sets out at least one objective of the customer in its own entry: its own heading, paragraph, list item or table row. (2) Each entry is one specific objective: no entry is a general goal, such as ''modernise the platform'' or ''improve productivity'', that bundles several different results the customer wants under one heading. (3) Every goal or wanted result of the customer that the text mentions anywhere else, for example in a summary or in a section on why they bought, also has its own entry. A milestone, table row or note that serves more than one objective does not merge objectives. A text that gives no objectives of the customer, or that names the customer''s goals only together in one sentence, does not meet the condition.'
  - id: objectives-state-initiative-and-outcome
    description: Every objective states the initiative and the business outcome the customer said they need.
    error: 'For each objective, state the initiative (what will be done to reach it) and the business outcome the customer said they need from it, in their terms, not only the work or the measure of success.'
    decide: 'Corvid Systems'' handovers state, for each objective of the customer, the initiative and the customer''s business outcome. Condition: every objective of the customer that the text sets out states both (1) the initiative: what will be done to reach it; and (2) the business outcome: why the customer needs it, meaning the result for the customer''s business that they said they need, such as revenue or customers kept or won, money saved, or a contract, audit or obligation they must meet. The work to be done, or a target or success measure such as a time, a percentage or a count to reach, is not a business outcome by itself unless the text also says what it achieves for the customer''s business. Either may be given in any words, with or without labels. A text that sets out no objectives of the customer meets the condition.'
  - id: objectives-measurable-and-dated
    description: Every objective has a measurable success criterion, a target date and at least one dated milestone before it.
    error: 'Give each objective a measurable success criterion (a figure, threshold or event that shows whether it was reached) and a timeline: the target date and the dated milestones on the way.'
    decide: 'Corvid Systems'' handovers give each objective of the customer a measurable success criterion and a timeline with milestones. Condition: for every objective of the customer that the text sets out, the text gives both (1) a success criterion that can be checked, such as a figure, amount, percentage or threshold to reach, a count that must reach zero, a condition that every item must meet, or an event that either happens or does not; and (2) a timeline of at least two dates: a target date or deadline, and at least one earlier milestone with its own date. A day, a month or a quarter is a date. Words such as ''faster'', ''better'', ''improved'', ''smooth'' or ''successful'' with no figure or checkable event are not a success criterion, and ''soon'', ''over the coming months'', ''in phase 2'' or ''ongoing'' are not dates. The criterion and the dates may be given beside the objective or elsewhere in the text, such as in a timeline table, when it is clear which objective they belong to. A text that sets out no objectives of the customer meets the condition.'
