version: 1
id: privacy-purpose-and-basis
title: Each purpose with its lawful basis
description: Tessellate's privacy notices and privacy sections give every purpose for using personal data its own lawful basis, the one Tessellate relies on, and say what each legitimate interest is.
select:
  glob: ['website/**/*.md', 'privacy/**/*.md']
  grep: '[Pp]rivacy|PRIVACY|[Pp]ersonal (data|information|details)|PERSONAL DATA|[Ll]awful|[Ll]egal bas[ie]s|[Ll]egitimate interest|GDPR|[Dd]ata protection|[Yy]our (personal )?(data|information|details)'
assert:
  - id: each-purpose-has-its-basis
    description: Every purpose the text gives for using personal data is stated together with the lawful basis relied on for it.
    error: Give each purpose its own lawful basis where that purpose is described (in its table row, list item, paragraph or section), instead of a list of purposes and a separate list of bases, and do not leave any purpose without a basis.
    decide: 'This question is about texts that tell people what their personal data is used for, such as privacy notices and short privacy sections. Condition: every purpose for which the text says personal data is used (for example running an account, billing, analytics, marketing emails or a newsletter, fraud prevention, support) is stated together with the lawful basis relied on for that purpose. The lawful bases are contract, legal obligation, legitimate interests, consent, vital interests and public task; a basis counts when the text names it or says in words that it is why the use is allowed, such as "because we need it to provide the service you signed up for" or "because you agreed to it". Stated together means in the same table row, list item, sentence, paragraph or section as that purpose, or in a list of bases that says which purpose each basis covers. The condition is broken when the purposes are given in one list or passage and the bases in another that does not say which basis goes with which purpose (for example "we rely on contract, consent and legitimate interests"), and when any purpose is given with no lawful basis at all. Saying who data is shared with, how long it is kept or what rights people have is not a purpose. A text that gives no purpose for using personal data, such as a page that only links to the privacy notice or describes product features or security, meets the condition.'
  - id: tessellate-bases-are-right
    description: Each of Tessellate's five purposes is given the lawful basis Tessellate relies on for it.
    error: 'Use the lawful bases Tessellate relies on: account creation and running the account, contract; billing, contract and legal obligation; product analytics, legitimate interests; marketing emails and the newsletter, consent; fraud prevention, legitimate interests.'
    grep: '[Cc]ontract|CONTRACT|[Oo]bligation|[Ll]egitimate|LEGITIMATE|[Cc]onsent|CONSENT|[Aa]gree|[Ll]awful|[Ll]egal|[Bb]asis|[Bb]ases|\b[Ll]aw\b'
    decide: 'Tessellate, the company that makes an online whiteboard, relies on these lawful bases for its five uses of personal data. Account creation and running the account (signing people in, storing their boards): contract. Billing (taking payment, invoices): contract, legal obligation, or both. Product analytics (recording how the product is used): legitimate interests. Marketing emails, including the newsletter: consent. Fraud prevention (checking sign-ins and payments for fraud): legitimate interests. Condition: wherever the text gives a lawful basis for one of these five Tessellate uses, it gives the basis listed for that use. For example, product analytics based on consent, the newsletter or marketing emails based on legitimate interests, or account creation based on legitimate interests breaks the condition. Uses not in this list do not count, nor does a basis that the text does not link to any particular use. Texts about a company other than Tessellate do not count: a privacy notice that names another company as the one using the data, and does not mention Tessellate, meets the condition whatever bases it gives. A text that gives no lawful basis for any of the five uses meets the condition.'
  - id: legitimate-interests-described
    description: Every use of personal data that relies on legitimate interests says what those interests are.
    error: Where a use relies on legitimate interests, say what the interest is, for example "protecting your account and Tessellate from fraud", not just "legitimate interests".
    grep: '[Ll]egitimate|LEGITIMATE'
    decide: 'Condition: wherever the text gives legitimate interests as the lawful basis for a use of personal data, it also says in words what those interests are: what the company, or someone else, wants to achieve or protect through that use, for example "our legitimate interest in protecting accounts from fraud" or "legitimate interests: seeing which features are used so we can improve them". The interest may be given in brackets, in the same sentence, or in the description of that use, as long as the words say what is gained or protected. The condition is broken when "legitimate interests" is given for a use that is described only by a short name or by the data it involves, such as "Fraud prevention: legitimate interests" or "Analytics (usage events): legitimate interests", with nothing saying what the interest is; it is also broken when legitimate interests appears in a list of lawful bases without any words saying what the interests are. A text that never gives legitimate interests as a lawful basis meets the condition.'
