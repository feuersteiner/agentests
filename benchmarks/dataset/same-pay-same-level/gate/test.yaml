version: 1
id: same-pay-same-level
title: Same pay for the same level
description: Fieldstone's adverts, careers pages, offer letters and candidate emails give pay only as the level's one salary and never suggest it varies with location or negotiation.
select:
  glob: ['hiring/adverts/**/*.md', 'offers/**/*.md', 'outbox/**/*.md', 'website/**/*.md']
  grep: '[Ss]alar|SALAR|[Cc]ompensat|COMPENSAT|[Rr]emunerat|\b[Ww]ages?\b|\b[Pp]ay\b|\bPAY\b|\b[Pp]aid\b|\b[Ee]arn|[Gg]ross|\b[Ll][1-5]\b|[Nn]egotia|[Oo]ffer|[Cc]ounter|[Ff]lexib|[Bb]onus|€ ?[0-9]{2,3}[,. ]?[0-9]{3}|EUR ?[0-9]|[0-9]{2,3}[,. ]?[0-9]{3} ?(€|EUR|[Ee]uro)|[0-9]{2,3} ?[kK]\b'
assert:
  - id: salary-is-level-salary
    description: Every salary figure is the one salary of the job's level.
    error: 'Give the level''s one salary, gross a year: L1 €58,000, L2 €72,000, L3 €88,000, L4 €106,000, L5 €128,000. No ranges, no "from" or "up to" figures, no other figure.'
    grep: '€ ?[0-9]{2,3}[,. ]?[0-9]{3}|EUR ?[0-9]|[0-9]{2,3}[,. ]?[0-9]{3} ?(€|EUR|[Ee]uro)|[0-9]{2,3} ?[kK]\b|[Ss]alar|SALAR|[Cc]ompensat|\b[Pp]ay\b|[Gg]ross|[Bb]and|[Rr]ange|[Ss]tarting|[Uu]p to|[Bb]etween'
    decide:
      - 'Fieldstone pays one salary per level, gross a year, for every role and wherever the employee lives: L1 €58,000; L2 €72,000; L3 €88,000; L4 €106,000; L5 €128,000. A title shows its level: Junior is L1, a title with no prefix is L2, Senior is L3, Lead is L4 and Principal is L5. Condition: every salary figure the text gives for a job is exactly the salary of that job''s level, as one figure. It fails if it gives a different figure, a salary range, a minimum ("from", "starting at") or a maximum ("up to"). A monthly figure that adds up to the yearly salary is fine. Only the salary figures matter here, not what the text says about negotiation or location. A text that gives no salary figure for a job passes.'
      - 'Condition: the text names the company it is written for, and that company is not Fieldstone. The name must actually appear in the text as the employer that is hiring or making the offer, or as the business whose product, prices or service the text presents, for example "Quaywell is hiring" or a signature such as "Rhea Lindqvist, Talent Lead, Quaywell". A text that names no company it is written for does not meet the condition, nor does a text whose only other company is one the candidate works for or is talking to, nor a text that mentions Fieldstone anywhere.'
  - id: no-location-pay
    description: Nothing suggests pay depends on where the person lives.
    error: 'Remove any link between pay and location: every level''s salary is the same wherever the employee lives.'
    grep: '[Ll]ocat|\b[Ll]ive|[Ll]iving|[Bb]ased (in|on)|[Cc]ountr|[Rr]egion|[Gg]eo|[Ll]ocal|[Mm]arket|\b[Cc]it(y|ies)\b|[Pp]ortug|[Ll]isbon|[Aa]djust|[Ww]herever|[Ww]here (you|they|people|someone|employees)|[Rr]elocat|[Cc]urrenc|[Pp]urchasing|\bCOL\b|[Ii]ndex|[Zz]one|[Tt]ier|[Dd]iffer'
    decide:
      - 'Fieldstone pays the same salary for a level wherever the employee lives. Condition: the text does not say or suggest that a salary depends on, or will be adjusted for, where the candidate or employee lives or works. It fails on location-based pay, pay that differs by country, city or region, a cost-of-living or local-market adjustment, a geographic pay band or zone, or an offer to look at the salary for the candidate''s country. Saying that pay is the same wherever people live passes, and so does mentioning where people live or work for other reasons, such as remote working, time zones, public holidays, contracts or taxes. A text that says nothing about how location affects pay passes.'
      - 'Condition: the text names the company it is written for, and that company is not Fieldstone. The name must actually appear in the text as the employer that is hiring or making the offer, or as the business whose product, prices or service the text presents, for example "Quaywell is hiring" or a signature such as "Rhea Lindqvist, Talent Lead, Quaywell". A text that names no company it is written for does not meet the condition, nor does a text whose only other company is one the candidate works for or is talking to, nor a text that mentions Fieldstone anywhere.'
  - id: no-individual-negotiation
    description: Nothing suggests pay can be negotiated or varied for one person.
    error: 'Remove any suggestion of negotiation: the level''s salary is not negotiated individually, and pay rises only with the January scale update or a promotion to the next level.'
    grep: '[Nn]egotia|[Ff]lexib|\bDOE\b|[Ee]xperience|[Dd]epend|[Cc]ommensurate|[Rr]oom|[Dd]iscuss|[Ee]xpectation|[Cc]ompetitive|[Ss]igning|[Bb]onus|[Rr]evisit|[Rr]eview|[Rr]econsider|[Ss]ee what|[Ww]hat (we|I) can|[Mm]atch|[Cc]ounter|[Tt]op[- ]?up|[Ee]xception|[Rr]ight (person|candidate|fit)|[Mm]ove (on|up)|[Ss]tretch|[Bb]ump|[Ee]xtra|[Ii]ndividual|[Tt]ailor|[Pp]ersonal|[Ww]ork (something|it) out|[Tt]alk|[Cc]hat|[Oo]pen to|[Hh]eadroom|[Bb]udget|[Uu]p to|[Bb]etween|[Rr]ange|[Ss]tarting|[Rr]aise|[Ii]ncrease|[Hh]igher'
    decide:
      - 'Fieldstone does not negotiate pay with individuals: everyone at a level gets that level''s one salary, with no signing bonus or other one-off payment for one person, and pay changes only when the whole scale is updated each January or when someone is promoted to the next level. Condition: the text does not say or suggest that a salary can be negotiated, raised or varied for one person. It fails on "depending on experience" or "DOE", "negotiable", a flexible or open salary, "room to discuss", an offer to see what can be done, to consider a counter-offer or match another offer, to add a signing bonus or one-off payment, or to revisit one person''s salary at a review or after probation. Saying the salary is fixed for the level and not negotiated, explaining the January scale update or promotion to the next level, and asking for years of experience as a job requirement all pass. A text that says nothing about how pay is set passes.'
      - 'Condition: the text names the company it is written for, and that company is not Fieldstone. The name must actually appear in the text as the employer that is hiring or making the offer, or as the business whose product, prices or service the text presents, for example "Quaywell is hiring" or a signature such as "Rhea Lindqvist, Talent Lead, Quaywell". A text that names no company it is written for does not meet the condition, nor does a text whose only other company is one the candidate works for or is talking to, nor a text that mentions Fieldstone anywhere.'
