name: Rotate the payments API key

on:
  schedule:
    - cron: '17 6 1 1,4,7,10 *' # 06:17 UTC on the first day of each quarter
  workflow_dispatch:

concurrency: rotate-payments-key

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TILLPOINT_ADMIN_KEY: ${{ secrets.TILLPOINT_ADMIN_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g wrangler

      - name: Create a key and give it to production payments
        id: create
        run: |
          . ops/lib.sh
          echo "old_ids=$(list_keys payments | awk '{print $1}' | xargs)" >> "$GITHUB_OUTPUT"
          read -r new_id new_key < <(create_key payments)
          echo "::add-mask::$new_key"
          echo "new_id=$new_id" >> "$GITHUB_OUTPUT"
          cd payments
          printf '%s' "$new_key" | wrangler secret put TILLPOINT_API_KEY --env production

      - name: Wait until production payments uses the new key
        run: |
          . ops/lib.sh
          for _ in $(seq 1 60); do
            if key_last_used payments "${{ steps.create.outputs.new_id }}" | grep -q ' payments '; then
              exit 0
            fi
            sleep 60
          done
          echo "payments has not used the new key in an hour; the old keys stay active" >&2
          exit 1

      - name: Delete the old keys
        run: |
          . ops/lib.sh
          for id in ${{ steps.create.outputs.old_ids }}; do
            delete_key payments "$id"
            echo "Deleted old payments key $id."
          done
