name: Rotate the payments API key

on:
  schedule:
    - cron: '17 6 1 1,4,7,10 *' # 06:17 UTC on the first day of each quarter
  workflow_dispatch:

concurrency: rotate-payments-key

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g wrangler
      - name: Rotate the Tillpoint key
        run: ops/rotate_payments_key.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TILLPOINT_ADMIN_KEY: ${{ secrets.TILLPOINT_ADMIN_KEY }}
