name: Quarterly payments key rotation

on:
  schedule:
    - cron: '0 6 1 */3 *'
  workflow_dispatch:

jobs:
  rotate:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TILLPOINT_ADMIN_KEY: ${{ secrets.TILLPOINT_ADMIN_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Rotate the Tillpoint API key
        run: |
          . ops/lib.sh
          old_ids=$(list_keys payments | awk '{print $1}')
          read -r new_id new_key < <(create_key payments)
          cd payments
          printf '%s' "$new_key" | npx wrangler secret put TILLPOINT_API_KEY
          npx wrangler deploy
          cd ..
          for id in $old_ids; do
            delete_key payments "$id"
          done
          echo "Rotated the payments key to $new_id"
