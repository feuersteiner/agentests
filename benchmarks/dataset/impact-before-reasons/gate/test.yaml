version: 1
id: impact-before-reasons
title: Impact before reasons
description: Customer messages about an unwelcome change or bad news say what changes for the reader, from when and by how much, before they explain why.
select:
  glob: ['emails/**/*.md', 'content/**/*.md']
  grep: '[Ii]ncreas(e|es|ed|ing)\b|[Gg]o(es|ing)? up\b|[Gg]one up|[Rr]ais(e|es|ed|ing) (our |the |its |your |all )?(price|fee|charge|cost|rate)|[Pp]rices? (is |are |will )?(go|ris|increas|chang)|[Pp]rice (rise|increase|change|hike)|[Hh]igher (price|fee|charge|bill|rate)|[Cc]osts? (you )?([£€$]\d+(\.\d\d)? |\d+p )?more|([£€$]\d+(\.\d\d)?|\d+p) (a day |a month |a year |per day |per month |per year )?more\b|[Ee]xtra [£€$]\d|[Nn]ew (monthly |yearly |annual )?(price|fee|charge)|(will|''ll|is|are|be) no longer|[Nn]o longer (include|offer|available|be |come|support|get|have|free|send|provide|cover)|[Ww]ill end|(is|are) ending|[Ee]nding (free|the|your|our|support|access|paper)|[Ee]nd(s|ing)? (on|from) \d|[Dd]iscontinu|[Ww]ithdraw|[Ss]unset|[Pp]has(e|ing) out|[Cc]los(e|es|ing) (down|your)|[Ww]on''?t (include|be included|get|have|come with|cover)|[Ll]os(e|es|ing) (access|free|your)|([Ww]e''re|[Ww]e are|[Ww]e will|[Ww]e''ll) (stop|stopping|ending|removing|closing|withdrawing|discontinuing|scrapping|dropping|cutting|reducing)|[Uu]nfortunately|[Ss]orry to|[Rr]egret|[Dd]ifficult decision|[Dd]ecided to|[Dd]ecision to|(we''ve|we have|We''ve|We have) had to|[Cc]hang(e|es|ing) to (your|our|the)|[Ww]hat''?s changing|(we''re|we are|We''re|We are|is|are) changing|([Ff]rom|[Ss]tarting|[Ee]ffective|[Bb]eginning) (on )?\d{1,2}(st|nd|rd|th)? (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)|([Ff]rom|[Ss]tarting|[Ee]ffective|[Bb]eginning) (January|February|March|April|May|June|July|August|September|October|November|December)'
assert:
  - id: change-before-reasons
    description: In the body, each unwelcome change is stated before any reason for it.
    error: Open with what changes for the reader (what, from when, how much) and move the reasons (costs, investment, background, values) after it.
    decide:
      - 'The text does not tell its readers about bad news or about a change they would not welcome, such as a price or fee rise, a plan losing an allowance or a feature, stricter terms or a service ending. Good news, such as a new feature, a new option or a lower price, is not such a change, and neither is a text that only explains how something works.'
      - 'Leaving aside the title, subject line and preview line, and reading the rest of the text from the top, the text says what changes for the reader before it gives any reason for that change. A reason is any sentence or clause about why the change is made: rising costs, investment, background, or the company''s history, values or beliefs, even when it does not say "because" or "so". A clause before the change, such as "To keep investing in our service, ...", is a reason that comes first. A reason placed after the change, even in the same sentence, is fine. A greeting or a line that only says there is news may come before the change. When the text has several changes, check each change against its own reasons. A text that gives no reason meets this condition.'
  - id: date-and-amount-before-reasons
    description: The date and the amount of each change are given before the reasons, not held back until after them.
    error: Give the date the change starts and the amount (the new price, the rise or the new charge) when you first state the change, before any reason.
    decide:
      - 'The text does not tell its readers about bad news or about a change they would not welcome, such as a price or fee rise, a plan losing an allowance or a feature, stricter terms or a service ending. Good news, such as a new feature, a new option or a lower price, is not such a change, and neither is a text that only explains how something works.'
      - 'In this text, the date and the amount of each change are given, the first time they are mentioned, before the first reason for that change. The date is when the change starts; the amount is a new price, how much a price or fee goes up, or a new charge. A text that first says only that something is changing, then explains why, and only after that gives the date or the amount, fails. Mentioning the date or the amount again after the reasons is fine. A text that gives no reason, or that gives neither a date nor an amount, meets this condition.'
  - id: no-reason-in-title
    description: The title, subject line and preview line name the change or the news and give no reason for it.
    error: Make the title, subject line and preview line say what changes, or simply that there is news, and keep the reasons for after the change in the body.
    grep: '(^|\n)(subject|title|preheader|preview|description|name): [^\n]*([Ii]nvest|[Rr]ising|[Rr]isen|[Ii]mprov|[Uu]pgrad|[Bb]etter|[Ff]aster|[Ss]tronger|[Ww]ider|5G|[Nn]etwork|[Bb]eliev|[Vv]alues|[Ff]air|[Ss]ustain|[Ii]nflation|[Ee]nergy|[Bb]ecause|[Ss]o (that )?we|[Ff]und|[Hh]elp us|[Cc]ommit|[Gg]row|[Dd]emand|[Rr]eason)|(^|\n)# [^\n]*([Ii]nvest|[Rr]ising|[Rr]isen|[Ii]mprov|[Uu]pgrad|[Bb]etter|[Ff]aster|[Ss]tronger|[Ww]ider|5G|[Nn]etwork|[Bb]eliev|[Vv]alues|[Ff]air|[Ss]ustain|[Ii]nflation|[Ee]nergy|[Bb]ecause|[Ss]o (that )?we|[Ff]und|[Hh]elp us|[Cc]ommit|[Gg]row|[Dd]emand|[Rr]eason)'
    decide:
      - 'The text does not tell its readers about bad news or about a change they would not welcome, such as a price or fee rise, a plan losing an allowance or a feature, stricter terms or a service ending. Good news, such as a new feature, a new option or a lower price, is not such a change, and neither is a text that only explains how something works.'
      - 'Look only at the title, subject and preheader lines in the front matter at the top of the text and at its first # heading, and ignore the rest of the text, including any reasons given in the body. None of those lines gives a reason for a change, such as costs, investment, improvements to the network or service, or the company''s values. A line that names the change, says there is news, or asks why without answering, such as "Why are prices going up?", is fine.'
