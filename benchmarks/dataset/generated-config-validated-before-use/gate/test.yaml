version: 1
id: generated-config-validated-before-use
title: A generated features file is validated before use
description: Code under src/ that loads the generated features file checks the whole file, keeps the features in use when a new file is invalid, and never throws or exits because of a bad file.
select:
  glob: 'src/**/*.ts'
  # Only the files that are about features; the criteria pass a file that never loads the features file.
  grep: '[Ff]eature'
assert:
  - id: file-checked-before-use
    description: The features file is checked for shape, size and duplicate names, and rejected whole when a check fails.
    error: 'Check the parsed file before using any of it: an array of objects in which every field you use has the right type, no more than MAX_FEATURES entries, and no two entries with the same name; reject the whole file when any check fails.'
    # Only files that read, parse or convert untyped data can turn the file into features.
    grep: 'JSON\.parse|\.json\(\)|readFile|Bun\.file|\bunknown\b|\bany\b|\bas\s+(?:readonly\s+)?Feature'
    decide: 'Wherever this file turns the contents of the features file (data/features.json, the generated list of request features) into features, it checks all of the following before any of them is returned or used, and rejects the whole file when any check fails: the parsed value is an array; every entry is an object, and every field the code takes from an entry has its type checked (for example a text that must not be empty, or a number that must be finite); there are no more than MAX_FEATURES entries; and no two entries have the same name. This fails when one of these checks is missing, for the whole list or for one field the code reads (a cast such as `as number` or a conversion such as Number(x) is not a check), and it also fails when, instead of rejecting the file, the code skips bad entries, drops repeated names, or stops at MAX_FEATURES entries (or cuts the list down to MAX_FEATURES), and then uses the entries it kept. A file that does not itself parse or convert the features file, for example one that only calls a loader imported from another module or only uses features it is given, satisfies this.'
  - id: bad-file-never-stops-service
    description: An unreadable or invalid features file never throws out of the loading code or exits the process.
    error: 'Catch read, parse and check failures where the file is loaded, log them and report the rejection through the return value; never throw or exit because of the file.'
    # Only files that throw, exit, assert or read a file can let a bad file stop the service; JSON.parse of a file's text comes with its read.
    grep: 'throw|exit|assert|readFile|Bun\.file|\.json\(\)'
    decide: 'No code in this file throws an error or exits the process because the features file (data/features.json, the generated list of request features) cannot be read, is not valid JSON, has more than MAX_FEATURES entries, or has duplicate or badly typed entries, and no direct read of that file in this file (readFileSync, readFile or Bun.file on its path) and no JSON.parse of its text sits outside a try/catch. A call to a function imported from another module, such as the loader, counts here as neither a read nor a throw: that module is judged in its own file. A throw that this file catches before it leaves the function that loads the features file does not count, and neither does a throw, exit or JSON.parse about anything other than the features file, such as another input or a programming error.'
  - id: bad-file-keeps-features-in-use
    description: A newly loaded features file replaces the features in use only once it is known to be valid, and never in place.
    error: 'Build the new list on its own and swap it in only after the load reports success; when it fails, log it and keep the features in use.'
    # Only files with a call or a function can load anything.
    grep: '\('
    decide: 'No code in this file lets a newly loaded features file (data/features.json, the generated list of request features) replace or change the features already in use before it is known to be valid. Code that loads the file again while the service runs (in a file watcher, a reload function or endpoint, a timer or a signal handler) assigns the new list to the features in use, or passes it to a callback that does, only after checking in this file that the load succeeded, for example by a success flag, an undefined, null or empty result, or a catch that leaves the old list in place. Assigning or passing on a loader''s result unchecked fails this even when the loader validates the file, because a loader that answers a bad file with an empty list would then wipe the features in use. No load writes into, empties or splices an array that holds the features in use or that an earlier load returned, such as a module-level array that every load fills in place. Loading the file once at startup into a new list, when nothing is in use yet, is not covered. A file with none of this code satisfies this.'
