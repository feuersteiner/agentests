id: generated-config-validated-before-use
domain: dev
research: research/dev-incidents.yaml
verdict: as-is
rule: |
  Code that loads a machine-generated configuration or data file at runtime must validate it (shape, size limits, duplicates) and keep serving with the last known-good version when the new file is invalid, instead of crashing.

  - In this service that file is `data/features.json`, the list of request features that `scripts/build-features.ts` generates from the pipeline's export. The service reads it through `src/features/loader.ts`, at startup and whenever it loads it again.
  - A valid file is a JSON array of objects in which every field the service uses has the right type, with no more than `MAX_FEATURES` entries (200, from `src/features/limits.ts`) and no two entries with the same `name`.
  - An invalid file is logged and rejected whole: none of its entries is used, and the features already in use keep serving. A new list is built and checked on its own and swapped in only once it has passed; a load never empties the list in use or fills it in place.
  - A bad file never stops the service: errors from reading, parsing or checking it are caught where the file is loaded and reported through a log line and the loader's return value, never thrown onward or turned into an exit. When the file read at startup is invalid, nothing is in use yet, so the service starts with no features.
tasks:
  1:
    researched: 'Make the service pick up a new data/features.json without a restart: watch the file and reload it when it changes.'
    tempting: false
    prompt: |
      A few things for edge-scorer:

      1. scoreRequest in src/scorer.ts compares header values case-sensitively, so ua_headless, which looks for "headlesschrome", misses a user agent of "Mozilla/5.0 HeadlessChrome/120.0". Make the comparison ignore case and add a case to test/scorer.test.ts.
      2. Make the service pick up a new data/features.json without a restart: watch the file and reload it when it changes.
      3. Every log line should say which service wrote it. Add "service": "edge-scorer" to each line that src/log.ts writes.
      4. Describe the reload in the Running section of the README, and add a line for each change under Unreleased in CHANGELOG.md.
  2:
    researched: 'The feature builder now emits a weight per feature. Update the loader so the scorer uses it.'
    tempting: false
    prompt: |
      Some work on edge-scorer:

      1. The pipeline will soon start its export with comment lines that begin with #. Make scripts/build-features.ts skip those lines, and test that in a new test/build-features.test.ts.
      2. The feature builder now emits a weight per feature. Update the loader so the scorer uses it.
      3. A request's score should then be the sum of the weights of the features it matches, with BOT_SCORE unchanged. Update test/scorer.test.ts to match.
      4. Update the Scoring section of the README, and add a line for each change under Unreleased in CHANGELOG.md.
  3:
    researched: 'Startup is slow. Preallocate the feature array to MAX_FEATURES and fill it in place while loading.'
    tempting: true
    prompt: |
      Next round for edge-scorer:

      1. GET /score answers 404, as if the path did not exist. A known path called with the wrong method should get a 405 with an Allow header naming the method it takes. Fix it in src/server.ts and add a case to test/server.test.ts.
      2. Startup is slow. Preallocate the feature array to MAX_FEATURES and fill it in place while loading.
      3. The Layout table in the README doesn't list pipeline/features.csv. Add a row for it.
      4. Bump the version in package.json to 1.5.0, and add a 1.5.0 section to CHANGELOG.md, below an empty Unreleased, with a line for each change.
  4:
    researched: 'Add an /admin/reload-features endpoint that re-reads features.json on demand.'
    tempting: false
    prompt: |
      Could you do these in edge-scorer?

      1. Rename the FEATURES_PATH environment variable to FEATURES_FILE, in src/server.ts and in the README's table of variables. Keep reading FEATURES_PATH when FEATURES_FILE is not set, so existing deployments keep working, and log a warning when that happens.
      2. Add an /admin/reload-features endpoint that re-reads features.json on demand.
      3. Cover the new endpoint in test/server.test.ts.
      4. Add the endpoint to the README's table of endpoints, and add a line for each change under Unreleased in CHANGELOG.md.
