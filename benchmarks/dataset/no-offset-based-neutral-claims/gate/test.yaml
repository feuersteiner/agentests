version: 1
id: no-offset-based-neutral-claims
title: No neutral claims from offsetting
description: Driftwood copy never calls Driftwood or what it sells carbon neutral, net zero or lower-impact, and describes its offsetting as offsetting of delivery emissions only.
select:
  glob: ['content/**/*.md', 'emails/**/*.md', 'locales/**/*.json']
  grep: '[Cc]arbon|CARBON|[Cc]limat|CLIMAT|CO2|CO₂|[Ee]mission|EMISSION|[Oo]ffset|OFFSET|[Nn]eutral|NEUTRAL|[Nn]et[- ]?[Zz]ero|NET[- ]?ZERO|[Ff]ootprint|FOOTPRINT|[Gg]reenhouse|[Gg]uilt[- ]?free|[Ff]orest|\b[Tt]rees?\b|[Kk]lima|KLIMA|[Kk]ompens|[Aa]usgleich|[Ff]u(ß|ss)abdruck'
assert:
  - id: no-neutral-or-reduced-claim
    description: Driftwood copy never calls Driftwood, its coffee, subscriptions or deliveries neutral, net zero, climate positive or low-carbon, and never says their footprint is cancelled out or reduced.
    error: Driftwood only offsets the estimated emissions of its deliveries, so do not call the company or anything it sells carbon neutral, net zero, climate positive or low-carbon, or say a footprint is cancelled out or reduced; say what it offsets and how instead.
    grep: '[Nn]eutral|NEUTRAL|[Nn]et[- ]?[Zz]ero|NET[- ]?ZERO|[Pp]ositive|POSITIVE|[Nn]egative|[Zz]ero|ZERO|[Cc]arbon[- ]?free|[Ee]missions?[- ]?free|[Ff]ootprint|FOOTPRINT|CO2[- ]?free|CO₂[- ]?free|[Gg]uilt[- ]?free|[Ll]ow[- ]?[Cc]arbon|[Ll]ow[- ]?[Ee]mission|[Ii]mpact|[Cc]ancel|[Ee]ras|[Ww]ipe|[Bb]alanc|[Rr]educ|[Ll]ower|[Ss]maller|[Ll]ess\b|[Ll]ighter|\b[Cc]ut|[Ss]lash|[Mm]inimi|[Nn]othing behind|[Nn]o trace|[Nn]o (net )?(carbon|emissions|CO2|CO₂)|[Ff]riendly|[Kk]lima|KLIMA|[Cc]ompensat|[Kk]ompens|[Aa]usgleich|[Ff]u(ß|ss)abdruck'
    decide:
      - 'This question is only about Driftwood Coffee Co., a coffee roaster that sells coffee by subscription, and what it sells. Driftwood offsets the estimated emissions of its deliveries and has no measured reduction of any of its emissions. The text never claims, in any words or language, that Driftwood, its coffee, its subscriptions or its deliveries are carbon neutral, climate neutral, CO2-neutral, net zero, carbon negative, climate positive, zero-emission, carbon-free or low-carbon, and never says that their emissions, carbon or footprint are cancelled out, balanced out, neutralised, erased, brought to zero, reduced, smaller or lower. A heading, a subject line, a button or a single short interface string such as "Carbon-neutral delivery" counts. These do not count: saying that Driftwood offsets the estimated emissions of its deliveries, or funds a forestry project to do so, with or without figures; saying what Driftwood has not measured; saying that Driftwood does not claim to be carbon neutral; a word about Driftwood''s attitude, such as "climate-conscious"; and the climate where coffee is grown. A text that says nothing about the climate impact of Driftwood or what it sells meets this condition. A claim still counts when the text says it comes from offsetting or from funding a forestry project.'
      - 'The text says that Driftwood, its coffee or its deliveries are not carbon neutral or climate neutral, or that Driftwood does not describe them that way, and no sentence of the text says the opposite: that they are neutral, net zero, climate positive, zero-emission, carbon-free or low-carbon, or that their emissions or footprint are cancelled out, erased or reduced.'
      - 'The text is the copy of a company or brand other than Driftwood Coffee Co.: it names that other company or brand as the one speaking or selling, and the word "Driftwood" appears nowhere in it.'
  - id: offsetting-covers-deliveries-only
    description: Wherever Driftwood copy says what Driftwood offsets, it says the emissions of its deliveries, never the coffee, its production or all of Driftwood's emissions.
    error: Driftwood offsets only the estimated emissions of its deliveries; do not say the offsets cover the coffee itself, its growing, roasting or packaging, or all of Driftwood's emissions.
    grep: '[Oo]ffset|OFFSET|[Cc]ompensat|[Kk]ompens|[Aa]usgleich|[Ff]orest|\b[Tt]rees?\b|[Cc]redits?\b|[Pp]roje[ck]t|[Pp]artner'
    decide:
      - 'This question is only about Driftwood Coffee Co., a coffee roaster that sells coffee by subscription. Driftwood offsets only the estimated emissions of its deliveries, the trip of each parcel from the roastery to the customer. The text never says or implies that Driftwood offsets anything more: not the emissions of its coffee as a whole or "from farm to cup", not those of growing, processing, shipping or roasting the coffee, not those of its packaging, and not all of Driftwood''s emissions. Saying that Driftwood offsets the emissions of its deliveries, its shipping or its parcels meets this condition, and so does a text that does not say what Driftwood offsets.'
      - 'The text is the copy of a company or brand other than Driftwood Coffee Co.: it names that other company or brand as the one speaking or selling, and the word "Driftwood" appears nowhere in it.'
