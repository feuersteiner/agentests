version: 1
id: no-first-or-only-claims
title: No "first" or "only" claims
description: Marketing pages and emails never claim that the product, a feature or the company is the first or the only one to do something, however the claim is worded.
select:
  glob: ['content/**/*.md', 'emails/**/*.md']
assert:
  - id: no-first-claim
    description: Nothing claims to be the first to do or offer something.
    error: Remove the claim of being first (also when worded as "pioneered", "industry-first" or "before anyone else", or hedged with "we believe"); say what the feature does instead.
    decide: 'The text never claims that a company, a product or a feature is the first to do or offer something, or did it before others. This covers any wording of that claim, such as "the first", "industry-first", "pioneered", "invented", "before anyone else" or "ahead of the rest of the market", in a title, a heading, body copy, a quotation or front matter, and it still counts when hedged with "we believe" or "as far as we know". These do not count: "first" as an ordinary ordinal or step, as in "your first trace", "the first notification", "the first span" or "first, install the SDK"; saying that a feature is new, is now available or was added; and a date, such as a launch date or the year a company was founded. A text that makes no such claim passes.'
  - id: no-only-claim
    description: Nothing claims to be the only one that does or offers something.
    error: Remove the claim of being the only one (also when worded as "no other tool", "nobody else", "unlike any other" or "unique", or hedged with "we believe"); say what the feature does instead.
    decide: 'The text never claims that a company, a product or a feature is the only one that does or offers something, or that no competitor or other product does it. This covers any wording of that claim, such as "the only tool that", "no other platform", "nobody else", "nothing else on the market", "unlike any other tool", "one of a kind", "unique", "you will not find this elsewhere" or "the only platform you will ever need", in a title, a heading, body copy, a quotation or front matter, and it still counts when hedged with "we believe" or "as far as we know". These do not count: "only" as an ordinary limit, restriction or price, as in "only admins can delete", "only failed requests are kept", "only account records stay" or "if you only need"; and saying that a feature is new or is now available. A text that makes no such claim passes.'
