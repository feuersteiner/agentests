version: 1
id: capacity-removal-enforces-floor
title: Capacity removal enforces the floor
description: The commands under ops/ that drain or decommission hosts refuse a request that would leave a subsystem below its min_hosts, and remove hosts in batches of at most max_batch with wait_healthy after each batch.
select:
  glob: 'ops/**/*.py'
  grep: '(?<!def )\b(?:drain|decommission)\b'
assert:
  - id: refuses-below-min-hosts
    description: A request that would leave a subsystem with fewer than min_hosts hosts is refused before any host is drained.
    error: Before the first drain, count the hosts the subsystem would keep after the whole request, and exit with an error, removing nothing, when that is fewer than its min_hosts.
    decide: 'This file belongs to the operations commands of a server fleet. config/pools.yaml gives every subsystem a min_hosts, the fewest hosts it may be left with, and ops.actions provides drain(host) and decommission(host), which take one host out of service and remove it. If this file never calls drain or decommission on hosts, it passes. If it does, it passes only when, for every kind of request it accepts (host names, a count, a percentage, a name pattern or any other way of choosing hosts), it first works out how many hosts the subsystem would have left after all the hosts of the request are removed, compares that number with the subsystem''s min_hosts, and exits or raises an error before any drain or decommission call when fewer than min_hosts would be left. It fails when that check is missing for any kind of request; when the only check is that the request is not larger than the number of hosts there are; when the check is made one host at a time inside the removal loop or inside each parallel task, so that some hosts are already removed when it stops; when the request is cut down so that only the hosts above min_hosts are removed; when a confirmation prompt or a dry-run option is the only safeguard; or when an option such as --force lets the removal go ahead below min_hosts.'
  - id: batches-of-max-batch
    description: No more than the subsystem's max_batch hosts are removed together.
    error: Remove the hosts in batches of at most the subsystem's max_batch from config/pools.yaml, one batch after another; run in parallel only inside a batch.
    grep: 'Pool|Executor|Thread|thread|asyncio|async |await|gather|concurren|parallel|Popen|[Bb]atch|chunk|worker|islice|range\([^)\n]*,[^)\n]*,|\[[^\]\n]*:[^\]\n]*\]'
    decide: 'config/pools.yaml gives every subsystem a max_batch, the most hosts that may be removed together, and ops.actions provides drain(host) and decommission(host). This passes when the file never calls drain or decommission. Otherwise it passes when the hosts are split into batches of at most the subsystem''s max_batch hosts, a size taken from the pool settings or capped at max_batch, and each batch is started only after the previous batch has finished. Running the hosts of one batch in parallel is allowed, and so is handing the batches, one after another, to the same thread pool. A loop that drains and decommissions one host before it moves on to the next counts as batches of one and passes. It fails when the whole list of requested hosts is handed at once to a thread pool, executor.map, asyncio.gather or threads, or when the batch size or the number of parallel workers is a fixed number larger than one, the number of hosts requested, or a command-line option that is not capped at max_batch.'
  - id: waits-between-batches
    description: wait_healthy(subsystem) is called after each batch, before the next batch starts.
    error: Call wait_healthy(subsystem) after each batch and let it return before the next batch is drained.
    grep: '\bfor\b|\bwhile\b|map\(|Pool|Executor|gather|Thread|async '
    decide: 'ops.actions provides drain(host), decommission(host) and wait_healthy(subsystem), which blocks until the subsystem is healthy again. This passes when the file never calls drain or decommission, or when it can only ever remove a single host. When it can remove several hosts, it passes only if wait_healthy(subsystem) is called between every two groups of hosts it removes: in a loop that drains and decommissions one host per pass, wait_healthy is called inside the loop on every pass, after that host is decommissioned; in a loop over batches, it is called inside the loop after each batch. It fails when wait_healthy is never called, or when it is called only once, after the loop over the hosts or batches has ended, so that each next host or batch is drained without waiting.'
