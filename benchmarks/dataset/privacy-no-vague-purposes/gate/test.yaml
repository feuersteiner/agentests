version: 1
id: privacy-no-vague-purposes
title: Privacy notices name concrete purposes
description: Privacy notices say which data is used for what, with no vague purpose and no hedged statement of what is done with personal data.
select:
  glob: ['**/*privacy*.md', '**/*cookie*.md', 'privacy/**/*notice*.md']
assert:
  - id: purposes-concrete
    description: Every purpose names the data and the specific use, so a reader knows which data is used for what.
    error: Say which data is used for what. Replace each vague purpose, such as "to improve our services", "for research purposes" or "to personalise your experience", with the data and the specific thing done with it, one use at a time.
    decide: 'Every statement in this text of why personal data is collected or used names the data, or the kind of data, and a specific thing that is done with it, so that a reader can tell which data is used for what, as in "We use your postcode to show the delivery slots in your area". The text does not meet this if any purpose of using personal data is given only in vague, general words that do not say what is actually done, such as "to improve our services", "to provide the service", "to develop new services or features", "for research purposes", "to personalise your experience", "to enhance your experience", "for analytics" or "for security purposes", or if one sentence or list gives the uses of all the data at once, so that a reader cannot tell which data serves which use. A heading or a table label such as "Analytics" is fine when the text with it says what is done, and so is a sentence saying what data is not used for. A text that never says what personal data is used for meets this condition.'
  - id: no-hedged-processing
    description: No statement of what is done with personal data is hedged with "may", "might", "some", "possible" or a similar qualifier.
    error: State what is done with personal data as a fact. Remove "may", "might", "some", "certain", "possible" and similar qualifiers from statements of what is collected, used, shared or kept, and say exactly what happens and when.
    grep: '\b([Mm]ay|MAY|[Mm]ight|MIGHT|[Cc]ould|COULD|[Ss]ome|SOME|[Ss]ometimes|[Cc]ertain|CERTAIN|[Pp]ossibl[ey]|POSSIBL[EY]|[Oo]ften|OFTEN|[Oo]ccasional(ly)?|[Pp]otential(ly)?|[Pp]erhaps|[Vv]arious|[Ff]rom time to time|[Ll]ikely)\b'
    decide:
      - 'Every statement in this text of what the company, its service or the companies it works with collect, record, use, share, sell or keep of personal data is stated as a definite fact. The text does not meet this if any such statement is softened with a qualifier such as "may", "might", "could", "some", "certain", "possible", "possibly", "often", "sometimes", "occasionally", "from time to time" or "potentially", as in "we may use your data to", "we might share some information with partners", "we may collect certain information" or "possible uses include". These do not count and meet the condition: such a word about what the reader can do or choose ("you may opt out at any time"); such a word about the notice or policy itself, such as when it is updated or changed, which is not the handling of personal data; such a word about something other than the handling of personal data (such as the date "May 2026", or "some" about features or pages); and a condition that says exactly when something happens ("if you turn on notifications, we send them"). A text that never says what is done with personal data meets this condition.'
      - 'Each hedging word in this text, such as "may", "might", "could", "some", "certain", "possible", "often", "sometimes" or "from time to time", is in a sentence about what the reader can do or in a sentence about this notice or policy itself, such as when it is updated or changed. No hedging word is in a sentence about what the company collects, uses, shares or keeps of personal data.'
