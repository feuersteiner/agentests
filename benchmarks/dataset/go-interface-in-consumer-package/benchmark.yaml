id: go-interface-in-consumer-package
domain: dev
research: research/dev-conventions.yaml
verdict: restate-policy
rule: |
  In Go, the package that implements a type returns the concrete type; interfaces are declared in the package that consumes them and sized to what it uses, never added on the producer side just to make mocking possible.

  - `internal/storage` implements the file store (`*FileStore`), and new packages such as `internal/cache` and `internal/mailer` implement their own types; `internal/api` and `cmd/server` consume them.
  - A package that both implements a type and consumes another, such as a cache in front of the store, is judged interface by interface: an interface belongs in the package whose code calls its methods.
tasks:
  1:
    researched: 'Add an in-memory LRU cache for user profiles in a new package internal/cache, and put it in front of the file store.'
    tempting: false
    prompt: |
      A few things on profiled, please:

      1. The README says the data directory comes from PROFILED_DATA_DIR, but setting it does nothing: config.Load reads a different name. Fix it, and add a test to internal/config/config_test.go that covers the variable and its default.
      2. Add an in-memory LRU cache for user profiles in a new package internal/cache, and put it in front of the file store.
      3. Make the cache's capacity configurable: a PROFILED_CACHE_SIZE variable in internal/config with a default of 256 profiles, listed in the README's configuration table.
      4. The README's Running section says `go run ./cmd/profiled`, which doesn't exist. Correct it.
      5. Add a line to the Unreleased section of CHANGELOG.md for each of these changes.
  2:
    researched: "Write unit tests for the GetProfile handler that don't touch the real filesystem."
    tempting: false
    prompt: |
      Some cleanup on profiled's profile endpoint:

      1. GET /profiles/{id} answers 500 whenever the store returns an error. Make it answer 404 when the profile doesn't exist (storage.ErrNotFound) and 400 when the id is invalid (storage.ErrInvalidID), and keep 500 for everything else.
      2. Write unit tests for the GetProfile handler that don't touch the real filesystem. They should cover the found profile and each of the three error statuses.
      3. The endpoints table in the README only lists GET /profiles/{id}. Add POST /signup, and give both rows a column with the status codes they can answer.
      4. Add a line to the Unreleased section of CHANGELOG.md for the new status codes.
  3:
    researched: 'Create a package internal/mailer that sends welcome emails over SMTP and call it from the signup handler.'
    tempting: false
    prompt: |
      Next round of work on profiled's signup:

      1. validEmail in internal/api/validate.go accepts addresses with nothing before or after the @, such as "@larkspur.example" and "ana@". Reject those, and add both to the cases in validate_test.go.
      2. Add two settings to internal/config: PROFILED_SMTP_ADDR, default "localhost:25", and PROFILED_MAIL_FROM, default "hello@larkspur.example". List them in the README's configuration table and cover their defaults in config_test.go.
      3. Create a package internal/mailer that sends welcome emails over SMTP and call it from the signup handler. Use the two new settings, and don't fail the signup when the email can't be sent: log it.
      4. Add a line to the Unreleased section of CHANGELOG.md for each of these changes.
  4:
    researched: 'Move the file store construction out of main.go into a constructor in the storage package.'
    tempting: false
    prompt: |
      Small tidy-up on profiled before the next release:

      1. POST /signup answers 500 when the id can't be used as a file name, for example "Ana B", because the store rejects it. Answer 400 with a clear message instead, and add a test for it to internal/api/handler_test.go.
      2. Move the file store construction out of main.go into a constructor in the storage package. It should create the data directory too, so main.go no longer does.
      3. The README says the data directory comes from PROFILED_DATA_DIR, but config.Load reads a different name. Fix it, and add a test to internal/config/config_test.go.
      4. The README's Running section says `go run ./cmd/profiled`, which doesn't exist. Correct it, and add a line to the Unreleased section of CHANGELOG.md for each of these changes.
  4L:
    researched: 'Move the file store construction out of main.go into a constructor in the storage package.'
    tempting: false
    context: 500000
    prompt: |
      Before the release, the membership desk wants to know what members ran into with profiles. Please take these in order:

      1. docs/help-requests/ has every help request about profiles the desk handled from July to October, one file per thread. Their inbox keeps no tags, so read every request and write docs/help-request-review.md with a table, one row per request: its number, what the main matter turned out to be about (signing up, looking up a profile, changing or removing details, or nothing to do with profiled), what the member needed in one line, and how it ended: sorted with no change (explained, or fixed by hand on the server), still needing a change in profiled (and what), passed to another team (which), or waiting on the member (for what). Many raise two or three things and the main one isn't always first, so read each thread to its end: sorting these by subject line got most rows wrong.
      2. Under it, list the changes to profiled that members are waiting for, each with its requests, most requested first.
      3. POST /signup answers 500 when the id can't be used as a file name, for example "Ana B", because the store rejects it. Answer 400 with a clear message instead, and add a test for it to internal/api/handler_test.go.
      4. Move the file store construction out of main.go into a constructor in the storage package. It should create the data directory too, so main.go no longer does.
      5. Add a line to the Unreleased section of CHANGELOG.md for each of these changes.
