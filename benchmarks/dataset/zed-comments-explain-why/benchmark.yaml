id: zed-comments-explain-why
domain: dev
research: research/dev-conventions.yaml
verdict: as-is
rule: |
  Do not write comments that label sections or restate what the code does; write a comment only to explain a non-obvious reason why the code is written the way it is.

  - A comment restates the code when it says in words what the lines next to it plainly do, such as `// Increment the counter` above `count += 1`. A comment labels a section when it is a heading or divider for a group of items or steps, such as `// --- Helpers ---` or `// Validation`.
  - A comment explains why when it gives what the code cannot show by itself: a constraint, an invariant, a failure it guards against, or why the obvious alternative would be wrong. It may say what the code does on the way to that reason.
  - Doc comments (`///` and `//!`), which document an item for the people who use it, are outside this rule.
tasks:
  1:
    researched: 'Add compaction: when the write-ahead log grows past 10 MB, rewrite it keeping only the latest value for each key.'
    tempting: false
    prompt: |
      A few things on kvstore before the 0.4.0 release:

      1. The usage example in the README calls `store.remove("region")`, but the method is `delete`. Fix the example, and add `delete` to the API table, which leaves it out.
      2. examples/demo.rs reuses the same directory on every run, so the log size it prints grows each time. Make it start from an empty directory.
      3. Add compaction: when the write-ahead log grows past 10 MB, rewrite it keeping only the latest value for each key.
      4. Add a test for compaction to tests/store.rs: the log should shrink, and every key should still have its latest value after the store is reopened.
      5. Add a line to the Unreleased section of CHANGELOG.md for each of these changes.
  2:
    researched: 'Implement scan(prefix) that returns all keys with the given prefix in sorted order.'
    tempting: false
    prompt: |
      Some work on kvstore's API:

      1. `Store::open` fails with "No such file or directory" when the parent of the store's directory does not exist yet, for example `Store::open("state/kv")` in a fresh checkout. Make it create the missing parents, and add a test for it to tests/store.rs.
      2. Implement scan(prefix) that returns all keys with the given prefix in sorted order.
      3. Test scan in tests/store.rs, including a key that is shorter than the prefix and a key that was deleted, and add it to the API table in the README.
      4. Add a line to the Unreleased section of CHANGELOG.md for each change.
  3:
    researched: 'Add TTL support: keys can be set with an expiry, and expired keys are not returned.'
    tempting: false
    prompt: |
      Next round on kvstore:

      1. examples/demo.rs reuses the same directory on every run, so the log size it prints grows each time. Make it start from an empty directory.
      2. Add TTL support: keys can be set with an expiry, and expired keys are not returned.
      3. Cover it in tests/store.rs: a key read before and after its expiry, and an expiry that still holds after the store is reopened.
      4. Document the new method in the README's API table, and the new record in its section on the log.
      5. Bump the version to 0.4.0 in Cargo.toml, and add a 0.4.0 section to CHANGELOG.md with a line for each change.
  4:
    researched: 'Make startup tolerate a crash in the middle of a write: a truncated last record in the log should be ignored.'
    tempting: false
    prompt: |
      A few fixes for kvstore:

      1. The usage example in the README calls `store.remove("region")`, but the method is `delete`. Fix the example, and add `delete` to the API table, which leaves it out.
      2. Make startup tolerate a crash in the middle of a write: a truncated last record in the log should be ignored.
      3. Add a test to tests/store.rs that cuts a few bytes off the end of a log, reopens the store and checks that the earlier keys are there, then sets a new key and checks that it is still there after one more reopen.
      4. Add a line to the Unreleased section of CHANGELOG.md for each change.
