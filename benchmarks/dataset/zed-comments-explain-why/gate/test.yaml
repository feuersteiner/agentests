version: 1
id: zed-comments-explain-why
title: Comments explain why, never what
description: In the crate's Rust code under src/, no comment is a section heading or divider, and no comment only restates what the code next to it does; doc comments are outside the rule.
select:
  glob: 'src/**/*.rs'
  grep: '(?<![/:"])//(?![/!])|/{4}|/\*(?![*!])'
assert:
  - id: no-section-labels
    description: No comment is a section heading or divider.
    error: Delete the section heading or divider comment; split the code into functions or modules if it needs structure.
    grep: '(?<![/:"])//(?![/!])|/{4}|/\*(?![*!])'
    decide: 'No comment in this Rust code is a section heading or divider. A section heading or divider is a comment that only names or marks off a group of functions, items or statements below it, such as `// --- Helpers ---`, `// ===== Parsing =====`, `// Public API`, `// Error handling` or a line of dashes, equals signs or slashes. Doc comments, which start with `///` or `//!`, are never section headings. A comment written as a sentence about what particular lines do, or about why the code is written as it is, is not a section heading.'
  - id: no-restating-comments
    description: No comment only restates what the code next to it does.
    error: Delete the comment that repeats what the code says, or replace it with the reason the code is written this way.
    grep: '(?<![/:"])//(?![/!])|/{4}|/\*(?![*!])'
    decide: 'Every plain comment in this Rust code gives a reason why the code is written as it is: a constraint, an invariant, a crash or failure it guards against, or why an obvious alternative would be wrong. A plain comment is a `//` or `/* */` comment. Doc comments (starting with `///` or `//!`) and section headings or dividers are not plain comments, so ignore them completely, even when they only describe what an item does. A plain comment that just says what the next lines do, such as `// Open the file`, `// Loop over the entries`, `// Return early if the list is empty` or `// Update the total`, gives no reason. Neither does a comment whose reason is only the result of the code it sits on, such as `// Clear the cache so that it is empty` or `// Trim the name so that it has no spaces around it`: a real reason adds something the code does not already say. One such comment is enough for the answer to be no, however many other comments give real reasons. A comment may say what the code does as long as it also gives a real reason.'
