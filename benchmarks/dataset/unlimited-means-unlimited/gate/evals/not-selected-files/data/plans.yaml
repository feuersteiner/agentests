# Cloudcrate plans. Prices are in US dollars, billed monthly.
plans:
  - id: personal
    name: Personal
    price_per_user_month: 8
    min_users: 1
    max_users: 1
    storage: 200 GB
    over_storage: uploads are refused until the user frees space or upgrades
    max_file_size: 5 GB
    version_history_days: 30
    guest_links: 10
    sso: false
    audit_log: false

  - id: team
    name: Team
    price_per_user_month: 12
    min_users: 3
    max_users: 50
    storage: 1 TB per user
    over_storage: uploads are refused until the team frees space or adds users
    max_file_size: 50 GB
    version_history_days: 90
    guest_links: 100
    sso: false
    audit_log: false

  - id: business
    name: Business
    price_per_user_month: 20
    min_users: 5
    max_users: null
    storage: unlimited
    storage_fair_use: 2 TB per user
    over_storage: uploads are throttled to 1 Mbps above the fair-use cap
    max_file_size: 250 GB
    version_history_days: 365
    guest_links: unlimited
    sso: true
    audit_log: true
