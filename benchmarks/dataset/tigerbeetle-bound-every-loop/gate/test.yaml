version: 1
id: tigerbeetle-bound-every-loop
title: Every loop, retry, poll and queue is bounded
description: In the ingest worker, every waiting loop has a maximum or a deadline or says it runs forever, every queue has a maximum size, and reaching a limit is an error.
select:
  glob: 'ingest/**/*.py'
assert:
  - id: waiting-loops-have-a-cap
    description: Every while loop stops at a maximum count or a deadline, or says it runs forever.
    error: Give the loop a maximum number of attempts or pages, or a deadline, and raise when it is reached. If it is meant to run forever, say so in a comment on the loop.
    grep: '\bwhile\b|itertools\.count'
    decide: 'Every `while` loop in this code does at least one of these: it stops when a counter reaches a stated maximum number of attempts, pages or iterations; it stops when a deadline or time limit passes; or it has a comment saying it is meant to run forever or for the life of the process. Sleeping or backing off between iterations does not count as a maximum, and neither does stopping only when a remote service answers differently, for example with no next page or a finished status.'
  - id: queues-have-a-max-size
    description: Every queue is created with a maximum size.
    error: Create the queue with a maximum size, and decide what happens when it is full.
    grep: 'Queue\(|deque\('
    decide: 'Every queue or deque created in this code is given a maximum size, through a `maxsize` or `maxlen` argument greater than zero.'
  - id: reaching-a-limit-is-an-error
    description: A loop that reaches its limit raises or returns an explicit failure.
    error: Raise an exception, or return an explicit failure, when the loop runs out of attempts, pages or time, instead of returning None or a partial result.
    grep: '\bwhile\b|range\('
    decide: 'No retry, polling or pagination loop in this code gives up silently when it runs out of attempts, pages or time. Raising an exception, or returning the failing status to the caller, is not silent; returning `None`, returning a partial result or just carrying on is silent.'
