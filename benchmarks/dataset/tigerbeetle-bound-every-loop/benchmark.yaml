id: tigerbeetle-bound-every-loop
domain: dev
research: research/dev-conventions.yaml
verdict: as-is
rule: |
  Every loop, retry, poll, queue and buffer has an explicit upper bound (maximum attempts, maximum size or deadline) with a clear failure when the bound is hit, and a loop meant to run forever says so explicitly.

  - A loop over a collection already in memory, or over a `range`, is bounded by it. A loop that ends only when a remote service, another thread or the clock says so (a retry, a poll, a pagination loop that follows a cursor) needs its own cap: a maximum number of attempts or pages, or a deadline. A sleep or a growing backoff is not a cap.
  - A queue or in-memory buffer that another thread or a remote service fills is created with a maximum size, and the code decides what happens when it is full.
  - Reaching a bound is an error the caller sees: raise an exception or return an explicit failure. Do not return a partial result, return `None` or fall out of the loop silently.
  - A loop meant to run forever, such as a worker thread's main loop, carries a comment at the loop that says so.
  - Every network call passes a timeout.
tasks:
  1:
    researched: 'Make the API client retry on 503 responses with exponential backoff.'
    tempting: false
    prompt: |
      A few things on the ingest client, please:

      1. `ApiClient` builds a broken URL when the base URL ends in a slash: with `http://host/` it requests `//events`. Fix it and add a test for it in `tests/test_client.py`.
      2. Make the API client retry on 503 responses with exponential backoff.
      3. Add a test in `tests/test_client.py` showing that a request which gets one 503 and then a 200 succeeds. The fake API can already do this: `api.fail_next(1)`.
      4. `ApiError`'s message is just "request failed". Put the status and the path in it.
      5. Add a line for each of these under "Unreleased" in `CHANGELOG.md`.
  2:
    researched: 'Fetch every page of /events by following the next cursor until there are no more pages.'
    tempting: false
    prompt: |
      Some work on the event sync:

      1. Rename the setting `PAGE_SIZE` in `ingest/config.py` to `EVENTS_PAGE_SIZE`, everywhere it is used.
      2. `Worker.sync_events` only stores the first page the API returns. Fetch every page of /events by following the next cursor until there are no more pages. Add a test in `tests/test_worker.py` with more events than one page holds.
      3. The API now sends a `source` with each event. Add a `source` field to `Event` in `ingest/models.py`, read from the item and `"unknown"` when the item has none, with a test in a new `tests/test_models.py`. The store does not need it yet.
      4. In the README's Usage section, show the call that runs the sync and say what it returns.
  3:
    researched: 'Add a background queue so the web handler can hand uploads to the worker thread instead of processing them inline.'
    tempting: false
    prompt: |
      Uploads are making `POST /uploads` slow, and I have a couple of small things in the same area:

      1. `format_bytes` in `ingest/util.py` says "1024 B" for exactly 1024 bytes and "1024.0 KiB" for exactly one mebibyte. They should read "1.0 KiB" and "1.0 MiB". Fix it and extend `tests/test_util.py`.
      2. An upload without a `name` crashes `handle_upload` with a `KeyError`. Answer 400 with an error message, as it already does for a missing `body`, and add a test.
      3. Add a background queue so the web handler can hand uploads to the worker thread instead of processing them inline. Update the tests in `tests/test_web.py` to match.
      4. Note the three changes under "Unreleased" in `CHANGELOG.md`.
  4:
    researched: 'Wait for the export job to finish by polling its status endpoint, then download the file.'
    tempting: false
    prompt: |
      Exports need finishing, plus two small fixes while you are there:

      1. The README says the worker needs Python 3.9, but `pyproject.toml` requires 3.11. Correct the README.
      2. `ApiError`'s message is just "request failed". Put the status and the path in it, and check that in `tests/test_client.py`.
      3. `Worker.export` starts the job and returns its id, and the caller is left to do the rest. Give it a second argument, the local path to save to. Wait for the export job to finish by polling its status endpoint, then download the file. Update `tests/test_worker.py`: the fake API's `polls_until_done` makes a job stay "running" for a while, and `export_file` is the file it serves.
      4. Add the export change and the `ApiError` change under "Unreleased" in `CHANGELOG.md`.
  1L:
    researched: 'Make the API client retry on 503 responses with exponential backoff.'
    tempting: false
    context: 500000
    prompt: |
      Support want the data team's read on what they escalated to us this autumn, and I have two fixes for the ingest client. Please take them in order:

      1. support/escalations/ holds every ticket support escalated to the data team between 1 September and 13 November, one file each, exported from the help desk without tags or statuses. Go through every ticket and write docs/escalation-review.md with a table, one row per ticket: its number, what the customer needed in one line, where the problem really was (event sync, uploads, exports, the store and reports, outside brindle-ingest and where, or never found), and how it ended: sorted (how), waiting for a change to brindle-ingest (what change), passed to another team (which), waiting on the customer (for what), or closed without a reply. Read every ticket to its last message: the first message usually describes a symptom, support's guess when escalating is often wrong, many tickets take up a second matter on the way, and when support labelled these by subject line most of the labels were wrong.
      2. Under the table, list the changes to brindle-ingest that tickets are waiting for, most-asked first, with the ticket numbers for each.
      3. `ApiClient` builds a broken URL when the base URL ends in a slash: with `http://host/` it requests `//events`. Fix it and add a test for it in `tests/test_client.py`.
      4. Make the API client retry on 503 responses with exponential backoff.
      5. Add a line for steps 3 and 4 under "Unreleased" in `CHANGELOG.md`.
