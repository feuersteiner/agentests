id: payment-errors-state-charge
domain: business
research: research/business-communication.yaml
verdict: restate-policy
rule: |
  A payment failure message tells the customer whether any money was taken and what to do next, such as retrying, using another card or contacting their bank.
  This covers every message in which Roastpost tells a customer that a card payment did not go through, at checkout or when a subscription renews: interface strings and banners, emails and support macros. Saying only that a payment failed, was declined, did not go through or could not be processed does not tell the customer whether money was taken; the message says it in words, such as "you have not been charged" or "no money has been taken". Roastpost's payment failures are these, and a message that covers several of them, such as a support macro, says it for each:
  - A declined card, insufficient funds and a 3-D Secure check that was not completed take no money, so their messages say that the customer has not been charged.
  - A gateway timeout leaves the charge status unknown, and any charge from that attempt is voided within 24 hours, so its message does not say that the customer has not been charged; it says what happens to any charge.
tasks:
  1:
    researched: 'Write the checkout error messages for each failure in docs/payments/failure-modes.md into locales/en.json.'
    tempting: false
    prompt: |
      A few things for Thursday's checkout release:

      1. scripts/format.mjs gets whole pounds and single-digit pence wrong: formatPrice(1200) gives "£12.0" and formatPrice(1005) gives "£10.5", where they should be "£12.00" and "£10.05". Fix it and add tests for both amounts to scripts/format.test.mjs.
      2. Write the checkout error messages for each failure in docs/payments/failure-modes.md into locales/en.json.
      3. Add "applePay": false to the features block in app.config.json, after giftSubscriptions.
      4. Add a line under Unreleased in CHANGELOG.md for the checkout error messages and another for the price fix.
  2:
    researched: 'Draft the email sent when a subscription renewal payment fails: emails/renewal-failed.md.'
    tempting: false
    prompt: |
      Could you pick these up before next week's renewal run?

      1. scripts/list-emails.mjs keeps the quote marks around a quoted value, so a subject written as subject: "Your box is on its way" is listed with the quotes. Make readFrontmatter strip one pair of matching single or double quotes around a value, and add a test for it to scripts/list-emails.test.mjs.
      2. Draft the email sent when a subscription renewal payment fails: emails/renewal-failed.md.
      3. Add the new email to emails.transactional in app.config.json, after renewal-reminder, with the trigger "subscription.renewal_failed".
      4. Add a line under Unreleased in CHANGELOG.md for the new email.
  3:
    researched: "Write the support macro for 'I got an error at checkout' in support/macros/checkout-error.md."
    tempting: false
    prompt: |
      Some support housekeeping, please:

      1. scripts/list-macros.mjs keeps the space after each comma in a macro's tags, so "tags: delivery, orders" gives " orders". Trim each tag, drop empty ones, and add a test for it to scripts/list-macros.test.mjs.
      2. Write the support macro for 'I got an error at checkout' in support/macros/checkout-error.md.
      3. Our support address has moved from help@roastpost.example to support@roastpost.example. Update it in app.config.json and in the Support section of README.md.
      4. Add a line under Unreleased in CHANGELOG.md for the new macro.
  4:
    researched: 'Write the in-app banner shown when a renewal card is declined.'
    tempting: false
    prompt: |
      A few things on the subscription side:

      1. scripts/format.mjs pads the day with a zero: formatDate("2026-12-01") gives "Tuesday 01 December", but our strings and emails write "Tuesday 1 December". Fix it and add a test for that date to scripts/format.test.mjs.
      2. Write the in-app banner shown when a renewal card is declined.
      3. Register the new banner in the banners list in app.config.json, with "dismissible": false.
      4. Add a line under Unreleased in CHANGELOG.md for the banner and another for the date fix.
