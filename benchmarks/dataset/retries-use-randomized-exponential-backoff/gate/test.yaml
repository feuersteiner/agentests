version: 1
id: retries-use-randomized-exponential-backoff
title: Retries use randomized exponential backoff
description: In the service code under app/, every retry or reconnect waits with a capped exponential delay plus random jitter, and gives up after a maximum number of attempts or a deadline.
select:
  glob: 'app/**/*.py'
assert:
  - id: delay-grows-exponentially-to-a-cap
    description: The delay between attempts grows exponentially and is capped.
    error: Wait min(MAX_DELAY, BASE * 2 ** attempt) before each new attempt, so the delay doubles after every failure up to an explicit maximum.
    grep: '\bsleep\(|\.wait\(|[Rr]etr(y|ies|ied|ying)|RETR(Y|IES)|[Bb]ackoff|BACKOFF|[Rr]econnect|RECONNECT|[Aa]ttempt|ATTEMPT'
    decide: 'A retry is code that catches a failure (an exception, an error status such as 503, or a lost connection) and then tries the same operation or connection again. Every retry in this code waits before trying again, and the length of that wait comes from a delay that is multiplied by a constant factor after each failed try, for example `base * 2 ** attempt`, and is held under an explicit maximum, for example with `min(MAX_DELAY, ...)`. A random wait drawn within that delay is fine. A constant delay, a delay that grows by adding a fixed step, no wait at all, or a growing delay with no explicit maximum fails; a limit on the number of tries is not a maximum delay. Code with no retry passes: for example settings only, loops that only take queue messages or poll for a status, or a call to a function defined in another file that does the retrying.'
  - id: delay-is-randomized
    description: Each wait between attempts is randomized.
    error: Randomize each wait, for example time.sleep(random.uniform(0, delay)), so workers that failed together do not retry together.
    grep: '\bsleep\(|\.wait\(|[Rr]etr(y|ies|ied|ying)|RETR(Y|IES)|[Bb]ackoff|BACKOFF|[Rr]econnect|RECONNECT|[Aa]ttempt|ATTEMPT'
    decide: 'A retry is code that catches a failure (an exception, an error status such as 503, or a lost connection) and then tries the same operation or connection again. Every retry in this code waits a randomized time before trying again: part or all of each wait comes from a random number, for example from `random.uniform` or `random.random`, drawn anew for each wait. A wait computed without any random number fails, however it grows, and so does trying again with no wait. Code with no retry passes: for example settings only, loops that only take queue messages or poll for a status, or a call to a function defined in another file that does the retrying.'
  - id: retries-stop-at-a-limit
    description: Retries stop after a maximum number of attempts or a deadline.
    error: Stop trying after a maximum number of attempts or once a deadline has passed, then raise or return the failure.
    grep: '\bsleep\(|\.wait\(|[Rr]etr(y|ies|ied|ying)|RETR(Y|IES)|[Bb]ackoff|BACKOFF|[Rr]econnect|RECONNECT|[Aa]ttempt|ATTEMPT'
    decide: 'A retry is code that catches a failure (an exception, an error status such as 503, or a lost connection) and then tries the same operation or connection again. Every retry in this code stops trying at a limit that the code itself checks: a count of tries compared with a maximum, for example a loop over `range(MAX_ATTEMPTS)` or a failure counter checked against a maximum, or the clock compared with a deadline on the time spent trying. A count that starts again after a successful try is fine. A retry with no such check fails, for example a loop that ends only when the operation succeeds, or a counter that only makes the delay grow and is never compared with a maximum. Code with no retry passes: for example settings only, loops that only take queue messages or poll for a status, or a call to a function defined in another file that does the retrying.'
