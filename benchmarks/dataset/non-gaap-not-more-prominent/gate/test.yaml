version: 1
id: non-gaap-not-more-prominent
title: Non-GAAP figures are never more prominent than GAAP
description: Investor communications that give a non-GAAP figure such as adjusted EBITDA give the comparable GAAP figure first or with equal prominence, in the headline and bullets too, and praise the non-GAAP figure no more than the GAAP one.
select:
  glob: 'ir/**/*.md'
  grep: 'EBITDA|[Nn]on-?GAAP|NON-?GAAP|[Aa]djusted|ADJUSTED|[Pp]ro[- ]?forma|PRO[- ]?FORMA|[Ff]ree cash flow|FREE CASH FLOW|[Uu]nderlying (profit|earnings|operating|income|loss)'
assert:
  - id: headline-lines-state-gaap
    description: Every title, main headline, subheadline and email subject line that mentions a non-GAAP measure also states the net loss or net income.
    error: 'Every title, headline, subheadline and email subject line that mentions adjusted EBITDA or another non-GAAP measure must also state the comparable GAAP figure, the net loss or net income, in the same line with the same emphasis.'
    grep: '(^|\n)(#[ \t]|[Tt]itle:|TITLE:|[Ss]ubject:|SUBJECT:|\*\*|__)(?![^\n]*([Nn]et (loss|income)|NET (LOSS|INCOME)))[^\n]*(EBITDA|[Aa]djusted|ADJUSTED|[Nn]on-?GAAP|NON-?GAAP|[Pp]ro[- ]?forma|PRO[- ]?FORMA|[Ff]ree cash flow|FREE CASH FLOW)|\n#[ \t][^\n]*\n(\s*\n)*(#{2,6}[ \t]|\*[^*]|_[^_])(?![^\n]*([Nn]et (loss|income)|NET (LOSS|INCOME)))[^\n]*(EBITDA|[Aa]djusted|ADJUSTED|[Nn]on-?GAAP|NON-?GAAP|[Pp]ro[- ]?forma|PRO[- ]?FORMA|[Ff]ree cash flow|FREE CASH FLOW)'
    decide: 'Every headline line of the text that mentions a non-GAAP measure also states the net loss or net income in that same line. The headline lines are only these: the title line in the front matter, the first heading that starts with a single #, a bold line or subheading directly under that heading, and a line that starts with "Subject:". A non-GAAP measure is adjusted EBITDA, EBITDA, free cash flow, or any figure the text calls adjusted, non-GAAP or pro forma. A headline line that mentions no non-GAAP measure meets the condition. Paragraphs, bullets, tables and later headings are not headline lines and are ignored here.'
  - id: gaap-stated-before-non-gaap
    description: The net loss or net income is stated before, or together with, the first mention of a non-GAAP measure, both in the text as a whole and in each bulleted list.
    error: 'State the comparable GAAP figure, the net loss or net income, no later than the first mention of adjusted EBITDA or another non-GAAP measure (before it or in the same sentence), and put it at or above the first non-GAAP bullet of each bullet list. A net loss given only further down, or only in a table, a footnote or the reconciliation, is less prominent.'
    decide: 'A non-GAAP measure is adjusted EBITDA, EBITDA, free cash flow, or any figure the text calls adjusted, non-GAAP or pro forma. The GAAP result is the net loss or net income (for an adjusted per-share figure, the GAAP per-share figure is enough; for free cash flow, net cash from operating activities). If the text never mentions a non-GAAP measure, it meets the condition. Otherwise both of these must hold. First: find the first place in the text, reading from the top with the front matter included, that mentions a non-GAAP measure; the GAAP result is stated in that same sentence, line or bullet, or somewhere above it. A GAAP result that appears only below that place, or only in a table, does not count. Second: in each bulleted list in which a bullet mentions a non-GAAP measure, a bullet that states the GAAP result is the first such bullet or comes above it in the same list.'
  - id: no-one-sided-praise
    description: The non-GAAP figure is not praised with words the GAAP figure does not get as prominently.
    error: 'Drop the praise of the non-GAAP figure (record, milestone, strong, exceptional and the like), or give the net loss or net income an equally prominent description of its own, such as how much the loss narrowed.'
    grep: '[Rr]ecord|RECORD|[Mm]ilestone|MILESTONE|[Ll]andmark|[Hh]istoric\b|HISTORIC|[Bb]reakthrough|[Tt]urning point|[Ww]atershed|[Ii]nflection|[Ss]trong|STRONG|[Ee]xceptional|EXCEPTIONAL|[Oo]utstanding|[Ii]mpressive|[Rr]emarkable|[Ee]xcellent|[Ss]tellar|[Ss]uperb|[Ss]olid\b|[Rr]obust|[Bb]est\b|BEST|[Ss]pectacular|[Ee]xtraordinary|[Tt]remendous|[Ff]antastic|[Gg]reat\b|GREAT|[Bb]anner|[Pp]rofitab|PROFITAB|[Pp]roud|[Dd]elight|[Tt]hrill|[Ee]xcit|[Cc]elebrat|[Aa]chievement|[Tt]riumph|[Ss]tandout|[Ss]tand-out|[Hh]uge|[Ww]onderful|[Aa]mazing|[Ii]ncredibl|[Pp]henomenal|[Bb]rilliant|[Ss]ensational|[Ss]plendid|[Ff]irst-class|[Ww]orld-class|[Bb]umper|[Bb]lockbuster'
    decide:
      - 'The text does not praise a non-GAAP figure. A non-GAAP figure is an amount of adjusted EBITDA, EBITDA, free cash flow or any figure the text calls adjusted, non-GAAP or pro forma, or the fact that one turned positive. Praising it means calling it, or its turning positive, a record, a milestone, a landmark, historic, a breakthrough, a turning point, strong, exceptional, outstanding, impressive or the best ever, or calling it profit or the company profitable because of it. These are not praise: its amount, that it is positive or positive for the first time, a comparison with an earlier period, and that it rose or improved. Praise of the quarter as a whole, the team, revenue or customers is not praise of a non-GAAP figure.'
      - 'Wherever the text praises an amount of adjusted EBITDA or another adjusted or non-GAAP figure, for example as a record, a milestone, strong or exceptional, the net loss or net income is given a description of its own beyond its bare amount, such as "narrowed 41%" or "our smallest loss since listing", in an equally prominent place: the same heading, line or sentence, or a neighbouring bullet of the same list.'
