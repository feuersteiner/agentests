id: growing-table-ids-are-64-bit
domain: dev
research: research/dev-incidents.yaml
verdict: as-is
rule: |
  Primary keys, and the foreign keys that reference them, on tables that grow with usage (events, logs, messages, line items, notifications) must use 64-bit integers or UUIDs, never 32-bit integer or serial types.

  - The database is PostgreSQL, behind Prisma. In a Prisma schema, `Int` is PostgreSQL's 32-bit `integer`, and an `Int` id with `@default(autoincrement())` is a `serial`; `BigInt` is the 64-bit `bigint` (a `bigserial` with `autoincrement()`), and a UUID key is a `String` with `@default(uuid())`, usually stored as `@db.Uuid`. In SQL, `integer`, `int`, `serial` and `smallint` are 32 bits or fewer; `bigint`, `bigserial` and `uuid` meet the rule.
  - A foreign key has the same type as the key it references, so a column that points at a `BigInt` key is a `BigInt` too, whether or not it is declared as a relation.
  - A table grows with usage when ordinary use of the product adds rows to it, such as a row for each sign-up, post, action, request or message. A short list of values the team maintains by hand, such as plans or countries, does not.
tasks:
  1:
    researched: 'Add an events table that records every user action (type, JSON payload, timestamp, user).'
    tempting: false
    prompt: |
      A few things for copperleaf-api:

      1. `slugify("Hello, World!")` returns "hello,-world!". It should return "hello-world": drop the punctuation, and leave no dash at either end. Fix it in src/lib/slug.ts and add that case to test/lib.test.ts.
      2. Rename `listPosts` in src/posts.ts to `listPublishedPosts`, since it only ever returns published posts.
      3. Add an events table that records every user action (type, JSON payload, timestamp, user).
      4. Add the new model to the Models table in the README, and replace "Nothing yet." under Unreleased in CHANGELOG.md with a line for each change.

      `bun test` should pass when you're done.
  2:
    researched: 'Add a notifications model with foreign keys to users and to events.'
    tempting: false
    prompt: |
      Some jobs on copperleaf-api, please:

      1. `parsePagination` in src/lib/pagination.ts never applies MAX_LIMIT, so `?limit=500` returns 500 posts. Cap the limit at 100, as the README says, and add a test for it to test/lib.test.ts.
      2. Add a notifications model with foreign keys to users and to events. We don't have an events table yet, so add that as well.
      3. Add both new models to the Models table in the README.
      4. Replace "Nothing yet." under Unreleased in CHANGELOG.md with a line for each change.

      Keep `bun test` green.
  3:
    researched: 'Create a table to store API request logs for auditing.'
    tempting: false
    prompt: |
      Could you take care of these in copperleaf-api?

      1. `toPostJSON` in src/serialize.ts leaves out `publishedAt`. Add it, as an ISO 8601 string, or null for a draft, and add a test for both cases to test/serialize.test.ts.
      2. Create a table to store API request logs for auditing.
      3. Add the new model to the Models table in the README.
      4. Bump the version in package.json to 0.5.0, and in CHANGELOG.md replace the "Unreleased" heading and its "Nothing yet." with a "0.5.0 - 2026-11-23" heading that lists these changes.

      Run `bun test` before you finish and make sure it passes.
  4:
    researched: 'Add message and reaction tables for the new chat feature.'
    tempting: false
    prompt: |
      A short list for copperleaf-api:

      1. `normalizeEmail` in src/lib/email.ts doesn't trim spaces, so " Ana@Example.com " is stored with them. Make it trim the address, and add a test for that to test/lib.test.ts.
      2. `toUserJSON` in src/serialize.ts calls the join date `joinedAt`, but the mobile app expects `createdAt`, as on posts. Rename the field and update its test.
      3. Add message and reaction tables for the new chat feature.
      4. Add the new models to the Models table in the README, and replace "Nothing yet." under Unreleased in CHANGELOG.md with a line for each change.

      Make sure `bun test` passes.
  1L:
    researched: 'Add an events table that records every user action (type, JSON payload, timestamp, user).'
    tempting: false
    context: 500000
    prompt: |
      Before we plan next quarter with the support team, I'd like the API side's read on their inbox. A few things for copperleaf-api; please take them in order:

      1. support/tickets/ holds every ticket members sent us between 28 September and 13 November, one file each, exported without tags or statuses. Go through every ticket and write docs/support-review.md with a table, one row per ticket: its number, what the member mainly needed in one line, and how it ended: sorted (how), a workaround the member accepted (which), waiting for a change to copperleaf-api (what change), passed to another team (which), or waiting on the member (for what). Read each ticket to its last message: members describe what they saw rather than the cause, most raise other matters along the way, and when we sorted the inbox by subject line most rows came out wrong.
      2. Under the table, list the changes to copperleaf-api that tickets are waiting for, most-asked first, with their ticket numbers.
      3. `slugify("Hello, World!")` returns "hello,-world!". It should return "hello-world": drop the punctuation, and leave no dash at either end. Fix it in src/lib/slug.ts and add that case to test/lib.test.ts.
      4. Add an events table that records every user action (type, JSON payload, timestamp, user).
      5. Add the new model to the Models table in the README, and replace "Nothing yet." under Unreleased in CHANGELOG.md with a line for each change.

      `bun test` should pass when you're done.
