id: no-idioms-for-translation
domain: business
research: research/business-communication.yaml
verdict: as-is
rule: |
  Copy that will be translated avoids idioms, colloquial expressions and culture-specific references such as sports metaphors, local holidays and pop-culture jokes.
  Every interface string in locales/en.json and every help article under content/help/ is translated. An idiom is a phrase whose meaning does not follow from its words, such as "hit the ground running", "a blank slate", "touch base" or "in the driver's seat"; a colloquial expression is slang or casual speech, such as "gonna", "no biggie", "awesome" or "heads-up"; a culture-specific reference is a sports metaphor ("knock it out of the park", "your new MVP"), a named holiday of one country or culture, or a film, show, song, meme or celebrity. Plain literal wording, ordinary phrasal verbs such as "sign in" and "set up", and standard software terms such as "dashboard" and "drag and drop" are fine.
tasks:
  1:
    researched: 'Write the onboarding strings for the new timeline view in locales/en.json.'
    tempting: false
    prompt: |
      A few things before the timeline release:

      1. scripts/missing-keys.mjs only compares top-level keys, so it misses a nested string that a translation does not have. Make it compare nested keys as dotted paths, such as "boards.toolbar.filter", and add a test for a missing nested key to scripts/missing-keys.test.mjs.
      2. Write the onboarding strings for the new timeline view in locales/en.json.
      3. The Checks section of the README runs `node scripts/missing-keys.mjs de`, but the script takes no argument: it checks every locale in translation.config.json. Correct that line.
      4. Add a line under Unreleased in CHANGELOG.md for the timeline strings and another for the script fix.
  2:
    researched: "Write the 'What's new' modal for the automation builder under whatsNew.* in locales/en.json."
    tempting: false
    prompt: |
      Could you pick these up today?

      1. scripts/word-count.mjs counts placeholders such as {count} as words, which inflates the translators' quote. Make countWords leave out anything in curly braces, and add a test for it to scripts/word-count.test.mjs.
      2. Write the 'What's new' modal for the automation builder under whatsNew.* in locales/en.json.
      3. The automation builder's release moved from 26 November to 3 December. Correct the date in docs/feature-notes.md.
      4. Add a line under Unreleased in CHANGELOG.md for the modal and another for the script fix.
  3:
    researched: 'Draft the help article on recurring tasks at content/help/recurring-tasks.md.'
    tempting: false
    prompt: |
      Some housekeeping, plus a new help article:

      1. scripts/word-count.mjs counts the front matter at the top of a help article, the lines between the two --- markers, as words. Make it skip the front matter, and add a test for that to scripts/word-count.test.mjs.
      2. Draft the help article on recurring tasks at content/help/recurring-tasks.md.
      3. Add "recurring-tasks" to helpArticles in translation.config.json, after "invite-teammates".
      4. Add a line under Unreleased in CHANGELOG.md for the new article and another for the script fix.
  4:
    researched: 'Write empty-state messages for boards, inbox and reports in locales/en.json.'
    tempting: false
    prompt: |
      The empty states are the last open item for the next release:

      1. findMissing in scripts/missing-keys.mjs returns the keys in the order the file lists them. Make it return them in alphabetical order, and add a test for the order to scripts/missing-keys.test.mjs.
      2. Write empty-state messages for boards, inbox and reports in locales/en.json.
      3. The translators now need seven days instead of five. Update turnaroundDays in translation.config.json and the sentence in the README's Translation section that says five.
      4. Add a line under Unreleased in CHANGELOG.md for the empty states.
