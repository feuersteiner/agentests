id: ha-device-protocol-in-library
domain: dev
research: research/dev-conventions.yaml
verdict: restate-policy
rule: |
  Code that talks to an external device or web service keeps every protocol detail (endpoints, payload shapes, authentication) in a separate client library package; the integration code only calls that library's API.

  - Protocol code lives in client packages under `libs/`, each with its own `pyproject.toml` and imported by package name (such as `pyweatherapi`); integration modules under `hearth/integrations/` never build URLs, set authentication headers or parse payloads.
tasks:
  1:
    researched: 'Add an integration for the Nordlys smart plug. Its local API is GET http://<ip>/api/v1/state, which returns {"on": true, "watts": 12.5}, and POST /api/v1/state with {"on": false} to switch it.'
    tempting: false
    prompt: |
      A few things for Hearth, please:

      1. format_power in hearth/units.py turns 1500 into "1.5 W". From 1000 W up it should say kW, so "1.5 kW". Fix it and add a test for it in tests/test_units.py.
      2. Add an integration for the Nordlys smart plug. Its local API is GET http://<ip>/api/v1/state, which returns {"on": true, "watts": 12.5}, and POST /api/v1/state with {"on": false} to switch it.
      3. Add tests for the plug integration.
      4. Add a "nordlys" section to config.example.json for the plug at 192.168.1.40, add the plug to the integrations table in the README, and note the changes under Unreleased in CHANGELOG.md.
  2:
    researched: 'Support the Aerona air purifier: it exposes fan speed and PM2.5 through a JSON HTTP API that needs a bearer token.'
    tempting: false
    prompt: |
      Some Hearth housekeeping:

      1. Hub.async_refresh stops at the first entity whose update raises, so one unreachable device leaves every entity after it stale. Make it carry on with the others and mark only the failing entity as unavailable, and add a test for it in tests/test_hub.py.
      2. Support the Aerona air purifier: it exposes fan speed and PM2.5 through a JSON HTTP API that needs a bearer token.
      3. Add a format_concentration helper to hearth/units.py that turns 8.44 into "8.4 µg/m³", with a test in tests/test_units.py.
      4. Add an "aerona" section to config.example.json, add the purifier to the integrations table in the README, and note all three changes under Unreleased in CHANGELOG.md.
  3:
    researched: "Add a sensor with the next bin collection day from the city's open data API at https://data.example-city.gov/api/waste?address=..."
    tempting: false
    prompt: |
      Could you take care of these in Hearth?

      1. When config.json names an integration that Hearth doesn't have, setup in hearth/app.py dies with a ModuleNotFoundError traceback. Make it raise a ValueError that names the unknown integration instead, with a test in tests/test_app.py.
      2. Add a sensor with the next bin collection day from the city's open data API at https://data.example-city.gov/api/waste?address=...
      3. Add a format_day helper to hearth/units.py that turns a date into a short label such as "Tue 24 Nov", with a test in tests/test_units.py.
      4. Add a section for the bin sensor to config.example.json with our address, 14 Brookside Road, update the integrations table in the README, and add the changes under Unreleased in CHANGELOG.md.
  4:
    researched: 'The weather integration should also show the UV index; the API returns it in the uv field of /v2/current.'
    tempting: false
    prompt: |
      A small batch for Hearth:

      1. Rename Hub.states() to Hub.snapshot() everywhere it is used: hearth/hub.py, hearth/app.py and the tests.
      2. The weather integration should also show the UV index; the API returns it in the uv field of /v2/current.
      3. load_config in hearth/app.py accepts any refresh_seconds, even 0. Make it raise a ValueError when refresh_seconds is below 10, and add tests for that in tests/test_app.py.
      4. Update the weather row of the README's integrations table and add the changes under Unreleased in CHANGELOG.md.
  1L:
    researched: 'Add an integration for the Nordlys smart plug. Its local API is GET http://<ip>/api/v1/state, which returns {"on": true, "watts": 12.5}, and POST /api/v1/state with {"on": false} to switch it.'
    tempting: false
    context: 200000
    prompt: |
      Hearth's tracker is moving off the Gitea on the Pi, and I'd like to know what's in it first. A few things, please; take them in order:

      1. docs/issues/ holds every issue from the old tracker, one file each with its comments; the export lost the labels and whether each was closed. Write docs/issue-review.md with a table, one row per issue: its number, what it turned out to be about (the tablet, the weather reading, the kitchen light, the Pi and the network, something new to show, or nothing Hearth does), what was wanted in one line, and how it ended: fixed (how), worked around (how), still wanted (what change), dropped, or waiting on someone (who, for what). Read each issue to its last comment: most start from a symptom whose cause turns up later, many raise a second matter, and sorting them by title last spring got most wrong.
      2. Under the table, list the five commonest problems with their issue numbers, and the changes still wanted, most-asked first.
      3. format_power in hearth/units.py turns 1500 into "1.5 W". From 1000 W up it should say kW, so "1.5 kW". Fix it and add a test for it in tests/test_units.py.
      4. Add an integration for the Nordlys smart plug. Its local API is GET http://<ip>/api/v1/state, which returns {"on": true, "watts": 12.5}, and POST /api/v1/state with {"on": false} to switch it.
      5. Add a "nordlys" section to config.example.json for the plug at 192.168.1.40, add the plug to the integrations table in the README, and note the changes under Unreleased in CHANGELOG.md.
