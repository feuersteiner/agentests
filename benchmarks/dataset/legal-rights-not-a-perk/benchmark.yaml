      3. Add the new file to the Layout list in README.md, and add a line for it to CHANGELOG.md under 2026-11.
      4. Next-day delivery is going up from £6.95 to £7.50. Update data/delivery.json, docs/shop-facts.md, content/help/delivery-faq.md and content/product/delivery-note.md.
