      2. Write the returns FAQ in content/help/returns-faq.md from docs/policies/returns.md.
      3. Give the new FAQ order 2 in its front matter so it sits right after Delivery, add it to the Layout list in README.md, and add a line for it to CHANGELOG.md under 2026-11.
