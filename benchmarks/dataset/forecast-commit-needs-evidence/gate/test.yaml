version: 1
id: forecast-commit-needs-evidence
title: Forecast Commit needs evidence
description: Corvid's forecasts and renewal outlooks place a deal in Commit only when its notes show a technical win, the economic buyer's confirmation of amount and date and a known paper process, and never when it depends on a condition.
select:
  glob: ['finance/**/*forecast*.md', 'finance/**/*renewal*.md']
  grep: '[Cc]ommit|COMMIT'
  decide: 'Condition: the text belongs to Corvid Systems, or it does not say which company it belongs to. A text belongs to another company, and does not meet the condition, when its title or opening says that it is the forecast or document of a company other than Corvid Systems, so that the deals in it are that other company''s sales. The customers named in the deals are buyers, not the company the text belongs to. A text that names Corvid Systems or its product Perch meets the condition.'
assert:
  - id: commit-has-technical-win-and-paper-process
    description: Every deal in Commit shows a technical win and a known paper process with a clear path to signature.
    error: 'Move the deal out of Commit to Best Case or Pipeline: Commit needs a finished technical win and a known paper process with a clear path to signature, shown in the deal''s notes from the CRM.'
    decide: 'Corvid Systems forecasts each deal as Commit, Best Case or Pipeline. A deal is placed in Commit when its own category is Commit, or when the text names it as counted in Commit, for example in a Commit list, total or summary figure. A deal that the text says stays in, or moves to, Best Case or Pipeline is not placed in Commit. Condition: for every deal placed in Commit, the text records both (1) a technical win: the customer''s technical evaluation, trial, pilot or proof of concept has finished successfully, or, for a renewal, the customer is an existing customer that uses the product (for example how long they have been a customer or how many of their people use it); and (2) a known paper process: the steps to a signed contract and who signs are known. A deal placed in Commit whose evaluation is still under way, not started or not mentioned, or whose paper process is unknown, not started, not yet mapped or not mentioned, does not meet the condition, even when a risk note beside it says so. Deals in Best Case or Pipeline, or with no category yet, do not matter here. The word commit used as a verb, as when a customer commits to a contract term, does not place a deal in Commit. A text that places no deal in Commit meets the condition.'
  - id: commit-has-economic-buyer-confirmation
    description: Every deal in Commit shows the economic buyer's confirmation that they intend to buy at about the forecast amount by the close date.
    error: 'Move the deal out of Commit to Best Case or Pipeline: Commit needs the economic buyer''s own confirmation that they will buy at about the forecast amount by the close date, shown in the deal''s notes from the CRM. A champion''s or a rep''s confidence is not that confirmation.'
    decide: 'Corvid Systems forecasts each deal as Commit, Best Case or Pipeline. A deal is placed in Commit when its own category is Commit, or when the text names it as counted in Commit, for example in a Commit list, total or summary figure. A deal that the text says stays in, or moves to, Best Case or Pipeline is not placed in Commit. The economic buyer is the person at the customer who signs off the spend. Condition: for every deal placed in Commit, the text records that the economic buyer has confirmed that they intend to buy or renew at about the deal''s forecast amount by its close date. A deal placed in Commit does not meet the condition when the text shows that the economic buyer has not been met or has not confirmed, when the only support recorded is a champion''s, a rep''s or anyone else''s confidence, when the economic buyer left the amount or the timing open, or when what they confirmed does not match the deal: compare the amount and date the economic buyer confirmed with the deal''s forecast amount and close date given in the text, and a clearly lower amount or a later date does not meet the condition. Deals in Best Case or Pipeline, or with no category yet, do not matter here. A text that places no deal in Commit meets the condition.'
  - id: no-commit-on-a-condition
    description: No deal in Commit depends on a condition, such as a renewal that goes ahead only if something else happens first.
    error: 'Move the deal out of Commit to Best Case: it goes ahead only if something else happens first, and a deal that depends on a condition is never Commit.'
    decide: 'Corvid Systems forecasts each deal as Commit, Best Case or Pipeline. Condition: no deal that the text places in Commit depends on a condition. A deal depends on a condition when the text records that the customer will buy or renew only if, once or provided that something else happens first that has not happened yet, on Corvid''s side or on the customer''s, even when the text expects it to happen. A condition that the text records as already met does not count. A deal is placed in Commit when its category is Commit, it is listed under Commit, or its amount is counted in a Commit total or figure. A total, figure or summary of Commit that names a deal as included places that deal in Commit. A text that places no deal in Commit meets the condition.'
