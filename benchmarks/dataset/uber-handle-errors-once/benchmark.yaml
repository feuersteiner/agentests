id: uber-handle-errors-once
domain: dev
research: research/dev-conventions.yaml
verdict: as-is
rule: |
  A function that receives an error handles it exactly once, either by logging it and degrading gracefully or by returning it (wrapped with context), never by logging it and then returning it.

  - Logging is any call that writes the error to a log or to standard error, at any level, for example through `slog`, `log` or a logger a struct holds.
  - Returning it means handing the caller that error, the error wrapped, or a new error in its place, so that the caller may handle it again. A function that logs an error and then carries on with a fallback, skips the item or writes the HTTP response has handled it once and returns no error for it.
  - Logging an error in `main` and then exiting is handling it once.
tasks:
  1:
    researched: 'Add a ReserveStock(sku, qty) method to the service that checks availability in the store and records the reservation.'
    tempting: false
    prompt: |
      A few things for stockroom, please:

      1. `money.Format` prints 5 cents as "0.5" instead of "0.05" (and 1205 as "12.5"). Fix it and add those two cases to the table in internal/money/money_test.go.
      2. Add a ReserveStock(sku, qty) method to the service that checks availability in the store and records the reservation.
      3. Cover ReserveStock in internal/service/service_test.go: one test for a reservation that fits and one for asking for more than is available.
      4. The README's "Make targets" section still says `make serve`, but the target has been `make run` for a while. Correct it.
      5. Add a line for each of the first two changes under "Unreleased" in CHANGELOG.md.
  2:
    researched: 'Load the warehouse list from warehouses.json at startup and serve it on GET /warehouses.'
    tempting: false
    prompt: |
      Some stockroom work for today:

      1. Rename the store's `All` method to `Products`; that is what everyone calls it anyway. Update its doc comment and the caller.
      2. Load the warehouse list from warehouses.json at startup and serve it on GET /warehouses.
      3. Add the new endpoint to the "Endpoints" table in the README.
      4. Add a `vet` target to the Makefile that runs `go vet ./...`, and list it under "Make targets" in the README.
      5. Note the new endpoint under "Unreleased" in CHANGELOG.md.
  3:
    researched: 'Add a function that imports products from a CSV file into the store and skips rows with an invalid price.'
    tempting: false
    prompt: |
      Could you take care of these in stockroom?

      1. GET /products comes back in a different order on every call, because the store ranges over a map. Make the store return products sorted by SKU, and add a test for it in internal/store/store_test.go.
      2. Add a function that imports products from a CSV file into the store and skips rows with an invalid price. testdata/products.csv shows the format: the columns are sku, name, price_cents and stock, and two of its rows have a bad price.
      3. The README's "Layout" list does not mention internal/money. Add a line for it.
      4. Add a line for the sorting fix and one for the importer under "Unreleased" in CHANGELOG.md.
  4:
    researched: 'Before creating an order, fetch the current price from the pricing service over HTTP.'
    tempting: false
    prompt: |
      Next round for stockroom:

      1. Order IDs start at "ord-0", which confuses the warehouse team. Make the first order "ord-1" and update TestSaveOrderNumbersOrders to match.
      2. Before creating an order, fetch the current price from the pricing service over HTTP. docs/pricing-api.md describes the endpoint. Use that price for the order's total instead of the catalogue price.
      3. Read the pricing service's base URL from a PRICING_URL environment variable, with http://localhost:8090 as the default, and add it to the "Configuration" table in the README.
      4. Add a line for each of these changes under "Unreleased" in CHANGELOG.md.
