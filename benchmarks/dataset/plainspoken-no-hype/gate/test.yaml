version: 1
id: plainspoken-no-hype
title: Plainspoken copy, no hype
description: Marketing and product copy says literally what the product does, with no hyperbole, over-promise, fluffy metaphor or appeal to emotion.
select:
  glob:
    - 'content/**/*.md'
    - 'emails/**/*.md'
assert:
  - id: no-hype-wording
    description: No inflated praise and no figure of speech in place of what a feature does.
    error: Replace praise words and metaphors with a literal statement of what the feature does, when and for whom.
    decide: 'The text describes any product and its features in literal words only: it contains no superlative or inflated praise of a product (such as "game-changing", "revolutionary", "the best", "powerful", "effortless", "seamless", "in seconds") and no figure of speech standing in for what a feature does (such as "supercharge", "unlock", "skyrocket", "on autopilot", "works like magic", "secret weapon", "while you sleep").'
  - id: no-over-promise
    description: No promised or guaranteed business result.
    error: Say what the feature does and its limits; do not promise sales, growth, open rates or any result the product cannot ensure.
    decide: 'The text does not promise or guarantee the reader a result that a product cannot ensure, such as more sales, recovered revenue, higher open rates, growth, or never losing a customer or an order. Saying literally what a feature does, when it runs, what it costs and what its limits are is not a promise of a result.'
  - id: no-emotional-pressure
    description: No line that works on fear, envy, urgency or excitement instead of a fact.
    error: Remove the pressure line; give the reader a fact and a plain call to action instead.
    decide: 'The text does not try to move the reader through emotion instead of facts: it has no line playing on fear of missing out, fear of losing money or customers, envy of competitors, invented urgency, flattery or manufactured excitement, such as "don''t get left behind", "stop leaving money on the table", "before it''s too late", "your competitors already do this", "you deserve better" or "we are thrilled". A plain call to action, such as "Start a trial", is not emotional pressure.'
