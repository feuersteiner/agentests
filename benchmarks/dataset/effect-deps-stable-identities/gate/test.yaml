version: 1
id: effect-deps-stable-identities
title: Effects that call an API depend only on stable values
description: In the console's React code, every effect that makes a request depends only on primitives, state and memoised values, never on an object, array or function that is new on each render.
select:
  glob: ['src/**/*.ts', 'src/**/*.tsx']
  grep: '\buse(Layout)?Effect\s*\('
assert:
  - id: no-render-created-dependency
    description: No request-making effect depends on an object, array or function created during render, or lacks a dependency array.
    error: Move the object or function inside the effect or outside the component, or memoise it with stable dependencies, and list only primitives, state and memoised values.
    decide: 'For each `useEffect` or `useLayoutEffect` whose callback makes a network request (calls `fetch` or an API client function, directly or through a function it calls): it has a dependency array as its second argument, and for each name in that array, the line that declares the name inside the component or hook is not an object literal (`const name = { ... }`, even when every field in it comes from state or is a primitive), an array literal (`const name = [ ... ]`) or a function (`const name = () => ...`, `const name = async () => ...` or `function name() {}`). Names declared with `useState`, `useRef`, `useMemo`, `useCallback` or another hook, primitives, and names declared outside the component are fine. If there is no such effect, this is true.'
  - id: no-account-context-object
    description: No effect depends on the whole object useAccount() returns.
    error: Take account (or account.id) and setAccount from useAccount() and list those, never the object it returns.
    grep: '\b(const|let|var)\s+\w+\s*(:[^=]+)?=\s*useAccount\s*\('
    decide: 'The value `useAccount()` returns is a new object on every render. A variable assigned that whole value, such as `ctx` in `const ctx = useAccount()`, does not appear on its own as an entry of the dependency array of a `useEffect`, `useLayoutEffect`, `useMemo` or `useCallback`. An entry that reads a property of it, such as `ctx.account.id`, is fine. If no dependency array lists such a variable on its own, this is true.'
  - id: no-argument-or-prop-dependency
    description: No request-making effect depends on an object, array or function received as an argument or prop.
    error: Read the primitive fields of the argument or prop before the effect and list those, or list a string key such as JSON.stringify(value).
    grep: '\bfunction\s+(use[A-Z]\w*|[A-Z]\w*)\s*\(\s*[\w{]|\bconst\s+(use[A-Z]\w*|[A-Z]\w*)\s*(:[^=]+)?=\s*(async\s*)?\(\s*[\w{]'
    decide: 'A hook or component that receives an object, array or function as a parameter or prop, such as `options` in `function useThing(options: ThingOptions)` or an `onSelect` prop, never puts that parameter itself in the dependency array of a `useEffect` or `useLayoutEffect` that makes a network request, nor in the dependency array of a `useMemo` or `useCallback` whose result such an effect lists. Primitive fields destructured from it, as in `const { id } = options`, are fine, and so are parameters typed as a string, number, boolean or union of literals. If there is no such effect, this is true.'
