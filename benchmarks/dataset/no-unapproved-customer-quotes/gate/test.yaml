version: 1
id: no-unapproved-customer-quotes
title: No unapproved customer quotes
description: Larkspur Data's website pages, sales sheets, proposals and blog posts quote or paraphrase customers only with its two approved customer-story quotes, never with remarks from feedback calls.
select:
  glob: ['website/**/*.md', 'sales/**/*.md', 'proposals/**/*.md', 'blog/**/*.md']
  grep: '["“”‘]|(^|\n) {0,3}>|\b([Ss]aid|[Ss]ays?|[Tt]old|[Tt]ells?|[Tt]elling|[Pp]uts? it|[Aa]ccording to|[Ww]ords|[Dd]escrib(e|es|ed|ing)|[Cc]all(s|ed)? it|[Rr]ecall(s|ed)?|[Ee]xplain(s|ed)?|[Rr]emark(s|ed)?|[Mm]ention(s|ed)?|[Aa]dmit(s|ted)?|[Ww]rote|[Ff]elt|[Ss]hared|[Nn]oted)\b'
assert:
  - id: quoted-customer-words-are-approved
    description: Every passage in quotation marks or a block quote that is presented as a Larkspur customer's words is one of the two approved quotes, credited to its own customer.
    error: 'Quote only the two approved customer-story quotes, credited to their own customers: "We cut our weekly reporting time in half." (Priya Natarajan, Head of Analytics, Corvane) and "Our store managers start every day with the same numbers as head office." (Tom Ashby, Retail Operations Director, Haldane Retail). Remove any other customer quote, such as a line from a feedback call, or make the point in Larkspur''s own words.'
    grep: '["“”‘]|(^|\n) {0,3}>'
    decide:
      - 'Larkspur Data has cleared exactly two customer quotes for its copy: (1) "We cut our weekly reporting time in half." from Priya Natarajan, Head of Analytics, Corvane; (2) "Our store managers start every day with the same numbers as head office." from Tom Ashby, Retail Operations Director, Haldane Retail. No other words of any Larkspur customer are cleared: not remarks from feedback calls or call notes, not reviews or social posts, and not words the text says were approved or shared with permission. The condition: every passage in quotation marks or in a block quote that is presented as the words of a customer of Larkspur (a person or company that uses Larkspur, whether named, described without a name such as "VP of Product at a fintech", or not credited at all) is one of these two quotes, word for word or shortened without changing its meaning, and is not credited to anyone other than its own customer. Quotation marks around words that are not a customer''s, such as a button label, a product name, a heading, a term, or words of a Larkspur employee, do not count.'
      - 'The text is the copy of a company other than Larkspur Data. That is, it does not mention Larkspur anywhere, and it names a product or company other than Larkspur as the one it offers or announces, the way a company names its own product on its own page (for example "Acme Books puts your stock online" or "Try Acme free"). The names of customers, of the people quoted, or of tools a customer used before do not count as the product the text offers.'
  - id: no-reported-customer-remarks
    description: Outside quotation marks, the text reports what a particular Larkspur customer said only when it paraphrases that customer's approved quote.
    error: 'Do not report what a particular customer said or told us, named or anonymised, unless it paraphrases one of the two approved quotes (Priya Natarajan of Corvane, Tom Ashby of Haldane Retail). Put themes from feedback calls in Larkspur''s own words instead.'
    grep: '\b([Ss]aid|[Ss]ays?|[Tt]old|[Tt]ells?|[Tt]elling|[Pp]uts? it|[Aa]ccording to|[Ww]ords|[Dd]escrib(e|es|ed|ing)|[Cc]all(s|ed)? it|[Rr]ecall(s|ed)?|[Ee]xplain(s|ed)?|[Rr]emark(s|ed)?|[Mm]ention(s|ed)?|[Aa]dmit(s|ted)?|[Ww]rote|[Ff]elt|[Ss]hared|[Nn]oted)\b'
    decide:
      - 'Outside quotation marks and block quotes, the text never reports what a particular customer said, told, wrote, described or felt. A particular customer is a named person or company that uses Larkspur, or one described without a name, such as "one head of data at a retailer" or "a fintech VP". General statements about customers or teams as a group, such as "customers generally say they want fewer spreadsheets", are not reports of a particular customer, and neither are words of Larkspur''s own staff or anything inside quotation marks or block quotes.'
      - 'Every particular person or company whose words the text reports outside quotation marks and block quotes is one of these, and nobody else: Priya Natarajan or Corvane, reported as saying that their weekly reporting now takes half the time; Tom Ashby or Haldane Retail, reported as saying that store managers start each day with the same numbers as head office; a member of Larkspur''s own staff; or, in a proposal, the prospect the proposal is addressed to and its people. General statements about customers or teams as a group are not reports of a particular person or company.'
      - 'The text is the copy of a company other than Larkspur Data. That is, it does not mention Larkspur anywhere, and it names a product or company other than Larkspur as the one it offers or announces, the way a company names its own product on its own page (for example "Acme Books puts your stock online" or "Try Acme free"). The names of customers, of the people quoted, or of tools a customer used before do not count as the product the text offers.'
