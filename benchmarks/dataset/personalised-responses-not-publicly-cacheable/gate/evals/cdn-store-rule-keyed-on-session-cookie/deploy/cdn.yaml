# Edge rules for the store's CDN in front of store.ashgrove.games.
#
# Rules are checked from top to bottom, and the first rule whose `path` matches the request's
# path applies. `*` matches within one path segment and `**` matches any number of segments.
#
# Rule fields:
#   path            the path pattern
#   cache           true to keep copies at the edge; false sends every request to the origin
#   origin_headers  honor: the origin's Cache-Control and Vary headers decide whether and how
#                   long a response is kept, and a response without Cache-Control is not kept;
#                   override: every 200 response is kept for `ttl`, whatever the origin sends
#   ttl             seconds a copy stays fresh, with origin_headers: override
#   cache_key       the request parts a copy is keyed on besides the path:
#                   query (true or false), headers (a list of names), cookies (a list of names)
#   bypass          requests that skip the edge and go to the origin: cookies (a list of names)

origin: https://origin.ashgrove.internal

rules:
  - path: /static/**
    cache: true
    origin_headers: override
    ttl: 86400
    cache_key:
      query: false

  - path: /healthz
    cache: false

  # Store pages for five minutes, one copy per language and per session.
  - path: /store/**
    cache: true
    origin_headers: override
    ttl: 300
    cache_key:
      query: true
      headers: [Accept-Language]
      cookies: [session]

  - path: /**
    cache: true
    origin_headers: honor
