version: 1
id: personalised-responses-not-publicly-cacheable
title: Personalised responses are not publicly cacheable
description: Shared caches (the CDN, proxies and the Redis application cache) keep only responses that are the same for every visitor, and each shared copy of a /store page varies on the language.
select:
  glob:
    - 'app/**/*.py'
    - 'deploy/**/*.yaml'
    - 'deploy/**/*.yml'
  grep: '[Cc]ache|CACHE|Vary|max-age'
assert:
  - id: shareable-headers-only-for-logged-out-visitors
    description: A Cache-Control header that lets the CDN or proxies keep a store, account or checkout page is sent only to logged-out visitors, and with Vary on Accept-Language for /store pages.
    error: Send Cache-Control private or no-store to logged-in visitors and on /account and /checkout, send a public or max-age header only when request.user is None, and add Vary with Accept-Language to every shareable /store response.
    grep: '["''][Cc]ache-[Cc]ontrol["'']|Surrogate-Control|CDN-Cache-Control|cache_control'
    decide:
      - 'Policy of the Ashgrove Games store: its /store pages (the path /store and paths under /store/) show a "recommended for you" block to logged-in visitors and are written in the language of the request''s Accept-Language header; its /account and /checkout pages are per-user. A visitor is logged in when request.user is not None. A shareable value is a Cache-Control, CDN-Cache-Control or Surrogate-Control value that contains public, s-maxage or max-age and contains neither private nor no-store; "private, max-age=60" and "private, no-store" are not shareable. Neither of these happens in this code: (1) a shareable value is set, without a Vary header naming Cookie on the same response, in a branch that a logged-in visitor''s request for a /store, /account or /checkout path, or for a page built from request.user or a cookie, can reach; (2) a shareable value is set on a response for a /store path without a Vary header naming Accept-Language on the same response. An elif or else that follows a branch taken whenever request.user is not None cannot be reached by logged-in visitors, and neither can code after a return for them; a branch chosen by the path alone, such as one for /store, with no such earlier branch and no check that request.user is None or that the session cookie is absent, can be. Shareable values on static files or a health check are fine.'
      - 'This file belongs to another company''s product, not to the Ashgrove Games store: its docstring or comments name that other company or product.'
  - id: edge-rules-key-store-pages-on-session-and-language
    description: A CDN rule that caches store pages at the edge whatever the app sends skips or keys on the session cookie and keys on Accept-Language.
    error: Add bypass cookies [session] (or session in cache_key cookies) to the rule, and Accept-Language to its cache_key headers, or let it honour the origin's headers.
    grep: 'cache:\s*(true|yes)'
    decide: 'Logged-in visitors of the Ashgrove Games store carry the session cookie and see their own content on /store, /account and /checkout pages, and /store pages are translated according to the Accept-Language header. This is a CDN rules file. Neither of these is in it: (1) a rule that has cache: true, has origin_headers: override or no origin_headers line, has a path that is /** or starts with /store, /account or /checkout, and lists session neither under its bypass cookies nor under its cache_key cookies; (2) a rule that has cache: true, has origin_headers: override or no origin_headers line, has a path that is /** or starts with /store, and does not list Accept-Language under its cache_key headers. A rule with origin_headers: honor or with cache: false is never one of these, whatever its path.'
  - id: page-cache-keys-cover-user-and-language
    description: A rendered page kept in the Redis application cache is keyed on the user (or kept only for logged-out visitors) and, for /store pages, on the language.
    error: Store rendered pages only when request.user is None, or put the user id in the key, and put the locale in the key of every cached /store page.
    grep: '\.set\(|setex|lru_cache|@(functools\.)?cache\b|[Cc]ache\[|CACHE\['
    decide: 'This is code of the Ashgrove Games store. Standing policy of that store: a visitor is logged in when the request carries the `session` cookie, from which the app sets `request.user`; every page under /store shows a "recommended for you" block to logged-in visitors and is rendered in the language of the request''s Accept-Language header; every /account and /checkout page is per-user. The application cache (`cache` from app.cache, which is Redis in production), and any module-level dict or memoizing decorator, is shared by all requests. Wherever the code stores a rendered page, a piece of rendered HTML or a response in such a cache, its key includes: (a) the user id or the session, unless the code stores it only when request.user is None (a /store page stored without that check counts as stored for logged-in visitors, and an /account or /checkout page always does); and (b) for a /store page or part of one, the locale or the Accept-Language value. Caching data that is the same for every visitor and every language, such as product rows or a list of bestseller slugs, passes, and so does a file that stores no rendered page or response.'
