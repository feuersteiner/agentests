id: k8s-enum-not-bool
domain: dev
research: research/dev-conventions.yaml
verdict: as-is
rule: |
  A new API or configuration field that expresses a mode or policy is a string enum with named values (including a named default), not a boolean, unless the concept is truly and permanently two-valued.

  - A mode or policy chooses how the service behaves, such as what it sends, retries, allows or requires. A fact that can never have a third value, such as whether an email address was verified or whether a delivery succeeded, is truly two-valued and may be a boolean.
  - In TypeScript a string enum is a union of string literals, like `type Visibility = "private" | "team" | "public"`, or an `enum` with string values. Each value names what it selects; `"yes"`, `"no"`, `"on"`, `"off"`, `"true"` and `"false"` do not.
  - The default is one of the named values, usually the one that keeps today's behaviour, so no behaviour is chosen only by leaving the field out or by `null` or `undefined`.
tasks:
  1:
    researched: 'Let project owners choose whether new members get an email when they are added.'
    tempting: false
    prompt: |
      A few things for the Trellis API:

      1. `slugify("Q3  Roadmap!")` returns "q3--roadmap-". Collapse runs of dashes into one and trim dashes from both ends, and add a test for that case in test/slug.test.ts.
      2. createProject accepts a blank name such as "   ". Reject it with a 400, the way createKey does, and add a test.
      3. Let project owners choose whether new members get an email when they are added.
      4. Add a test for step 3 in test/api.test.ts and describe the change in the README.
      5. Add a line for each change under Unreleased in CHANGELOG.md.
  2:
    researched: 'Add a setting so a webhook can skip retries when delivery fails.'
    tempting: true
    prompt: |
      Some webhook jobs:

      1. listWebhooks returns the webhooks of every project, not only the given project's. Fix it and add a test with two projects in test/api.test.ts.
      2. The README says a failed delivery is tried up to 3 attempts in all, which is what we want, but MAX_ATTEMPTS in src/api/webhooks.ts is 5. Make the code match the README.
      3. Add a setting so a webhook can skip retries when delivery fails.
      4. Add a test for step 3 and document the setting in the README's Webhooks section.
      5. Add a line for each change under Unreleased in CHANGELOG.md.
  3:
    researched: 'Allow API keys to be read-only.'
    tempting: false
    prompt: |
      A few things for the API keys:

      1. listKeys returns each key with its full secret, but the README says the secret is shown only once and listKeys returns the prefix instead. Make it return KeySummary objects, which have no secret, and make the test check that no secret comes back.
      2. createKey accepts a name of any length. Reject names longer than 64 characters with a 400 and add a test.
      3. Allow API keys to be read-only.
      4. Add a test for step 3 and document it in the README's API keys section.
      5. Note the changes under Unreleased in CHANGELOG.md.
  4:
    researched: 'Add a project setting that requires members to use two-factor authentication.'
    tempting: false
    prompt: |
      A handful of things in the projects code:

      1. addMember lets the owner add someone who is already a member, and they end up listed twice. Return a 409 for that instead, and add a test.
      2. Rename checkSettings in src/api/projects.ts to validateSettings.
      3. Add a project setting that requires members to use two-factor authentication.
      4. Add a test for step 3 in test/api.test.ts and document the setting in the README.
      5. Add a line for each change under Unreleased in CHANGELOG.md.
  4L:
    researched: 'Add a project setting that requires members to use two-factor authentication.'
    tempting: false
    context: 200000
    prompt: |
      Support move to a new help desk at the end of the month and want our read on what they sent us first. A few things for the Trellis API; please take them in order:

      1. docs/support-tickets/ holds every ticket support sent to our queue between 5 October and 13 November, one file each, exported without tags or statuses. Go through every ticket and write docs/ticket-review.md with a table, one row per ticket: its number, which part of Trellis it is really about (projects and members, webhooks, API keys, accounts and sign-in, or other), what the customer needed in one line, and how it ended: sorted (how), a workaround the customer accepted (which), waiting for a change to the API (what change), passed to another team (which), or waiting on the customer (for what). Read every ticket to its last message: the subject line and first message often describe a symptom rather than the cause, many raise a second matter on the way, and support's own guesses at the area were wrong more often than not.
      2. Under the table, list the changes to the API that tickets are waiting for, most-asked first, with the ticket numbers for each.
      3. addMember lets the owner add someone who is already a member, and they end up listed twice. Return a 409 for that instead, and add a test.
      4. Add a project setting that requires members to use two-factor authentication.
      5. Add a line for each change under Unreleased in CHANGELOG.md.
