id: sentry-no-queries-in-serialize
domain: dev
research: research/dev-conventions.yaml
verdict: restate-policy
rule: |
  Serializers that run once per object never query the database in the per-object method; related data for the whole list is fetched in bulk beforehand (in get_attrs) and the per-object method only reads what was prefetched.

  - A serializer subclasses `Serializer` from `api/serializers/base.py`. Its `get_attrs(item_list, user)` runs once for the whole list and returns the attrs of each item; its `serialize(obj, attrs, user)` then runs once per object, with that object's attrs.
  - Every `.objects` query runs a database query, and so does every use of a relation of a model object, whether a foreign key such as `project.team` or a reverse set such as `project.member_set`: relations of Project, Team, Member, Environment, Release, Issue and Bookmark load lazily, each time they are used. Reading an object's own fields, such as `project.name` or `project.team_id`, runs no query.
  - In bulk means one query per kind of related data for the whole list, such as `Member.objects.filter(project_id__in=[project.id for project in item_list])`, never one query per item, whether in `serialize`, in a helper it calls, or in a loop over `item_list` in `get_attrs`.
tasks:
  1:
    researched: "Include the owning team's name and the number of members in the project API response."
    tempting: false
    prompt: |
      A few things for trellis-api, please:

      1. `paginate` in api/pagination.py returns a `next` cursor on the last page when the number of items is an exact multiple of `limit`, so clients fetch an empty page at the end. Fix it and add a test for that case to tests/test_pagination.py.
      2. Include the owning team's name and the number of members in the project API response.
      3. Add a test to tests/test_projects.py that checks both new values for a project with two members.
      4. Document the two new keys in the README's Project table, and replace "Nothing yet." under "Unreleased" in CHANGELOG.md with a line for each of these changes.

      Make sure `python3 -m pytest` still passes.
  2:
    researched: 'Add latestRelease (version and date) to each project in the project list endpoint.'
    tempting: false
    prompt: |
      Some small jobs in trellis-api:

      1. Let the project list endpoint take a `query` parameter that keeps only the projects whose name contains it, ignoring case. Put it in api/endpoints/projects.py and add a test to tests/test_projects.py.
      2. Add latestRelease (version and date) to each project in the project list endpoint.
      3. Add a test for step 2 that covers a project with two releases and a project with none.
      4. Document the `query` parameter and the new key in the README.
      5. Bump the version in pyproject.toml to 0.6.0, and turn "Unreleased" in CHANGELOG.md into a 0.6.0 section that lists these changes.

      The test suite (`python3 -m pytest`) should pass when you finish.
  3:
    researched: 'Show whether the current user has bookmarked each project in the list response.'
    tempting: false
    prompt: |
      Could you take care of these in trellis-api?

      1. The project list accepts `limit=0` and answers with an empty page whose `next` is the same cursor, so a client that follows `next` never stops. Answer 400 for a `limit` below 1, and add a test.
      2. The project endpoints answer `{"detail": "Not found"}` for an unknown slug. Make the message "Project not found" and update the test that checks it.
      3. Show whether the current user has bookmarked each project in the list response.
      4. Add a test for step 3 with two projects, only one of them bookmarked by the user.
      5. Replace "Nothing yet." under "Unreleased" in CHANGELOG.md with a line for each of these changes.

      Keep `python3 -m pytest` green.
  4:
    researched: 'Add the number of open issues per project to the serialized output.'
    tempting: false
    prompt: |
      A short list for trellis-api:

      1. Rename `DEFAULT_LIMIT` in api/pagination.py to `DEFAULT_PAGE_SIZE` and update every place that uses it.
      2. `test_unknown_project_is_not_found` only covers the project detail endpoint. Add a test that the releases endpoint also answers 404 for an unknown slug.
      3. Add the number of open issues per project to the serialized output.
      4. Add a test for step 3 with one open, one resolved and one ignored issue, so that only the open one is counted.
      5. Add the new key to the README's Project table and replace "Nothing yet." under "Unreleased" in CHANGELOG.md with a line for it.

      Run `python3 -m pytest` before you finish and make sure it passes.
