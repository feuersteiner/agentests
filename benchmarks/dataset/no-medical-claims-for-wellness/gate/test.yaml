version: 1
id: no-medical-claims-for-wellness
title: No medical claims for wellness
description: Lullo's pages, ads and emails never claim or imply that the app diagnoses, treats or prevents a physical or mental condition, such as insomnia, anxiety or depression.
select:
  glob: ['content/**/*.md', 'emails/**/*.md']
  grep: '[Ll]ullo|LULLO|[Ss]leep|SLEEP|[Aa]wake|AWAKE|[Rr]estless|[Ii]nsomni|INSOMNI|[Aa]nxi|ANXI|[Dd]epress|[Pp]anic|[Mm]ood\b|[Bb]urn-?out|[Mm]ental|[Tt]rauma|PTSD|ADHD|[Tt]innitus|[Mm]igraine|[Hh]eadache|[Bb]lood pressure|[Aa]pno?ea|[Nn]ightmare|[Ss]ymptom|[Dd]isorder|[Dd]isease|[Ii]llness|[Ss]yndrome|\b[Cc]ur(e|es|ed|ing)\b|\b[Hh]eal(s|ed|ing)?\b|[Tt]reat(s|ed|ing|ment)?\b|[Tt]herap|[Rr]emed(y|ies)|[Rr]elie[fv]|[Dd]iagnos|[Mm]edic|[Cc]linic|[Dd]octor|\bGP\b|[Pp]rescri|[Ww]ellness|[Ww]ell-?being'
assert:
  - id: no-treatment-claim
    description: The copy never says or suggests that Lullo cures, treats, relieves or reduces a condition or its symptoms.
    error: Lullo is a wellness app, not a medicine or a medical device. Say what it does and that it helps people relax, wind down or fall asleep more easily; do not say it cures, eases, reduces or helps with insomnia, anxiety, depression or any other condition or its symptoms, even with "can help" or "may".
    grep: '[Ii]nsomni|INSOMNI|[Ss]leepless|SLEEPLESS|[Aa]wake|AWAKE|[Rr]estless|[Tt]oss(ing)? and turn|[Cc]an(no|''|’)?t (\w+ )?(sleep|asleep)|CAN(NO|''|’)?T (\w+ )?SLEEP|[Uu]nable to (\w+ )?(sleep|asleep)|[Tt]rouble (\w+ ){0,3}(sleep|asleep)|[Ss]truggl|[Dd]ifficult(y|ies)? (\w+ ){0,2}(sleep|asleep)|[Pp]oor sleep|[Bb]ad (sleep|nights?)|[Ss]leep (problem|issue|trouble|struggle|difficult|disorder|disturb|aid|deprivation|debt)|[Aa]nxi|ANXI|[Dd]epress|[Pp]anic|[Mm]ood|[Bb]lues\b|[Ff]eel(ing)? low|[Bb]urn-?out|[Mm]ental|[Tt]rauma|PTSD|ADHD|[Tt]innitus|[Pp]ain\b|[Mm]igraine|[Hh]eadache|[Bb]lood pressure|[Aa]pno?ea|[Nn]ightmare|[Jj]et ?lag|[Ss]ymptom|[Dd]isorder|[Cc]ondition|[Dd]isease|[Ii]llness|[Ss]yndrome|\b[Cc]ur(e|es|ed|ing)\b|\b[Hh]eal|[Tt]reat|[Tt]herap|[Rr]emed|[Rr]elie[fv]|[Mm]edic|[Cc]linic|[Dd]octor|\bGP\b|[Pp]rescri|[Pp]ills?\b|[Dd]rug|[Dd]iagnos|[Dd]etect|[Pp]revent|[Pp]rotect|at bay|[Ww]hether you have|\b[Ff]ix'
    decide:
      - 'Lullo is a sleep-sounds and breathing app, not a medicine. The text never says or suggests that Lullo, or the app, sounds, breathing exercises or course it promotes, cures, treats, fixes, ends, beats, relieves, reduces, eases or helps with a health condition or its symptoms, such as insomnia, sleepless nights, trouble sleeping, lying awake, anxiety, panic attacks, depression, low mood or tinnitus. A softened claim ("can help with", "may ease") counts. These are not such claims and pass: saying that Lullo helps people relax, unwind, wind down, fall asleep more easily or sleep better, including survey figures about falling asleep more easily; general tips for sleep habits; anything about everyday stress, a long day or a busy mind; and telling readers who have a sleep problem or a condition to see a doctor, or saying that Lullo does not treat it. A text about a product that is not a sleep, breathing or relaxation app passes.'
      - 'The text promotes a product of a company other than Lullo: it names another company or brand as the seller or maker of what it promotes, and it never mentions Lullo.'
  - id: no-condition-as-the-hook
    description: The copy never presents Lullo as the answer to a condition or a symptom, such as a sleep problem or anxiety.
    error: Do not open with a sleep problem or a condition, such as not being able to sleep or anxiety, and then offer Lullo as the answer. Write about the evening, winding down, the sounds and the breathing instead.
    grep: '[Ii]nsomni|INSOMNI|[Ss]leepless|SLEEPLESS|[Aa]wake|AWAKE|[Rr]estless|[Tt]oss(ing)? and turn|[Cc]an(no|''|’)?t (\w+ )?(sleep|asleep)|CAN(NO|''|’)?T (\w+ )?SLEEP|[Uu]nable to (\w+ )?(sleep|asleep)|[Tt]rouble (\w+ ){0,3}(sleep|asleep)|[Ss]truggl|[Dd]ifficult(y|ies)? (\w+ ){0,2}(sleep|asleep)|[Pp]oor sleep|[Bb]ad (sleep|nights?)|[Ss]leep (problem|issue|trouble|struggle|difficult|disorder|disturb|aid|deprivation|debt)|[Aa]nxi|ANXI|[Dd]epress|[Pp]anic|[Mm]ood|[Bb]lues\b|[Ff]eel(ing)? low|[Bb]urn-?out|[Mm]ental|[Tt]rauma|PTSD|ADHD|[Tt]innitus|[Pp]ain\b|[Mm]igraine|[Hh]eadache|[Bb]lood pressure|[Aa]pno?ea|[Nn]ightmare|[Jj]et ?lag|[Ss]ymptom|[Dd]isorder|[Cc]ondition|[Dd]isease|[Ii]llness|[Ss]yndrome|\b[Cc]ur(e|es|ed|ing)\b|\b[Hh]eal|[Tt]reat|[Tt]herap|[Rr]emed|[Rr]elie[fv]|[Mm]edic|[Cc]linic|[Dd]octor|\bGP\b|[Pp]rescri|[Pp]ills?\b|[Dd]rug|[Dd]iagnos|[Dd]etect|[Pp]revent|[Pp]rotect|at bay|[Ww]hether you have|\b[Ff]ix'
    decide:
      - 'The text never presents Lullo, or the sleep or breathing app it promotes, as the answer to a sleep problem or a health condition. That means naming one, for example in a headline asking the reader whether they lie awake or cannot sleep, as a reason people download the app, or as what its users struggled with, and then offering the app or what it did for them. Sleep problems and health conditions include insomnia, sleepless nights, trouble sleeping, not being able to sleep, lying awake, anxiety, panic attacks, depression and low mood. A busy mind, a long or stressful day and a noisy street are not, so offering the app for them passes. Telling readers who have a sleep problem or a condition to see a doctor, or saying that Lullo does not treat it, passes, even when the text also says what Lullo is for. A text about a product that is not a sleep, breathing or relaxation app passes.'
      - 'The text promotes a product of a company other than Lullo: it names another company or brand as the seller or maker of what it promotes, and it never mentions Lullo.'
  - id: no-prevention-or-diagnosis-claim
    description: The copy never says or suggests that Lullo prevents a condition or tells the reader whether they have one.
    error: Lullo is a wellness app, not a medicine or a medical device. Do not say it keeps insomnia, anxiety, depression or any other condition away or from coming back, or that it detects or diagnoses one.
    grep: '[Ii]nsomni|INSOMNI|[Ss]leepless|SLEEPLESS|[Aa]wake|AWAKE|[Rr]estless|[Tt]oss(ing)? and turn|[Cc]an(no|''|’)?t (\w+ )?(sleep|asleep)|CAN(NO|''|’)?T (\w+ )?SLEEP|[Uu]nable to (\w+ )?(sleep|asleep)|[Tt]rouble (\w+ ){0,3}(sleep|asleep)|[Ss]truggl|[Dd]ifficult(y|ies)? (\w+ ){0,2}(sleep|asleep)|[Pp]oor sleep|[Bb]ad (sleep|nights?)|[Ss]leep (problem|issue|trouble|struggle|difficult|disorder|disturb|aid|deprivation|debt)|[Aa]nxi|ANXI|[Dd]epress|[Pp]anic|[Mm]ood|[Bb]lues\b|[Ff]eel(ing)? low|[Bb]urn-?out|[Mm]ental|[Tt]rauma|PTSD|ADHD|[Tt]innitus|[Pp]ain\b|[Mm]igraine|[Hh]eadache|[Bb]lood pressure|[Aa]pno?ea|[Nn]ightmare|[Jj]et ?lag|[Ss]ymptom|[Dd]isorder|[Cc]ondition|[Dd]isease|[Ii]llness|[Ss]yndrome|\b[Cc]ur(e|es|ed|ing)\b|\b[Hh]eal|[Tt]reat|[Tt]herap|[Rr]emed|[Rr]elie[fv]|[Mm]edic|[Cc]linic|[Dd]octor|\bGP\b|[Pp]rescri|[Pp]ills?\b|[Dd]rug|[Dd]iagnos|[Dd]etect|[Pp]revent|[Pp]rotect|at bay|[Ww]hether you have|\b[Ff]ix'
    decide:
      - 'The text never says or suggests that Lullo, or the sleep or breathing app it promotes, prevents a health condition, for example that it keeps insomnia, anxiety, depression or low mood away or stops them coming back, and never says that it can tell the reader whether they have a condition or spot its signs. A softened claim ("can help prevent", "may protect") counts. A bedtime routine, relaxing, winding down and falling asleep more easily are not preventing a condition. A text about a product that is not a sleep, breathing or relaxation app passes.'
      - 'The text promotes a product of a company other than Lullo: it names another company or brand as the seller or maker of what it promotes, and it never mentions Lullo.'
