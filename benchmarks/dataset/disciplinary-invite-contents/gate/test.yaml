version: 1
id: disciplinary-invite-contents
title: Disciplinary invitation letters
description: Each letter or template under hr/ that invites an employee to a disciplinary meeting sets out the specific allegation, names the possible outcomes (dismissal for a Fieldstone gross misconduct case), gives the date, time and place, and states the right to be accompanied.
select:
  glob: 'hr/**/*.md'
  grep: '[Mm]eet|MEET|[Hh]earing|HEARING|[Dd]isciplin|DISCIPLIN|[Mm]isconduct|MISCONDUCT|[Aa]llegation|ALLEGATION|[Ii]nvit|INVIT|[Aa]ttend|ATTEND'
assert:
  - id: specific-allegation
    description: The letter says what the employee is alleged to have done or failed to do, and when.
    error: 'Say in the letter itself what the employee is alleged to have done or failed to do, and when, for example "on 2 and 16 October you approved your own expense claims without a second approver"; a vague phrase or a pointer to the enclosed report is not enough.'
    decide: 'This condition is only about a letter, email or template that invites an employee to a disciplinary meeting or hearing: a meeting about alleged misconduct or poor performance that could end in a warning or dismissal, however gently it is worded or named (a "chat", "catch-up" or "conversation" about such concerns counts). Any other text meets the condition, including a policy, an investigation report, a briefing note for the manager, and a letter inviting an employee to a meeting at which no misconduct or poor performance is alleged, such as a return-to-work meeting after sickness, a welfare meeting or an appraisal, even when that letter names no allegation, outcome or companion. When the text holds a disciplinary invitation beside other content, judge only that letter. The condition: the letter itself says specifically what the employee is alleged to have done or failed to do, and when (dates or a period), in enough detail for them to prepare a response, for example "on 2 and 16 October you approved your own expense claims without a second approver" or "since 1 September more than 4% of your orders each month were entered wrongly, against a target of 2%". It fails when the allegation is vague, such as "concerns about your conduct", "some issues with how you have handled information", "a recent incident" or "the matters raised in the investigation", when it gives no date or period, or when it only points to an enclosed or attached report for what is alleged. In a template, a marked placeholder that asks for what the employee is alleged to have done and when, such as "[describe the alleged misconduct, with dates]", meets the condition; a placeholder that asks only for a "[reason]" or an "[issue]" does not.'
  - id: possible-outcomes-named
    description: The letter names the possible outcomes, including dismissal for a Fieldstone gross misconduct allegation.
    error: 'Name the possible outcomes if the allegation is upheld, such as a written warning, a final written warning or dismissal; for gross misconduct at Fieldstone, including mishandling customer data, say that dismissal is possible. "Further action" or "next steps" is not enough.'
    decide: 'This condition is only about a letter, email or template that invites an employee to a disciplinary meeting or hearing: a meeting about alleged misconduct or poor performance that could end in a warning or dismissal, however gently it is worded or named (a "chat", "catch-up" or "conversation" about such concerns counts). Any other text meets the condition, including a policy, an investigation report, a briefing note for the manager, and a letter inviting an employee to a meeting at which no misconduct or poor performance is alleged, such as a return-to-work meeting after sickness, a welfare meeting or an appraisal, even when that letter names no allegation, outcome or companion. When the text holds a disciplinary invitation beside other content, judge only that letter. The condition: the letter names, in plain words, the possible outcomes if the allegation is upheld, such as a written warning, a final written warning or dismissal. Vague wording does not meet it, such as "further action", "next steps", "a formal outcome" or "there may be consequences". Under Fieldstone Ltd''s disciplinary policy, gross misconduct, including mishandling customer data, can lead to dismissal. So a Fieldstone letter whose allegation is of gross misconduct, or of mishandling customer data, must say that dismissal is a possible outcome, and naming only warnings fails it. A letter from another company, or about a matter that is not gross misconduct, meets the condition by naming its possible outcomes. In a template, possible outcomes written in, or a marked placeholder that asks for them, meets the condition.'
  - id: time-place-and-companion
    description: The letter gives the date, time and place of the meeting and states the right to be accompanied.
    error: 'Give the date, the time and the place of the meeting (a room and address, or a video call), and tell the employee that they have the right to be accompanied by a colleague or a trade union representative.'
    decide: 'This condition is only about a letter, email or template that invites an employee to a disciplinary meeting or hearing: a meeting about alleged misconduct or poor performance that could end in a warning or dismissal, however gently it is worded or named (a "chat", "catch-up" or "conversation" about such concerns counts). Any other text meets the condition, including a policy, an investigation report, a briefing note for the manager, and a letter inviting an employee to a meeting at which no misconduct or poor performance is alleged, such as a return-to-work meeting after sickness, a welfare meeting or an appraisal, even when that letter names no allegation, outcome or companion. When the text holds a disciplinary invitation beside other content, judge only that letter. The condition has two parts, and both must hold. (1) The letter gives the date and the time of day of the meeting, and where it will be held: a room, building or address, or a video call. (2) The letter tells the employee that they have the right to be accompanied at the meeting, for example by a colleague or a trade union representative. It fails when the date, the time or the place is missing, when the employee is asked to suggest a day or time instead, or when it says nothing about being accompanied. In a template, marked placeholders such as "[date]", "[time]" and "[room]" meet part (1).'
