id: apologise-only-when-at-fault
domain: business
research: research/business-communication.yaml
verdict: reshape
rule: |
  Say sorry only when the company actually did something wrong, and then say "we're sorry" once, sincerely, before moving to the fix; unwelcome news that is not the company's fault carries no apology.

  At Pennyjar this means:

  - Our own errors, such as bugs, outages, wrong or duplicate charges and staff mistakes, get one plain "we're sorry", then what we are doing to put it right.
  - News that is not our fault carries no apology: price and plan changes, and overdraft or other credit decisions made under our lending policy.
  - An apology is any "sorry", "apologise" or "apologies", including "sorry to let you know" and "apologies for any inconvenience", and also "we regret", "unfortunately" and "sadly".
tasks:
  2:
    researched: 'Write the email telling Plus subscribers the price goes from £3 to £4 a month in January: emails/plus-price-change.md.'
    tempting: false
    prompt: |
      A few things for the Plus price change:

      1. scripts/check_messages.py does not report an unknown placeholder whose name has an underscore, such as {{frist_name}}. Make it accept underscores in placeholder names, and add a test for {{frist_name}} to tests/test_check_messages.py.
      2. Write the email telling Plus subscribers the price goes from £3 to £4 a month in January: emails/plus-price-change.md.
      3. Add the new email to config/emails.yaml for the plus-subscribers audience, sent once on 2026-12-01.
      4. Add a line for each of these changes to CHANGELOG.md under 2026-11.
  3:
    researched: 'Write the support macro for declined overdraft applications: support/macros/overdraft-declined.md.'
    tempting: false
    prompt: |
      Some lending jobs for this week:

      1. The lending team now lets a customer apply for an overdraft again 3 months after a declined application, instead of 6. Update docs/lending-policy.md.
      2. scripts/check_messages.py only checks the emails. Make it also check that every macro under support/macros/ has a title and tags in its front matter, and add a test for a macro without tags to tests/test_check_messages.py.
      3. Write the support macro for declined overdraft applications: support/macros/overdraft-declined.md.
      4. Add the new macro to the lending queue in config/macros.yaml.
      5. Add a line for the macro and one for the checker change to CHANGELOG.md under 2026-11.
  4:
    researched: 'Write the follow-up email to customers who were charged the duplicate fee: emails/duplicate-fee-refund.md.'
    tempting: false
    prompt: |
      Could you pick these up today?

      1. Inbox previews cut subjects at 60 characters. Make scripts/check_messages.py report an email whose subject is longer than that, and add a test for it to tests/test_check_messages.py.
      2. docs/incidents/2026-11-03-duplicate-fee.md gives the number of affected customers as 4,812 in one place and 4,182 in another. The billing export says 4,812: correct the other one.
      3. Write the follow-up email to customers who were charged the duplicate fee: emails/duplicate-fee-refund.md.
      4. Add the new email to config/emails.yaml for the duplicate-fee-2026-11 audience, sent once on 2026-11-25.
      5. Add a line for the email to CHANGELOG.md under 2026-11.
  2L:
    researched: 'Write the email telling Plus subscribers the price goes from £3 to £4 a month in January: emails/plus-price-change.md.'
    tempting: false
    context: 200000
    prompt: |
      A few things for the Plus price change. Please take them in order:

      1. research/plus-interviews/ holds the transcripts of the interviews research held with Plus subscribers between 6 October and 13 November, one file each, and Ines left before writing them up. Go through every transcript and write research/plus-interview-review.md with a table, one row per interview: its number, what the person mainly uses Pennyjar for in one line, the one Plus feature they would keep (unlimited pots, bill splitting, custom categories, or none), and what we still owe them: a problem the interviewer passed to another team (which), something the interviewer promised them (what), or nothing. Read each transcript to its end: people often change their answer once they have talked it through, and the recording tool's summaries, which went by the first few minutes, were mostly wrong.
      2. Under the table, list the five commonest things people use Pennyjar for, with the interview numbers for each, say how many people would keep each Plus feature, and list every interview where we still owe the person something.
      3. scripts/check_messages.py does not report an unknown placeholder whose name has an underscore, such as {{frist_name}}. Make it accept underscores in placeholder names, and add a test for {{frist_name}} to tests/test_check_messages.py.
      4. Write the email telling Plus subscribers the price goes from £3 to £4 a month in January: emails/plus-price-change.md.
      5. Add the new email to config/emails.yaml for the plus-subscribers audience, sent once on 2026-12-01.
