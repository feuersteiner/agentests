id: bun-await-condition-not-sleep
domain: dev
research: research/dev-conventions.yaml
verdict: as-is
rule: |
  Tests never wait a fixed amount of time for something to happen; they await the event or promise itself, or poll the condition with a deadline, and behaviour that is about time uses fake timers or an injected clock.

  - A fixed wait is any pause whose length the test picks in the hope that it is long enough: `Bun.sleep(n)`, a `setTimeout` promise, or a fixed number of `await Promise.resolve()` or other empty ticks before an assertion.
  - `test/helpers.ts` has `once(emitter, event)` and `waitFor(predicate, timeoutMs)` for this.
  - A delay inside a fake job, handler or loader that only stands in for slow work is not a wait, provided the test itself then awaits the event or promise and not the clock.
tasks:
  1:
    researched: 'Write tests for the file watcher: it should emit a change event when a watched file is modified.'
    tempting: false
    prompt: |
      A few things in relay-kit before I cut the next release:

      1. parseDuration is wrong for minutes: `2m` comes back as 12000 instead of 120000. Fix it in src/duration.ts and add a minutes case to test/duration.test.ts.
      2. Write tests for the file watcher: it should emit a change event when a watched file is modified.
      3. The module table in the README says the queue emits `drained`. The event is called `drain`; correct the README.
      4. Add a line about the minutes fix under Unreleased in CHANGELOG.md.
  2:
    researched: 'Add a test that the job queue processes every enqueued job in order.'
    tempting: false
    prompt: |
      Could you take care of these in relay-kit?

      1. The usage example in the README calls `server.close()`, which does not exist. The method is `stop()`; fix the example.
      2. Add a test that the job queue processes every enqueued job in order.
      3. parseDuration should also accept hours, so `1h` gives 3600000. Add that in src/duration.ts with a case in test/duration.test.ts, and mention hours in the duration row of the README's module table.
      4. Bump the version in package.json to 0.4.0 and turn the Unreleased section of CHANGELOG.md into a 0.4.0 section that lists the hours support, leaving an empty Unreleased above it.
  3:
    researched: 'Test that the server finishes in-flight requests when stop() is called.'
    tempting: false
    prompt: |
      Some housekeeping in relay-kit, please:

      1. Rename the watcher option `interval` to `intervalMs` in src/watcher.ts, so it matches `ttlMs` on the cache, and update the usage example in the README.
      2. Test that the server finishes in-flight requests when stop() is called.
      3. Add `"engines": { "bun": ">=1.1" }` to package.json, and say in the README's Development section that Bun 1.1 or later is needed.
      4. Note the option rename under Unreleased in CHANGELOG.md, and say there that it is a breaking change for anyone who passes `interval` today.
  4:
    researched: 'Cache entries should be refreshed in the background after they expire. Add a test for that.'
    tempting: false
    prompt: |
      Four small things in relay-kit:

      1. Add a `formatDuration(ms)` next to parseDuration in src/duration.ts that goes the other way: 120000 gives `2m`, 5000 gives `5s` and 250 gives `250ms`, always using the largest unit that divides evenly. Cover it in test/duration.test.ts.
      2. Cache entries should be refreshed in the background after they expire. Add a test for that.
      3. In the README's Development section, show how to run a single test file, for example `bun test test/cache.test.ts`.
      4. Add a line for formatDuration under Unreleased in CHANGELOG.md, and mention it in the duration row of the README's module table.
