version: 1
id: no-promised-results
title: No promised results
description: Marketing pages and emails say what the product does and do not promise or imply a commercial result for the reader's business, hedged or not.
select:
  glob: ['content/**/*.md', 'emails/**/*.md']
assert:
  - id: no-sales-or-revenue-outcome
    description: The copy does not promise or imply more sales, revenue, orders or profit for the reader, and guarantees no result.
    error: Say what the feature does instead of promising the reader more sales, revenue or orders; drop the claim even if it is hedged with "can" or "could".
    decide: 'The text never says or suggests that the reader''s own business will, can, could or may get more sales, more revenue, more orders, more income or more profit, or a better sales season, and never guarantees the reader a business result. A softened claim ("could", "can help", "designed to") still counts as suggesting it. Plainly stating what a feature does or what a plan costs (for example that it takes orders, sells gift cards, sends emails, has a price, a discount, a free trial or a money-back guarantee) does not count. A text that is not marketing for a product passes.'
  - id: no-customer-or-growth-outcome
    description: The copy does not promise or imply more customers, loyalty, conversions or growth for the reader.
    error: Say what the feature does instead of promising the reader more customers, repeat buyers, conversions or growth; drop the claim even if it is hedged with "can" or "could".
    decide: 'The text never says or suggests that the reader''s own business will, can, could or may gain customers, win more repeat or loyal customers, turn more visitors into buyers, or grow as a business. A softened claim ("could", "can help", "designed to") still counts as suggesting it. Plainly stating what a feature does (for example that it collects email addresses, sends a reminder or lists events) does not count, and neither does the name of a plan or product. A text that is not marketing for a product passes.'
