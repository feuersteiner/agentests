version: 1
id: subject-lines-tell-dont-sell
title: Subject lines tell, don't sell
description: Every subject line and preview text of an email under emails/, options included, names what the email contains, without hype, teasing or pressure, and names nothing the body does not hold.
select:
  glob: 'emails/**/*.md'
  grep: '[Ss]ubject|SUBJECT|[Pp]reheader|PREHEADER|[Pp]review|PREVIEW'
assert:
  - id: names-the-contents
    description: Each subject line and preview text says what the email is about instead of keeping it back to make the reader curious.
    error: Say in the subject line and the preview text what the email contains, such as the features, the event and its date or the change, instead of a teaser.
    decide: 'Every subject line and every preview text in the text says what the email contains. Subject lines are the email''s subject, often a "subject:" field in the front matter, and every subject line listed as an option, wherever the list is; the preview text is the preheader, often a "preheader:" field. Judge each line on its own, as a reader who sees only that line would: it has to state the email''s actual topic or contents, such as the new features, the event and its date, the plans or prices that change, or what the reader needs to do. A line that only hints at the topic, asks the reader a question instead of stating the contents, or invites the reader to open or read on breaks this condition, for example "Big news inside", "Something is coming", "You won''t believe this", "Guess what''s new?" or "Open to find out more". One such line breaks this condition even when every other line is descriptive: one teasing option among several, or a teasing preview text under a descriptive subject. A text with no subject line and no preview text meets this condition.'
  - id: no-hype-or-pressure
    description: No subject line or preview text hypes, promises a result or pushes the reader to act.
    error: Remove the hype, the promised result or the push to act from the subject line or the preview text, and state the email's contents plainly instead.
    decide: 'Judge only the subject lines and the preview text of the email, never its body. Subject lines are the email''s subject, often a "subject:" field in the front matter, and every subject line listed as an option, wherever the list is; the preview text is the preheader, often a "preheader:" field. Everything else in the text, including hype, promises or pushes to act in the body of the email, is ignored and does not break this condition. Condition: none of these lines, each judged on its own, sells or pushes instead of describing. None of them hypes the news or the product, whether with praise ("game-changing", "Our biggest update yet"), with excitement ("Finally!", "This changes everything") or by telling the reader how they will feel about it or how much they have wanted it ("You''ll love this"); none promises the reader a result ("Never lose a sale again", "Double your revenue", "Get more opens"); and none pushes the reader to act now ("Don''t miss out", "Last chance", "Hurry", "Act now", "Before it''s too late"). These do not break this condition: naming a feature, an event, a plan or a price; a date, a price or a deadline stated as a fact, such as the date by which the reader can register, reply or renew; a plain label naming the kind of email, such as "New:", "Invitation:" or "Reminder:", before the contents. One such line among several options breaks this condition. A text with no subject line and no preview text meets this condition.'
  - id: matches-the-body
    description: Nothing a subject line or preview text names is missing from the email's body or contradicts it.
    error: The subject line or the preview text names something the email does not contain; describe only what the body holds.
    decide: 'Every subject line and every preview text in the text, each judged on its own, names only things that the body of the email contains. Subject lines are the email''s subject, often a "subject:" field in the front matter, and every subject line listed as an option, wherever the list is; the preview text is the preheader, often a "preheader:" field. The condition breaks when one of them names a feature, an offer, a discount, a gift, an event or a price that the body does not mention at all, or gives a date or a price that differs from the one in the body. Wording that summarises or paraphrases the body meets this condition, and so does a line that names only part of what the body holds. A text with no subject line and no preview text meets this condition.'
