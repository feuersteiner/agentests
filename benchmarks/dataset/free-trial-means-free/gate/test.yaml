version: 1
id: free-trial-means-free
title: Free trial means free
description: Inkwell Studio pages, ads and emails never call the paid Pro plan, or trying it, free or a free trial, and never say the customer starts without paying; the 30 days are a money-back guarantee.
select:
  glob: ['content/**/*.md', 'emails/**/*.md']
assert:
  - id: pro-not-called-free
    description: Pro, or trying it, is never called free, a free trial or a risk-free trial.
    error: Pro is charged upfront, so do not call it free or a free trial; describe it as a paid plan with a 30-day money-back guarantee.
    grep: '[Ff]ree(?!lanc)|FREE(?!LANC)|[Tt]rial|TRIAL|[Gg]ratis|[Cc]omplimentary'
    decide:
      - 'The text names a company other than Inkwell Studio as the seller or the sender of the copy, and never mentions Inkwell Studio. A design tool, an ad network or a social network where the copy is shown is not the seller.'
      - 'Inkwell Studio, a subscription library of design assets, has one plan, Pro: £12 a month, charged on the day the customer subscribes, and the customer can ask for that first payment back within 30 days. Pro has no free trial. Condition: the text never calls Pro, a subscription to Inkwell Studio, or a period of trying or using it free: no "free trial", "try free", "try it free", "start free", "start for free", "free for 30 days", "first month free", "risk-free trial" or similar wording for it, anywhere, including headings, headlines, buttons and front matter, even when another sentence or a footnote then explains the charge or the refund. These do not break the condition: a refund or money-back guarantee described as a refund; inviting the reader to try Pro for 30 days without the word "free"; saying that creating an account or browsing previews is free; and "free" in another sense, such as "royalty-free" or "feel free".'
  - id: no-start-without-paying
    description: Nothing says or implies that the customer starts, tries or uses Pro before being charged.
    error: Pro is charged on the day the customer subscribes; remove the wording that says they start without paying and state the price with the 30-day refund.
    grep: '[Cc]harge|CHARGE|[Cc]ard\b|CARD|[Pp]a(y|ys|ying|yment|yments|id)\b|PAY|[Oo]n us\b|ON US|[Oo]n the house|[Bb]efore you (buy|subscribe|commit|decide|pay)|BEFORE YOU|£0|[Nn]o cost|[Cc]osts? nothing|[Cc]ost you nothing|[Nn]othing|[Zz]ero|[Uu]pfront|[Uu]p front|[Bb]illed|[Bb]illing|[Uu]ntil|[Tt]hen (it''s |it is |just |only )?£|[Aa]fter (that|which|the first|the trial|your trial|30|thirty)'
    decide:
      - 'The text names a company other than Inkwell Studio as the seller or the sender of the copy, and never mentions Inkwell Studio. A design tool, an ad network or a social network where the copy is shown is not the seller.'
      - 'Inkwell Studio, a subscription library of design assets, has one plan, Pro: £12 a month, and the customer is charged on the day they subscribe; within 30 days of that first payment they can ask for a full refund. Condition: the text never says or implies that a customer can start, try or use Pro before being charged or without paying, or that payment starts only after a first period of use (for example a period of use followed by "then" and the price, or a price that applies "after the first month"). Examples that break the condition: "no payment today", "no card required", "pay nothing for 30 days", "you will not be charged until day 31", "your first month is on us", "try before you buy". These do not break the condition: stating the price and that it is charged when the customer subscribes; a refund or money-back guarantee described as getting a payment back; saying that the customer can cancel; and saying that creating an account or browsing previews costs nothing.'
