version: 1
id: balanced-investment-promotions
title: Balanced investment promotions
description: Promotions for investments say in their main copy, beside the claims of returns or growth and in every piece shown on its own, that the value can fall and the reader could get back less, with a past-performance warning beside any past return figure.
select:
  glob: ['content/**/*.md', 'emails/**/*.md']
  grep: '[Ii]nvest|\bISAs?\b|\b[Ff]unds?\b|[Pp]ortfolio|\b[Ss]hares\b|\bETFs?\b|[Cc]apital at risk'
assert:
  - id: risk-in-main-copy
    description: Every promotion of an investment, and every piece of it shown on its own, says in its main copy that the value can fall and the reader could get back less than they put in.
    error: 'In the main copy of each piece that promotes the investment, say in plain words that its value can fall as well as rise, so the reader could get back less than they put in. A footnote, an asterisked note, small print or a bare "Capital at risk" label is not enough, and each ad, push notification or in-app card needs its own.'
    decide:
      - 'Each piece of the text that encourages the reader to invest says in its own main text that the investment''s value can fall (or go down as well as up) or that the reader could get back less than they put in; either wording is enough. Each ad, social post, push notification or in-app card is a separate piece, usually under its own heading, and needs its own statement; a page or an email is one piece. These are not enough: a statement only in another piece, a footnote, a note after an asterisk, small print, a line after the sign-off, or a bare label such as "Capital at risk" or "Your capital is at risk" that does not say what can happen.'
      - 'The text is not a promotion of an investment: it does not invite or encourage the reader to put money into shares, a fund, a stocks and shares ISA or another investment whose value goes up and down, and it does not describe the advantages of one. Help or service content that explains how to do something with an account, such as the steps of a process, is not a promotion. A cash savings account is not an investment, and neither is software, a subscription plan, a donation or any other product that does not invest the reader''s money.'
  - id: past-performance-warning
    description: Every past return figure of an investment has, beside it in the main copy, a warning that past performance is not a reliable guide to future returns.
    error: 'Beside every past return figure, in the same section or piece and in the main copy, say that past performance is not a reliable guide to future returns.'
    grep: '\d\s?%|[Pp]er ?cent|[Dd]oubled|[Tt]ripled|[Ww]orth|[Gg]rew|[Rr]eturned|[Gg]ained|[Uu]p \d'
    decide: 'Every figure in the text for how an investment has performed in the past, such as a percentage or an amount it returned, grew or gained over a past period ("returned 35% over three years", "up 8% last year", "£1,000 invested ten years ago would be worth £2,100 today"), has in the same section a sentence of the main copy saying that past performance is not a reliable guide to future returns, or the same idea in other words, such as "past returns do not predict future ones" or "what a fund did before does not tell you what it will do next". A section is a heading with the text under it up to the next heading; in a text without headings it is the whole text, and in a text of pieces shown separately, such as ads, a push notification and an in-app card, it is each piece. A footnote, a note after an asterisk, small print or a line after the sign-off does not count. These are not past performance figures of an investment: the interest rate of a cash savings account, fees and charges, an allowance, prices, and figures about a business that is not an investment. A text with no past performance figure of an investment meets the condition.'
  - id: risk-under-growth-headings
    description: A heading that claims an investment grows or earns money has the statement that the value can fall, or that the reader could get back less, in the text under it.
    error: 'Put the statement that the value can fall and the reader could get back less in the text right under each heading that claims growth or returns, before the next heading, not only further down the page or in another piece.'
    decide: 'No heading in the text claims that an investment will, could or did grow, earn or return money unless the text under that heading, up to the next heading, says in its main copy that the investment''s value can fall (or go down as well as up) or that the reader could get back less than they put in. A heading is a Markdown heading (a line starting with #), the title of a push notification, the heading of an in-app card, or an email''s subject line; under a subject line, the text is the whole email. Headings such as "Build your wealth", "Outpace inflation" or "Up 20% in a year" claim growth; headings that only name a product, a feature, its fees, its holdings, an allowance, a tax rule or the interest on cash savings do not. A heading about anything other than an investment, such as growing a business, is not such a claim. These do not count as the risk statement: a footnote, small print, a bare label such as "Capital at risk", or a risk sentence under a different heading. A text with no heading that claims an investment grows or earns money meets the condition.'
