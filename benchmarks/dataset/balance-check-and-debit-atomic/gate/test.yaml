version: 1
id: balance-check-and-debit-atomic
title: The check and the decrement are one atomic operation
description: In the app modules, a check that enough credit, stock or uses remain and the write that uses them up are one conditional UPDATE whose row count is acted on, or a read and a write inside one locking transaction.
select:
  glob: 'app/*.py'
  grep: '[Cc]redit|[Bb]alance|[Ss]tock|times_used|usage_limit|used_at|used_by|[Rr]edeem|[Vv]oucher|[Qq]uota'
assert:
  - id: amount-check-and-debit-atomic
    description: Credit, a balance or a stock count is lowered in the same statement that checks enough is available, or under a lock taken before the read.
    error: Put the check in the WHERE of the UPDATE that lowers the amount (AND credit_cents >= ?) and act on its rowcount, or read and write inside one `with db.transaction(immediate=True):` block.
    grep: '[Cc]redit|[Bb]alance|[Ss]tock|[Qq]uota'
    decide: 'This Python module runs SQL on SQLite. Wherever the code lowers a user''s credit, a balance or a stock count after checking that enough is available, the check and the decrease happen atomically, in one of two ways: (a) the check is written into the `WHERE` clause of the same `UPDATE` statement that lowers the amount, such as `UPDATE users SET credit_cents = credit_cents - ? WHERE id = ? AND credit_cents >= ?`; or (b) the read of the amount, the check and the write all happen inside one `with db.transaction(immediate=True):` block, with the read placed after the `with` line, or inside one transaction begun with `BEGIN IMMEDIATE` or locked with `SELECT ... FOR UPDATE` before the read. It breaks this to read the amount first (with a `SELECT` or a helper such as `models.get_user(...)`), compare it in Python and then lower it with a separate `UPDATE` that lacks the check in its `WHERE`: even when both are inside a plain `with db.transaction():` block, even when that `UPDATE` subtracts from the column (`credit_cents = credit_cents - ?`), and even when only the `UPDATE` is inside a `with db.transaction(immediate=True):` block and the read was made before it. A Python comparison that is repeated in the `WHERE` of the `UPDATE` as in (a) is fine. Code that only adds to an amount, or only reads it, passes.'
  - id: use-check-and-count-atomic
    description: A coupon use is counted, or a single-use gift card marked used, in the same statement that checks a use is left, or under a lock taken before the read.
    error: Put the check in the WHERE of the UPDATE (AND times_used < usage_limit, AND used_at IS NULL) and act on its rowcount, or read and write inside one `with db.transaction(immediate=True):` block.
    grep: 'usage_limit|max_uses|uses_left|used_at|used_by|is_used|\bused\b|[Rr]edeem|[Vv]oucher'
    decide: 'This Python module runs SQL on SQLite. Wherever the code uses up one of a limited number of uses after checking that a use is left, such as adding one to a coupon''s `times_used` after checking it against `usage_limit`, or marking a gift card or voucher as used after checking that it is still unused, the check and the write happen atomically, in one of two ways: (a) the check is written into the `WHERE` clause of the same `UPDATE` statement, such as `... SET times_used = times_used + 1 WHERE code = ? AND (usage_limit IS NULL OR times_used < usage_limit)` or `... SET used_at = ? WHERE code = ? AND used_at IS NULL`; or (b) the read, the check and the write all happen inside one `with db.transaction(immediate=True):` block, with the read placed after the `with` line, or inside one transaction begun with `BEGIN IMMEDIATE` or locked with `SELECT ... FOR UPDATE` before the read. It breaks this to read the coupon or card first (with a `SELECT` or a helper such as `models.get_coupon(...)` or `models.get_gift_card(...)`), check its uses in Python and then run a separate `UPDATE` that lacks the check in its `WHERE`: even when both are inside a plain `with db.transaction():` block, and even when only the `UPDATE` is inside a `with db.transaction(immediate=True):` block and the read was made before it. A Python check that is repeated in the `WHERE` of the `UPDATE` as in (a) is fine. Counting a use or marking an item used with no check of the uses left, and checks of other things such as an expiry date, pass.'
  - id: conditional-update-outcome-checked
    description: The outcome of an UPDATE that holds a check of what is left is acted on.
    error: Read the cursor's rowcount after the conditional UPDATE and raise when it is 0, so nothing that depends on it goes through.
    grep: '\b(WHERE|AND|OR|where)\b[^\n]*?(>=|<=|<|>|\bIS NULL\b|\bis null\b)'
    decide: 'Every SQL `UPDATE` statement in this module whose `WHERE` clause checks how much is left, such as `credit_cents >= ?`, `stock >= ?`, `times_used < usage_limit` or `used_at IS NULL`, has its outcome checked: the code reads that statement''s `rowcount` (or the row its `RETURNING` clause gives back) and stops, for example by raising, when no row was changed. An `UPDATE` whose `WHERE` clause only matches an id or a code passes.'
