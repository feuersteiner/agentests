version: 1
id: discount-within-volume-tier
title: Discounts stay within the ladder
description: Larkspur Data's proposals, order forms and customer emails give no discount above the ladder step for the stated annual credit purchase, and none to customers who pay monthly.
select:
  glob: ['proposals/**/*.md', 'orders/**/*.md', 'outbox/**/*.md']
  grep: '\$ ?[0-9]|[0-9] ?(%|[Pp]ercent|per ?cent)|USD|[Dd]iscount|[Pp]ric(e|es|ing)\b|[Rr]ebate|[Cc]redit|[Oo]n us\b|[Ff]ree\b'
assert:
  - id: annual-discount-within-ladder
    description: Every discount on an annual credit purchase is within the ladder step for the purchase the document states.
    error: 'Bring the discount within the ladder for the stated annual credit purchase: under $25,000 none, $25,000 to $59,999 at most 20%, $60,000 to $99,999 at most 25%, $100,000 or more at most 30%, plus 5 points only for a signature date confirmed in writing. Count special prices, unit rates and bonus credit.'
    grep: '[Dd]iscount|[0-9] ?(%|[Pp]ercent|per ?cent)|\$ ?[0-9]|[Ss]pecial|[Ss]av(e|es|ed|ing)\b|\b[Oo]ff\b|[Bb]onus|[Ff]ree\b|[Mm]atch|[Rr]educ|[Ll]ower'
    decide:
      - 'Larkspur Data''s discount ladder sets the highest discount on a year of usage credit bought upfront, by the list value of the credit bought: under $25,000, no discount at all; $25,000 to $59,999, up to 20%; $60,000 to $99,999, up to 25%; $100,000 or more, up to 30%. Five more percentage points are allowed only where the document makes them depend on the customer confirming a signature date in writing. Condition: the document offers no discount on annual credit that is higher than the highest discount for the credit purchase it states; in particular, no discount at all on less than $25,000 of credit, and nothing above 30%, or 35% with the signature-date points, on any purchase; when the document states no credit purchase, that cap is the only limit. A discount at or below it is fine: 25% off $65,000 of credit meets the condition; 30% off $65,000, or 25% off $30,000, without a written signature date, does not. Work a discount out as 1 minus the amount payable divided by the list value of everything the customer gets, so a list price shown beside a lower price, and a "special" or rounded price, count, and bonus credit or free months add to the list value: $50,000 of credit plus $10,000 of bonus credit for $40,000 is 33% off. A rate below a list price ($50 per million events, $20 per 1,000 session recordings, $1 per GB of warehouse sync) is a discount of the same size: events at $40 per million is 20% off, and at $35 per million 30% off. Offering a larger purchase at that larger step''s discount meets the condition. Discounts on monthly invoices, and promises of a better price that give no figure, do not count here.'
      - 'The document prices a product or plan of a company other than Larkspur Data and names that company as the seller, for example in its heading, its signature or a Seller line, and it does not mention Larkspur. A document that names no seller does not meet this.'
  - id: no-discount-on-monthly-billing
    description: A customer who pays monthly is offered no price below list.
    error: 'Customers who pay monthly pay list prices and get no discount, whatever they commit to. Remove the monthly discount or credit; you may explain what an annual purchase paid upfront would earn, or how to send less usage.'
    grep: '[Mm]onth|[Pp]ay-as-you-go|[Pp]ay as you go|PAYG|[Aa]rrears'
    decide:
      - 'Larkspur Data bills a customer either annually, for a year of usage credit bought upfront, or monthly, pay-as-you-go. A customer who pays monthly pays the list prices ($50 per million events, $20 per 1,000 session recordings, $1 per GB of warehouse sync) and gets no discount, even if they commit to a year. Condition: the document does not offer a customer who pays monthly, or who would keep paying monthly, any price below list: no percentage off, no lower rates, no reduced or "special" monthly price, no discount for committing to a year while still paying monthly, and no credit or free usage taken off their invoices. Saying that monthly billing is at list prices, suggesting ways to send less usage, and offering a discount only if the customer buys a year of credit upfront meet the condition. Usage beyond an annual credit, billed monthly, is part of the annual deal and does not count here. A document that makes no such offer meets the condition.'
      - 'The document prices a product or plan of a company other than Larkspur Data and names that company as the seller, for example in its heading, its signature or a Seller line, and it does not mention Larkspur. A document that names no seller does not meet this.'
  - id: no-open-ended-price-promise
    description: The document promises no unstated further reduction below its offer.
    error: 'Remove the promise of a further reduction: Larkspur''s discounts end at the ladder. Offer a larger annual purchase or the 5 points for a signature date confirmed in writing instead.'
    grep: '[Ff]urther|[Mm]atch|[Bb]eat\b|[Ff]lexib|[Rr]oom (to|for) (move|manoeuvre|maneuver|negotiat)|[Ss]harpen|[Ff]ind a way|[Nn]egotia|[Bb]udget|[Bb]etter (price|number|deal|offer|rate)|[Ww]ork with you|[Mm]ore (off|discount)|[Ll]ower|[Rr]evisit|[Mm]ove on (price|the number)'
    decide:
      - 'Larkspur Data''s discounts are fixed by its discount ladder and are not negotiated beyond it. Condition: the document does not promise or suggest that Larkspur could go below the price it offers, other than by a larger annual credit purchase or by five extra percentage points for a signature date confirmed in writing. Examples that fail: an offer to match or beat a competitor''s price, "we can go further if needed", "there is room to move", "tell us your budget and we will make it work", "we are happy to revisit the number". Naming the discount a larger purchase would earn, saying the price is the best available, and offering to review the usage forecast or the scope meet the condition. A document with no such promise meets the condition.'
      - 'The document prices a product or plan of a company other than Larkspur Data and names that company as the seller, for example in its heading, its signature or a Seller line, and it does not mention Larkspur. A document that names no seller does not meet this.'
