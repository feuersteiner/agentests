version: 1
id: single-named-owner-per-goal
title: One named owner per goal
description: In a quarterly plan or its template, every objective and every item to ship has exactly one named person as owner, not a team, two people, TBD or shared.
select:
  glob: ['teams/**/*.md', 'planning/**/*.md']
  grep: '[Oo]bjective|[Gg]oals?\b|OKR|[Kk]ey [Rr]esults?|[Qq]uarter|\bQ[1-4]\b|[Oo]wner|\b[Ss]hip\b|[Dd]eliverable'
assert:
  - id: one-named-owner-per-objective
    description: Every objective in the plan has exactly one named person as owner.
    error: 'Name exactly one person as the owner of each objective: not a team, not two people, not TBD or shared. Others can be listed as helping.'
    decide:
      - 'Condition: every objective that the text sets out for a team has exactly one named person as its owner. Objectives may also be called goals, OKRs or priorities, and draft or proposed objectives count. A plan template sets out objectives through its sections and placeholders, so it counts too. An objective fails when no owner is given for it; when its owner is a team, group or function, such as "Data team" or "Design"; when two or more people are its owners, such as two names joined by "and", "&", "/" or a comma, or co-owners or joint leads; or when its owner is "TBD", "shared", "the team" or left open. A first name alone is enough. One owner with other people marked as helping, supporting or contributing passes: a name followed by "with", "helping", "with help from" or "supported by" and more names is one owner with helpers. In a template, the owner placeholder must ask for one person''s name, such as "Owner: <name>"; a placeholder that allows several people or a team, such as "Owner(s)", "<names>" or "<name or team>", fails. Ideas in a brainstorm credited to the people who suggested them are not objectives.'
      - 'Condition: the text is not a team''s plan and not a plan template. A plan sets out, as the team''s own commitment for a coming quarter or period, the objectives the team will pursue or the items it will build and ship; a draft plan is still a plan, and a template for quarterly goals or a quarterly plan counts as a plan. These are not plans: a retrospective that reports how past objectives went or what was shipped, a brainstorm that lists ideas and who suggested them, a page that lists a team''s people, and a memo that proposes options or changes for someone to decide on. A goal that a text only mentions as the reason for its proposals does not make it a plan. A text that contains a section setting out a team''s plan is a plan.'
  - id: one-named-owner-per-item-to-ship
    description: Every item the plan says the team will ship has exactly one named person as owner, next to the item.
    error: 'Name exactly one person next to each item to ship: not a team, not two people, not TBD or shared, and not left to the owner of the objective. Others can be listed as helping.'
    decide:
      - 'Condition: every item that the text says the team will ship has exactly one named person as its owner, named next to the item. Items to ship are the deliverables, features or pieces of work that a plan or plan template lists for the team to build, launch or release, often under an objective as "What we''ll ship" or as initiatives; measures, targets and key results that are numbers to reach are not items. An item fails when no owner is named next to it, even when its objective has an owner; when its owner is a team, group or function; when two or more people own it, such as two names joined by "and", "&", "+", "/" or a comma; or when its owner is "TBD", "shared", "the team", whoever picks it up or left open. A first name alone is enough. One owner with other people marked as helping, supporting or contributing passes: a name followed by "with", "helping", "with help from" or "supported by" and more names is one owner with helpers. In a template, each item line must carry a placeholder for one person''s name, such as "<item>: <name>"; an item line with no owner placeholder, or with one that allows several people or a team, fails. Ideas in a brainstorm credited to the people who suggested them are not items to ship.'
      - 'Condition: the text is not a team''s plan and not a plan template. A plan sets out, as the team''s own commitment for a coming quarter or period, the objectives the team will pursue or the items it will build and ship; a draft plan is still a plan, and a template for quarterly goals or a quarterly plan counts as a plan. These are not plans: a retrospective that reports how past objectives went or what was shipped, a brainstorm that lists ideas and who suggested them, a page that lists a team''s people, and a memo that proposes options or changes for someone to decide on. A goal that a text only mentions as the reason for its proposals does not make it a plan. A text that contains a section setting out a team''s plan is a plan.'
