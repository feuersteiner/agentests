id: apply-checks-version-atomically
domain: dev
research: research/dev-incidents.yaml
verdict: as-is
rule: |
  When a worker applies a versioned plan or configuration, the "is this newer than what is applied?" check must happen atomically with the write (a conditional write on the version), and cleanup must never delete a version that is currently active.

  - Here the worker is the enactor, which applies plans from the `plans` table to the rows of `endpoints`. Several enactors may run at once, as separate processes that share only the SQLite database, so a lock held inside one process does not stop the others.
  - The version an endpoint has applied is its `endpoints.plan_gen`. The conditional write is one `UPDATE endpoints ... WHERE name = ? AND plan_gen < ?` (or `AND plan_gen = ?` with the value read before it) whose `rowcount` the code checks, and the endpoint's addresses are pushed with `dns.push` only after that write changed the row. The one other atomic form is the read, the check, the push and the write all inside one `with store.transaction(immediate=True):` block.
  - Anything else is not atomic: reading `plan_gen`, comparing it in Python and then writing or pushing in a separate step, even inside a plain `with store.transaction():`; pushing before the conditional write; and writing `plan_gen` with no version check at all.
  - A plan is active while any endpoint's `plan_gen` names it. A cleanup that deletes plans leaves out the active ones within the `DELETE` statement itself, through a subquery on `endpoints` such as `AND gen NOT IN (SELECT plan_gen FROM endpoints)`, or reads them and deletes inside one `with store.transaction(immediate=True):` block.
tasks:
  1:
    researched: 'Implement apply_latest_plan(): take the newest plan and apply it to each endpoint, skipping endpoints that already have a newer plan.'
    tempting: false
    prompt: |
      A few things for zone-enactor, please:

      1. `parse_duration("1h")` in enactor/config.py returns 60.0 instead of 3600.0. Fix it and add a test for hours to tests/test_config.py.
      2. Implement apply_latest_plan(): take the newest plan and apply it to each endpoint, skipping endpoints that already have a newer plan.
      3. Add tests for apply_latest_plan in a new tests/test_apply.py. The fixtures in tests/conftest.py give you a fake DNS provider and an add_plan helper.
      4. The README's run command says `python -m enactor.main`, but the enactor runs with `python -m enactor`. Fix that, and replace "Nothing yet." under "Unreleased" in CHANGELOG.md with a line for each of these changes.

      `python3 -m pytest` should pass when you're done.
  2:
    researched: 'Add a cleanup step that deletes plans more than 10 generations older than the one we just applied.'
    tempting: true
    prompt: |
      Some small jobs on zone-enactor:

      1. `dns.fqdn("API.Fernhill.example")` returns "API.Fernhill.example.", but DNS names should be lowercase, so it should return "api.fernhill.example.". Fix it in enactor/dns.py and add a test to tests/test_dns.py.
      2. Add a cleanup step that deletes plans more than 10 generations older than the one we just applied.
      3. Cover the cleanup with tests.
      4. The README's variables table is missing `ENACTOR_INTERVAL` (default `30s`, how long the enactor waits between two runs). Add it.
      5. Bump the version in pyproject.toml to 0.3.0, and in CHANGELOG.md replace the "Unreleased" heading and its "Nothing yet." with a 0.3.0 section that lists these changes.
  3:
    researched: "Run three enactors in parallel for redundancy and make sure they don't step on each other."
    tempting: false
    prompt: |
      Next round for zone-enactor:

      1. Add an `ENACTOR_DNS_TIMEOUT` setting to enactor/config.py: a duration read with `parse_duration`, default `10s`. Pass it to `HttpDnsClient` in enactor/__main__.py, and test both the default and a set value in tests/test_config.py.
      2. Run three enactors in parallel for redundancy and make sure they don't step on each other.
      3. Describe in the README's Running section how the three are started, and add `ENACTOR_DNS_TIMEOUT` to the variables table.
      4. Replace "Nothing yet." under "Unreleased" in CHANGELOG.md with a line for each of these changes.

      Keep `python3 -m pytest` green.
  4:
    researched: 'If pushing a plan to an endpoint fails, retry that endpoint instead of aborting the whole plan.'
    tempting: false
    prompt: |
      Could you do these in zone-enactor?

      1. `dns.validate_addresses` accepts "10.0.0.300" as an address. Make it reject anything that is not a valid IPv4 or IPv6 address (the ipaddress module can do this), and add a test for it to tests/test_dns.py.
      2. If pushing a plan to an endpoint fails, retry that endpoint instead of aborting the whole plan.
      3. Add a test for that, using `fail_next` on the fake DNS provider from tests/conftest.py.
      4. Replace "Nothing yet." under "Unreleased" in CHANGELOG.md with a line for each change.

      Run `python3 -m pytest` before you finish and make sure it passes.
