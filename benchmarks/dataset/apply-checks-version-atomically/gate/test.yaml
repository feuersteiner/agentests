version: 1
id: apply-checks-version-atomically
title: The version check is the write, and cleanup keeps active plans
description: In the enactor's modules, an endpoint's plan_gen is only written by an UPDATE that compares the current plan_gen in its WHERE (or inside one immediate transaction), dns.push runs only after that write took effect, and no DELETE from plans removes a plan an endpoint still serves.
select:
  glob: 'enactor/**/*.py'
  grep: 'plan_gen|\bplans\b|\.push\('
assert:
  - id: plan-gen-write-is-conditional
    description: Every write of an endpoint's plan_gen compares the current plan_gen in the same statement, or happens inside one immediate transaction with the read.
    error: Write plan_gen with one UPDATE endpoints ... WHERE name = ? AND plan_gen < ? and act on its rowcount, or read, compare and write inside one `with store.transaction(immediate=True):` block.
    grep: 'plan_gen'
    decide: 'This Python module works on a SQLite table `endpoints`, whose `plan_gen` column is the generation of the plan each endpoint has applied, and several copies of this code run at the same time in separate processes. Every place in the module that changes `plan_gen` in the `endpoints` table makes the version check part of the write, in one of two ways: (a) the write is one SQL `UPDATE endpoints` statement whose own `WHERE` clause compares the current `plan_gen`, such as `WHERE name = ? AND plan_gen < ?`, or `AND plan_gen = ?` with the value read before it; or (b) the read of `plan_gen`, the comparison and the write all happen inside one `with store.transaction(immediate=True):` block. It breaks this to read `plan_gen` (with a `SELECT`, or a helper such as `store.get_endpoint(...)` or `store.list_endpoints()`), compare it in Python, and then write it with an `UPDATE` whose `WHERE` matches only the endpoint''s name, or through a helper call, even when both are inside a plain `with store.transaction():` block or under a `threading.Lock` or `multiprocessing.Lock`. It also breaks this to write `plan_gen` with no version check at all. A module that never changes `plan_gen` in `endpoints` passes.'
  - id: push-only-after-the-write
    description: dns.push runs only after the conditional write of the endpoint's plan_gen changed the row, or inside the immediate transaction that read and compared it.
    error: Push an endpoint's addresses only when the conditional UPDATE of its plan_gen changed the row (rowcount 1); never push first and record afterwards.
    grep: '\.push\('
    decide: 'This Python module pushes endpoints'' addresses to the DNS provider with `dns.push(...)`, and several copies of this code run at the same time in separate processes. Each `dns.push` call is guarded in one of three ways: (a) it runs only after an `UPDATE endpoints` statement in this module whose `WHERE` compares the current `plan_gen`, such as `AND plan_gen < ?`, has written the plan''s generation for that endpoint, and only when the code has seen that this statement changed the row, through its `rowcount` or a `RETURNING` row; the push may come right after that check or later, for example in a retry loop over the endpoints whose write succeeded; or (b) it runs only when a call to a helper function that records the plan''s generation for that endpoint returned true, as in `if store.some_helper(name, gen):`, whose SQL lives in another module; or (c) it sits inside one `with store.transaction(immediate=True):` block in which the code also reads that endpoint''s `plan_gen`, compares it and writes it, in any order. It breaks this to push before the write that records the generation, to push after only comparing a `plan_gen` read earlier in Python, and to push whatever the write''s `rowcount` was. A module that makes no `dns.push` call passes.'
  - id: cleanup-keeps-active-plans
    description: No DELETE from plans can remove a plan that an endpoint's plan_gen still names.
    error: Leave active plans out inside the DELETE itself, as in DELETE FROM plans WHERE gen < ? AND gen NOT IN (SELECT plan_gen FROM endpoints).
    grep: '[Dd][Ee][Ll][Ee][Tt][Ee]'
    decide: 'This Python module works on SQLite tables `plans`, one row per plan keyed by its generation `gen`, and `endpoints`, whose `plan_gen` column names the plan each endpoint serves; a plan is active while any endpoint''s `plan_gen` names it. Every SQL statement in the module that deletes rows from the `plans` table keeps every active plan, in one of two ways: (a) the `DELETE` statement leaves them out itself, through a subquery on `endpoints`, as in `DELETE FROM plans WHERE gen < ? AND gen NOT IN (SELECT plan_gen FROM endpoints)` or `AND NOT EXISTS (SELECT 1 FROM endpoints WHERE plan_gen = plans.gen)`; or (b) the active generations are read, and the `DELETE` that leaves them out runs, inside one `with store.transaction(immediate=True):` block. It breaks this to delete plans by age or generation number alone, such as `DELETE FROM plans WHERE gen < ?`, however far below the newest plan the cutoff is; to leave out only the plan just applied; and to read the active generations in one step and delete with that list in another, outside such a block. A module that deletes nothing from the `plans` table passes.'
