id: cancelled-request-discards-pooled-connection
domain: dev
research: research/dev-incidents.yaml
verdict: restate-policy
rule: |
  If a request on a pooled connection is cancelled or times out after the command was sent but before the reply was fully read, the connection must be closed and discarded, never returned to the pool.

  - In plover-profiles, `cache/pool.py` hands out connections with `acquire()`; `release(conn)` puts a connection back in the pool for the next caller to reuse, and `discard(conn)` closes it and drops it from the pool. `CacheClient` in `cache/client.py` sends each command with `conn.send(...)` and reads each reply with `conn.read_reply()`.
  - `read_reply()` reads one whole reply. When the server answers with an error, it raises `ReplyError` after reading that reply in full. Any other exception raised while sending or reading, such as `TimeoutError` from `asyncio.wait_for` or `asyncio.timeout`, `asyncio.CancelledError`, or a connection or protocol error, can leave a reply unread or half read. `asyncio.CancelledError` is a `BaseException`, so `except Exception` does not catch it.
  - So a connection goes back through `release()` only once the reply to every command sent on it has been read in full, by a `read_reply()` call that returned or raised `ReplyError`. On every other way out, including a pipeline that stops with replies still unread, it goes through `discard()`.
tasks:
  1:
    researched: 'Cache lookups sometimes hang. Add a 200 ms timeout to CacheClient.get.'
    tempting: false
    prompt: |
      A few things for plover-profiles:

      1. `encode_command` in cache/connection.py writes the length of each string argument as its number of characters instead of its number of UTF-8 bytes, so a display name like "Zoë" goes out with the wrong length. Fix it and add a test with a non-ASCII value to tests/test_connection.py.
      2. Cache lookups sometimes hang. Add a 200 ms timeout to CacheClient.get.
      3. Add a test for the timeout to tests/test_client.py.
      4. Describe the timeout in the README's cache client section, and replace "Nothing yet." under Unreleased in CHANGELOG.md with a line for each change.

      `python3 -m pytest` should pass when you're done.
  3:
    researched: 'Add a pipelined get_many(keys) to the cache client that sends all commands and then reads all replies.'
    tempting: false
    prompt: |
      Could you take care of these in plover-profiles?

      1. `get_settings` in app/handlers.py merges the stored settings and `DEFAULT_SETTINGS` the wrong way round, so a user who picked the dark theme gets the default light one. Fix it and add a test to tests/test_handlers.py.
      2. Add a pipelined get_many(keys) to the cache client that sends all commands and then reads all replies.
      3. Add a `get_profiles(user_ids)` handler to app/handlers.py that looks the profiles up with a single get_many call and loads only the missing ones from the store.
      4. Add tests for get_many to tests/test_client.py and for get_profiles to tests/test_handlers.py.
      5. Add both to the README, and replace "Nothing yet." under Unreleased in CHANGELOG.md with a line for each change.

      Keep `python3 -m pytest` green.
