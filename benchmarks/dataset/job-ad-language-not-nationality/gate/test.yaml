version: 1
id: job-ad-language-not-nationality
title: Language skill, not nationality, in job adverts
description: Job adverts, job posts and advert templates ask for the level of language skill the job needs, never a nationality, an origin or native-speaker status.
select:
  glob: ['hiring/adverts/**/*.md', 'hiring/social/**/*.md']
  grep: '[Nn]ative|NATIVE|[Mm]other[- ]?tongue|[Ff]irst[- ]language|[Mm]uttersprach|[Ll]angue maternelle|[Nn]ational|[Cc]itizen|[Pp]assport|[Oo]rigin|[Ee]thnic|[Hh]eritage|[Dd]escent|[Bb]orn\b|[Gg]r[eo]wn? up|[Rr]aised|[Ll]ocal|[Ll]anguage|[Ss]peak|[Ff]luen|[Bb]ilingual|[Ll]ingu|CEFR|\b[ABC][12]\b|German|French|France|English|Brit|Irish|Scot|Welsh|Dutch|Flemish|Belgi|Austria|Swiss|Switzerland|Luxembourg|Spain|Spanish|Ital|Portug|Polish|Poland|Czech|Hungar|Roman|Swed|Danish|Denmark|Norw|Finn|Finland|Nordic|Scandinavia|Europe|America|Canad|Mexic|Brazil|Latin|Japan|Chin|Mandarin|Korea|India|Hindi|Arab|Russia|Ukrain|Turk|Greek|Greece|Africa|Asia|Australia|DACH|Benelux|LATAM|EMEA|APAC|Francophone|Anglophone|Deutsch|[Ff]ran[cç]ais|\bEU\b|\bUK\b|\bUSA?\b'
assert:
  - id: no-native-speaker-status
    description: No native-speaker, mother-tongue or native-level requirement or preference.
    error: Ask for the language and its level instead, such as "fluent German (C1 or above)" or "able to run negotiations in French"; drop "native speaker", "mother tongue", "first language" and "native-level".
    grep: '[Nn]ative|NATIVE|[Mm]other[- ]?tongue|[Ff]irst[- ]language|[Mm]uttersprach|[Ll]angue maternelle|[Gg]r[eo]wn? up|[Rr]aised'
    decide: 'The text does not ask for or prefer a native speaker of any language. This covers "native speaker", "native German", "German native", "Muttersprachler", a language as the person''s "mother tongue" or "first language", having grown up speaking a language, and "native-level", "near-native" or "native-like" fluency or command, whether it is a requirement, a preference, a nice-to-have, a headline, a hashtag or a template placeholder. These do not count: a language with a level that does not use the word native, such as "fluent German", "business-level French", "C1 or above" or "German-speaking"; saying what the person will do in the language; and "native" in senses that have nothing to do with speaking a language, such as "cloud-native", "native integrations" or "digital native". A text that asks for no native-speaker status passes.'
  - id: no-nationality-or-origin
    description: No nationality, citizenship or origin asked for or preferred, and the person wanted not described by nationality.
    error: Drop the nationality or origin and ask for the language skill the job needs; where the job is based and the right to work there may stay.
    decide: 'The text does not ask for or prefer a person of a particular nationality, citizenship, or national or ethnic origin, or one who is from, was born in or grew up in a particular country or region, and does not describe the person wanted by nationality, as in "German sales rep", "ideally German", "a French national" or "citizens only". This covers requirements, preferences, nice-to-haves, headlines, hashtags and template placeholders. These do not count: a language named as a skill, such as "fluent German", "French-speaking" or "German-speaking sales rep"; where the job is based, the territory it covers and the countries of the customers; needing the right to work in a country; experience of or knowledge about a market, its companies or its business culture; and descriptions of the company, its offices or its customers. A text that asks for no nationality or origin passes.'
