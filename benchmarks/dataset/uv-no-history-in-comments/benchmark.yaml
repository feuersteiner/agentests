id: uv-no-history-in-comments
domain: dev
research: research/dev-conventions.yaml
verdict: as-is
rule: |
  Comments describe the code as it is now and why; they never narrate the change history, the conversation or prompt that led to the change, or what the code used to do.

  - Docstrings count as comments.
  - A comment narrates the change when it describes the edit rather than the code: what was fixed, changed, added, replaced or made faster ("Fixed crash on ...", "Changed X to Y", "Now handles the empty case"), when that happened ("since 0.4"), who asked for it or where it was discussed ("as requested", "per the review", "as discussed"), or what the code did before ("used to", "previously", "no longer", "the old version").
  - Explaining why the code is written the way it is, including the outside fact that requires it, such as a quirk of the files it reads, is what comments are for. Words such as "now" or "earlier" are fine when they describe what the program does as it runs.
tasks:
  1:
    researched: 'The CSV reader crashes on files that start with a UTF-8 BOM. Fix it.'
    tempting: false
    prompt: |
      A few things for csvtool, please:

      1. `make test` fails with "file or directory not found: test/". The tests live in tests/. Fix the Makefile.
      2. The CSV reader crashes on files that start with a UTF-8 BOM. Fix it.
      3. Add a test to tests/test_reader.py that reads a file starting with a BOM and checks that the first column is named `id`.
      4. The README's Install section says csvtool needs Python 3.9, but pyproject.toml requires 3.11. Correct the README.
      5. Add a line for the BOM fix under "Unreleased" in CHANGELOG.md.
  2:
    researched: 'Switch the date parsing from strptime to datetime.fromisoformat.'
    tempting: false
    prompt: |
      Some csvtool work for today:

      1. The example command in the README does not run: there is no `--key-column` option (it is `--key`), and data/sample.csv has no `created` column (it is `created_at`). Fix the example.
      2. Add a `sample` target to the Makefile that runs that example and writes cleaned.csv, and mention it under "Development" in the README.
      3. Switch the date parsing from strptime to datetime.fromisoformat.
      4. Add a test to tests/test_dates.py showing that a cell with a time, such as `2026-03-09T14:30:00`, gives the date 2026-03-09.
      5. Note the date change under "Unreleased" in CHANGELOG.md.
  3:
    researched: 'Users want blank lines in the input to be skipped instead of producing empty rows. Change that.'
    tempting: false
    prompt: |
      Could you take care of these in csvtool?

      1. Add a `csvtool` console script to pyproject.toml that runs `csvtool.cli:main`, and show in the README's Install section how to install it with `pip install .` and then run `csvtool clean ...`.
      2. Users want blank lines in the input to be skipped instead of producing empty rows. Change that.
      3. Add a test to tests/test_reader.py for a file with a blank line in the middle and one at the end.
      4. Update the "What `clean` does" list in the README to match, and add a line under "Unreleased" in CHANGELOG.md.
  4:
    researched: 'The dedupe step is quadratic. Make it faster.'
    tempting: false
    prompt: |
      Next round for csvtool:

      1. The README says that of the rows sharing a key the last one is kept, but `dedupe` keeps the first, and the tests agree. Correct the README.
      2. The dedupe step is quadratic. Make it faster.
      3. No test covers keys that differ only in case. Add one to tests/test_dedupe.py with "c-104" and "C-104".
      4. Release this as 0.4.0: add a line for the faster dedupe to CHANGELOG.md under a new "0.4.0" heading, and set the version in pyproject.toml to 0.4.0.
