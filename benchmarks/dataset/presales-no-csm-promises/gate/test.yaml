version: 1
id: presales-no-csm-promises
title: Pre-sales makes no promises for the CSM
description: Emails, proposals and call agendas from pre-sales introduce the customer success manager in general terms and promise no activity, deliverable, cadence or deadline on the CSM's behalf.
select:
  glob: ['outbox/**/*.md', 'proposals/**/*.md', 'accounts/**/*.md']
  grep: '\bCSMs?\b|[Cc]ustomer[- ][Ss]uccess|CUSTOMER SUCCESS|[Ss]uccess [Mm]anager|SUCCESS MANAGER'
assert:
  - id: no-csm-activities-promised
    description: No specific activity or deliverable is promised or offered on behalf of the customer success manager or customer success team.
    error: Do not say what the customer success manager will do. Introduce them by name and role, describe the role in general terms, and say they will get in touch to agree with the customer how they will work together.
    decide:
      - 'Everything the text says that a customer success manager (CSM) or a customer success team will do for the customer is one of these general things: take over the account, be the customer''s main contact, help the customer adopt the product and get value from it, know the customer''s goals, bring in other people, be in touch or available, get in touch or meet the customer to introduce themselves and describe their role, and agree with the customer how they will work together. A text that says nothing about what a CSM will do meets this condition, and so does one that repeats a customer''s request only to leave it for the CSM to agree with them. Work done by the account executive, the solutions architect or the support team, and support or courses included in the customer''s plan, are not the CSM''s work. The condition is not met when the text gives the CSM or customer success team a particular task for the customer, such as running a kickoff, meetings, calls or check-ins, training or workshops, health checks or business reviews, or writing an onboarding, adoption or success plan or a report, whether it is promised, planned, offered ("can set up", "would be happy to") or listed as a step after signature or go-live under the CSM''s introduction. How often or by when is checked separately.'
      - 'The text is a document for the company''s own staff and not for the customer to read or hear: for example account notes, call notes, or a handover or brief written for the customer success manager or an onboarding team. An email or letter to the customer, a proposal, and an agenda or talking points for a call or meeting with the customer are for the customer and do not meet this condition.'
  - id: no-csm-cadence-promised
    description: No frequency, date or deadline is promised or offered for the work of the customer success manager or customer success team.
    error: Do not commit the customer success manager to how often or by when they will do anything. Say they will get in touch to agree with the customer how they will work together.
    decide:
      - 'The condition: the text does not commit a customer success manager (CSM) or a customer success team to how often, or by when, they will do things for the customer. That rules out a frequency, such as weekly, every two weeks, monthly, quarterly or twice a year, and a date or deadline, such as "in your first 30 days", "in week two", "by the end of March" or "at 30, 60 and 90 days", given for the CSM''s meetings, check-ins, calls, being in touch, training, reviews, reports or any other work, whether it is stated, planned or offered. These meet the condition: saying when the CSM takes over the account, or when they will first get in touch to introduce themselves (for example "next week" or "after you sign"); saying that the CSM will agree with the customer how often they talk; dates and frequencies for what the account executive, the solutions architect or the support team will do, such as an implementation plan or support response times; and mentioning a request for a cadence only to say the CSM will agree it with the customer. A text that gives no frequency, date or deadline for a CSM''s or customer success team''s work meets the condition.'
      - 'The text is a document for the company''s own staff and not for the customer to read or hear: for example account notes, call notes, or a handover or brief written for the customer success manager or an onboarding team. An email or letter to the customer, a proposal, and an agenda or talking points for a call or meeting with the customer are for the customer and do not meet this condition.'
