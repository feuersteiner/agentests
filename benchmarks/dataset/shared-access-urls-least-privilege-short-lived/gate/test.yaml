version: 1
id: shared-access-urls-least-privilege-short-lived
title: Shared-access URLs are least-privilege and short-lived
description: Every SAS or pre-signed URL the code generates covers one blob, grants only the one operation it is for, and expires within an hour of being generated.
select:
  glob: ['app/**/*.py', 'scripts/**/*.py', 'bin/**/*.py', '*.py']
  grep: '(\b|_)(sas|SAS)(\b|_)|Sas[A-Z]|[Pp]re-?signed|PRESIGNED|[Ss]igned_?[Uu][Rr][Ll]|SIGNED_URL|[Ss]hared[ _-]?[Aa]ccess|SHARED_ACCESS|user_delegation_key|(\b|_)(LINK|URL)_(\w*_)?(TTL|EXPIR|LIFETIME|MAX_AGE|DAYS|HOURS|MINUTES|SECONDS)|(\b|_)(link|url)_(\w*_)?(ttl|expir|lifetime|max_age|days|hours|minutes|seconds)|\b(ttl|expiry|expires_in|lifetime|valid_for)\s*=\s*timedelta'
assert:
  - id: one-object
    description: Each generated SAS or pre-signed URL covers one blob, never a container, folder or account.
    error: Sign the one blob the link is for, with generate_blob_sas and its full name; a container or account SAS reaches every blob in it.
    grep: 'generate_(container|account|file_system|directory|share)_sas|ContainerSasPermissions|AccountSasPermissions|ResourceTypes|presigned_post|starts-with|sr=c|srt='
    decide: 'Every shared access signature (SAS) or pre-signed URL that this code generates covers one single blob or object. A SAS made with generate_container_sas, generate_file_system_sas or generate_directory_sas covers a whole container, file system or folder, and one made with generate_account_sas covers the whole storage account, even when the code then appends one blob''s name to the URL; a pre-signed POST policy that accepts any key under a prefix covers many objects too. Any of these fails. A SAS made with generate_blob_sas for one blob name passes, and so does code that generates no SAS or pre-signed URL.'
  - id: one-operation
    description: Each generated SAS or pre-signed URL grants only the one operation it is used for.
    error: Grant read only on a download link, and create and/or write only on an upload link; drop list, delete, add, tag and the other extra permissions.
    grep: '[Pp]ermission|PERMISSION|\bsp='
    decide: 'Each shared access signature (SAS) or pre-signed URL that this code generates grants only the one operation it is used for. A link for downloading, viewing or fetching an object grants read and nothing else. A link for uploading an object grants create or write, or both, and nothing else. It fails when such a link also grants another permission, such as list, delete, add, tag or move, or grants read on an upload link, or create or write on a download link, whether through a permissions object such as BlobSasPermissions(read=True, write=True) or a permission string with extra letters such as "rw", "rl" or "racwd" on a download link. A flag set to False is not granted. Judge only which permissions a link grants, not how many blobs it reaches: a token for a whole container that grants only read still grants only read. Code that generates no SAS or pre-signed URL passes.'
  - id: within-an-hour
    description: Each generated SAS or pre-signed URL expires at most an hour after it is generated.
    error: Expire the link at most an hour after it is generated; when people need it later, generate a fresh one when they ask for it instead of making it last longer.
    grep: '[Ee]xpir|EXPIR|TTL|[Tt]tl\b|_ttl|[Ll]ifetime|LIFETIME|timedelta|ExpiresIn|[Mm]ax_?[Aa]ge|MAX_AGE|_DAYS|_HOURS|_days|_hours'
    decide:
      - 'Every shared access signature (SAS) or pre-signed URL that this code generates expires at most one hour (60 minutes, 3600 seconds) after the moment it is generated, and every value this file sets for how long such a link stays valid is an hour or less. A value read from an environment variable, a setting or a parameter counts with its default value, so a default of 24 hours fails. An expiry of now plus more than an hour, such as 90 minutes, 2 hours, 1 day or 7 days, or a fixed date far ahead, fails. A start time set a few minutes before now, to allow for clock skew, does not count. Lifetimes of other things, such as cache entries, sessions, login tokens or short links to public pages, are not judged.'
      - 'Every shared access signature (SAS) or pre-signed URL in this file gets its lifetime from a name defined in another module, such as config.LINK_TTL, and no duration written in this file for how long such a link stays valid is longer than one hour.'
