[project]
name = "fernpoint-api"
version = "0.8.2"
description = "The web API behind Fernpoint's dashboards: exports, avatars, project files and datasets"
requires-python = ">=3.11"
dependencies = ["azure-storage-blob>=12.19"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
