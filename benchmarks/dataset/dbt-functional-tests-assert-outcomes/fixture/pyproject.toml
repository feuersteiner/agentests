[project]
name = "minietl"
version = "0.3.0"
description = "Incremental loads from raw tables into reporting tables, on SQLite"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
minietl = "minietl.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
