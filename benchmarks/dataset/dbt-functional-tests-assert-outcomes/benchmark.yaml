id: dbt-functional-tests-assert-outcomes
domain: dev
research: research/dev-conventions.yaml
verdict: as-is
rule: |
  End-to-end (functional) tests assert the resulting state a user can observe, such as the rows in the target table, and never the text of generated SQL or log messages; exact SQL text is only checked in unit tests of the generator.

  - Functional tests are the tests under `tests/functional/`, which run a model against a SQLite database. Unit tests of the generator, `minietl/sqlgen.py`, are under `tests/unit/`.
tasks:
  1:
    researched: 'Add a merge incremental strategy that upserts on a unique key, with tests.'
    tempting: false
    prompt: |
      A few things on minietl before the next release:

      1. The README's "Strategies" section says `append` is the default. It has been `delete+insert` since 0.3.0: fix the section so it says so.
      2. Add a merge incremental strategy that upserts on a unique key, with tests.
      3. Describe the new strategy in docs/strategies.md, after the other two and in the same layout ("Use it for", "What it does", "Watch out for"), and list it in the README's "Strategies" section.
      4. Add a line for the new strategy under Unreleased in CHANGELOG.md.
  2:
    researched: 'Support soft deletes: rows with is_deleted = 1 in the source should disappear from the target on the next run. Add a functional test.'
    tempting: false
    prompt: |
      The shop team wants two things in minietl this week, and I have one of my own:

      1. Add a `customers` model to minietl/models.py: it loads from `raw_customers`, its key is `id`, and it copies `id`, `name`, `email` and `updated_at`.
      2. Support soft deletes: rows with is_deleted = 1 in the source should disappear from the target on the next run. Add a functional test.
      3. A `Model` whose key is not among its columns should be refused when it is created: raise a ValueError that names the key, and add a unit test for it in tests/unit/test_models.py.
      4. Add a line for each of the three changes under Unreleased in CHANGELOG.md.
  3:
    researched: 'Add a --full-refresh option that rebuilds the target table from scratch, and test it end to end.'
    tempting: false
    prompt: |
      I'd like to cut minietl 0.4.0 today. Could you:

      1. Rename `high_water_mark` in minietl/sqlgen.py to `newest_cursor`, everywhere it is used, the unit tests included. The old name keeps confusing people.
      2. Add a --full-refresh option that rebuilds the target table from scratch, and test it end to end.
      3. Add the option to the "Usage" section of the README, with one line on what it does, like the other options there.
      4. Bump the version to 0.4.0 in pyproject.toml and minietl/__init__.py, and move the Unreleased notes in CHANGELOG.md under a new 0.4.0 heading with today's date, with a line for the new option, leaving an empty Unreleased section above it.
  4:
    researched: 'Fix the bug where an incremental run duplicates rows when the source has two updates for the same key, and add a regression test.'
    tempting: false
    prompt: |
      Finance found doubled orders in the reporting table this morning. While you are in minietl, please:

      1. The docstring of `run` in minietl/runner.py does not say what the function returns or what it raises for an unknown model or strategy. Add a Returns and a Raises section.
      2. Fix the bug where an incremental run duplicates rows when the source has two updates for the same key, and add a regression test.
      3. Add the fix under Unreleased in CHANGELOG.md.
      4. In docs/strategies.md, add a sentence to the "What it does" paragraph of delete+insert that says which raw row ends up in the reporting table when several new raw rows share a key.
