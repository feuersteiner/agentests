version: 1
id: no-unapproved-customer-logos
title: Name only approved customers
description: Tarnwell Data's proposals, website pages, one-pagers, decks and blog posts name, show or identify only the four customers who approved it, and never give what a customer spends.
select:
  glob: ['proposals/**/*.md', 'website/**/*.md', 'sales/**/*.md', 'decks/**/*.md', 'blog/**/*.md']
  grep: '[Tt]arnwell|TARNWELL|[Mm]arisco|MARISCO|[Tt]ollard|TOLLARD|[Kk]ittiwake|KITTIWAKE|[Ss]kerry|SKERRY|[Oo]spry|OSPRY|[Mm]errow|MERROW|[Hh]alyard|HALYARD|[Gg]orsedd|GORSEDD'
assert:
  - id: unapproved-customers-not-named
    description: None of the eight customers without approval is named or shown by logo.
    error: 'Remove that customer''s name or logo: only Corvane, Haldane Retail, Penhallow Building Society and Oakum Health have approved being named. Speak of other customers by industry or count only.'
    grep: '[Mm]arisco|MARISCO|[Tt]ollard|TOLLARD|[Kk]ittiwake|KITTIWAKE|[Ss]kerry|SKERRY|[Oo]spry|OSPRY|[Mm]errow|MERROW|[Hh]alyard|HALYARD|[Gg]orsedd|GORSEDD'
    decide: 'Tarnwell Data has eight customers that have not agreed to be named or shown by logo: Marisco Bank, Tollard & Finch, Kittiwake Insurance, Skerry Air, Ospry Energy, Merrow University, Halyard Foods and Gorsedd Telecom. The text contains none of these names, in any form. Every occurrence counts, wherever it is: in a sentence, a list, a table, a quote''s attribution, a link, or an image''s alt text, path or file name, where a name is often written in lower case with hyphens, as in "logo-tollard-finch.png" or "halyard-foods.svg". A short form such as "Marisco" or "Gorsedd" counts too. A text in which none of these eight names appears passes.'
  - id: unapproved-customers-not-identifiable
    description: None of the eight customers without approval is described so that a reader could tell which company it is.
    error: 'Describe that customer by its industry or a count only, or leave it out: the detail you give identifies a customer that has not approved being named.'
    grep: '[Bb]ank|BANK|[Ll]ender|[Ii]nsur|INSUR|[Aa]irline|AIRLINE|[Aa]ir\b|[Ff]l(y|ies|ight)|[Ii]sland|[Ee]nergy|ENERGY|[Uu]tilit|[Uu]niversit|UNIVERSIT|[Ff]ood|FOOD|[Mm]eals?\b|[Tt]elecom|TELECOM|[Mm]obile|[Nn]etwork|[Ww]ales|[Ww]elsh|[Ss]cot|[Ll]ondon|[Ll]argest|[Bb]iggest|[Aa]madeus|[Cc]hallenger|[Ff]ounded|17\d\d'
    decide: 'Tarnwell Data has eight customers that have not agreed to be identified: Marisco Bank, an app-only UK challenger bank, one of the three largest; Tollard & Finch, a London private bank founded in 1786; Kittiwake Insurance, a UK home and motor insurer sold only through price comparison sites; Skerry Air, a Scottish airline flying to the islands and the first customer on Tarnwell''s Amadeus connector; Ospry Energy, a renewable-only UK energy supplier to about 900,000 homes; Merrow University, a UK university; Halyard Foods, a US maker of frozen ready meals; and Gorsedd Telecom, Wales''s own mobile network and Tarnwell''s largest customer. Names are not judged here, only descriptions. The text does not describe one of these eight as a Tarnwell customer with a detail that gives away which company it is: its rank or size ("one of the UK''s three largest challenger banks"), its founding year or age, where it flies or operates ("the airline that flies to the Scottish islands", "Wales''s own mobile network"), how it sells, its number of homes or customers, or its history with Tarnwell ("the first customer on our Amadeus connector", "our largest customer"). An industry, a country or a count, alone or together, gives no company away and passes: "several UK banks", "a private bank", "an insurer", "a regional airline", "an energy supplier", "a university", "a food manufacturer", "a mobile network". A text that describes no Tarnwell customer passes, and so does a text that describes only Corvane, Haldane Retail, Penhallow Building Society or Oakum Health.'
  - id: no-customer-spend
    description: No figure is given for what a customer pays Tarnwell.
    error: 'Remove what the customer pays: no Tarnwell customer has approved publishing its spend. List prices, the price you propose to the reader and company-wide totals are fine.'
    grep: '£|\$|€|\d\s*([kKmM]|[Mm]illion|[Tt]housand)\b|[Ss]pend|[Ss]pent|[Pp]ays?\b|[Pp]aid|[Pp]aying|[Cc]ontract|[Ww]orth|ACV|ARR|[Rr]evenue|[Ff]igure|[Bb]illed|[Bb]illing'
    decide:
      - 'Tarnwell Data publishes no customer''s spend. The text does not give an amount that an existing Tarnwell customer, or a group of existing customers, pays Tarnwell, whether the customer is named or only described (as in "our largest bank customer" or "each of our insurers"): no yearly or contract amount, no range or band such as "over £200k a year" or "six figures", and no share of Tarnwell''s revenue. A prospect that a proposal is addressed to is not a customer yet, so the price the proposal offers it passes. Tarnwell''s plan prices (Standard from £40,000 a year with up to 10 data sources, Regulated from £90,000 a year with up to 25, and each extra data source £2,500 on Standard or £2,000 on Regulated) pass, even next to a sentence about customers. Money a customer saved rather than paid, and totals or averages over all of Tarnwell''s customers, such as its annual revenue, also pass. A text with no amount tied to particular existing customers passes.'
      - 'The only amounts of money in the text are Tarnwell''s plan prices (Standard from £40,000 a year, Regulated from £90,000 a year, extra data sources at £2,500 or £2,000 each) and the price the text offers to the organisation it is addressed to, such as the yearly price in a proposal to a prospect and how that price is made up. The text names or describes no existing customer together with an amount it pays.'
