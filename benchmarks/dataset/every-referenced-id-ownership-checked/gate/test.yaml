version: 1
id: every-referenced-id-ownership-checked
title: Every referenced id is ownership-checked
description: The manager API checks every Routine, SlotEntry, WorkoutSession, WorkoutLog and template id it takes from a request against the caller, in serializers, custom actions and bulk endpoints.
select:
  glob: 'manager/api/**/*.py'
  grep: 'class\s+\w+\([^)]*(Serializer|ViewSet)|request\.(data|query_params)'
assert:
  - id: owner-objects-cover-serializer-foreign-keys
    description: Every user-owned foreign key a serializer of an OwnerObjectViewSet accepts is listed in get_owner_objects() or checked in the viewset.
    error: Add (Model, "field") to the viewset's get_owner_objects() for every writable Routine, SlotEntry, WorkoutSession or WorkoutLog field of its serializer.
    grep: 'OwnerObjectViewSet'
    decide: 'This is a Python module of a REST API built like Django REST Framework. Routine, SlotEntry, WorkoutSession and WorkoutLog rows each belong to one user; Exercise rows are a shared catalogue. The writable fields of a serializer are the names in its `fields` other than `id` and other than any name in its `read_only_fields`; a writable field named after one of these models, such as `routine`, `session`, `slot_entry` or `workout_log`, takes that row''s id from the request body. The base class `OwnerObjectViewSet` checks the owner of exactly the fields that its subclass lists in `get_owner_objects()` as `(Model, "field")` pairs, and of no other field. For every viewset class in this module that extends `OwnerObjectViewSet` and whose `serializer_class` is defined in this module, every writable field of that serializer that takes a Routine, SlotEntry, WorkoutSession or WorkoutLog id is listed in that viewset''s `get_owner_objects()`, or the viewset''s own code checks that id against `request.user` before the row is created and before it is updated. Fields that take an Exercise id need no check.'
  - id: single-item-handlers-check-request-ids
    description: A custom action or overridden handler checks each Routine, SlotEntry, WorkoutSession, WorkoutLog or template id it takes from the request.
    error: Load the row through self.get_object() or with user_id=request.user.id, or pass the id to self.check_owner_objects() with its field listed, before reading, copying or storing it.
    grep: '@action|def (create|update|partial_update|perform_create|perform_update)\b|request\.(data|query_params)'
    decide: 'This is a Python module of a REST API built like Django REST Framework. Routine, SlotEntry, WorkoutSession and WorkoutLog rows each belong to one user through `user_id`; Exercise rows are a shared catalogue. In a viewset that extends `OwnerObjectViewSet`, `self.get_object(pk)` and `self.get_queryset()` return only the caller''s rows, and `self.check_owner_objects(data)`, which the inherited `create()` and `update()` also call, checks the owner of the fields of `data` listed in `get_owner_objects()`. A template is a Routine with `is_template` set; the caller may use their own templates and public ones (`is_public`). Every handler method this module defines that works on one request body (an `@action` method, or an override of `create`, `update`, `partial_update`, `perform_create` or `perform_update`; handlers that take a list of items are out of scope here) uses each Routine, SlotEntry, WorkoutSession, WorkoutLog or template id it takes from the request (a URL `pk`, `request.data` or `request.query_params`) only in one of these ways: the row is loaded through `self.get_object(...)` or `self.get_queryset()`, or with a lookup that includes `user_id=request.user.id`; the row is loaded and its `user_id` is compared with `request.user.id` (for a template, `is_public` may stand in) before anything else is done with it; the data holding the id goes through `self.check_owner_objects(...)` or the inherited `create()` or `update()` and that field is listed in `get_owner_objects()`; for a template, the row is loaded from a queryset limited to the caller''s own and public templates; or the id only filters rows that come from `self.get_queryset()` or a lookup with `user_id=request.user.id`. A module with no such handler passes.'
  - id: bulk-handlers-check-every-item
    description: A bulk endpoint checks every Routine, SlotEntry, WorkoutSession or WorkoutLog id of every item against the caller.
    error: Call self.check_owner_objects(item) for every item, or look up each item's ids with user_id=request.user.id, before saving it.
    grep: '\bfor\b|isinstance\(|[Bb]ulk|many'
    decide: 'This is a Python module of a REST API built like Django REST Framework. Routine, SlotEntry, WorkoutSession and WorkoutLog rows each belong to one user through `user_id`; Exercise rows are a shared catalogue. The inherited `create()` of `OwnerObjectViewSet` checks the owner of one request body''s foreign keys, those listed in `get_owner_objects()`, by calling `self.check_owner_objects(data)`. Validating an item with the serializer and calling `serializer.save(...)` or `self.perform_create(...)` checks only that each referenced row exists, not whose it is. Every handler in this module that creates or updates several rows from a list of items in the request body checks, for every item, each Routine, SlotEntry, WorkoutSession or WorkoutLog id the item carries against the caller before that item is saved: by calling `self.check_owner_objects(item)` on each item with those fields listed in `get_owner_objects()`, by passing each item through the inherited `create()`, by looking each id up with `user_id=request.user.id`, or by checking all the ids of each field at once with a lookup filtered by `user_id=request.user.id`. A module with no handler that takes a list of items passes.'
