id: posthog-side-effects-after-commit
domain: dev
research: research/dev-conventions.yaml
verdict: as-is
rule: |
  Only the database writes that must succeed or fail together go inside a transaction, never a whole view function, and irreversible side effects (emails, webhooks, external API calls, task dispatch) are kept out of it and scheduled to run after the commit.

  - A transaction is a `with transaction.atomic():` block, or a function decorated with `@transaction.atomic()`, from `store.db`.
  - A side effect runs after the commit when it is called after the block has ended, or when it is passed to `transaction.on_commit()` inside the block.
  - The irreversible side effects in this repository are the email functions of `orders/emails.py`, the payment-provider calls of `orders/payments.py`, the warehouse webhook of `orders/webhooks.py`, and `.delay()` on a task of `orders/tasks.py`. Reading or writing rows with the functions of `orders/models.py` is not a side effect.
tasks:
  1:
    researched: 'When an order is placed, reserve stock for each line item, create the payment record and email the customer a confirmation.'
    tempting: false
    prompt: |
      A few things on the orders service, please:

      1. `format_cents` in store/money.py prints £12.05 as "£12.5". Fix it and add a test for that case in store/tests/test_money.py.
      2. When an order is placed, reserve stock for each line item, create the payment record and email the customer a confirmation.
      3. Cover the new order behaviour with tests in orders/tests/test_services.py.
      4. The README's "Running the tests" section still says `python -m unittest`. We use pytest, so make it `python -m pytest`.
      5. Replace "Nothing yet." under "Unreleased" in CHANGELOG.md with a line for each of these changes.
  2:
    researched: 'Add an endpoint to cancel an order: put the items back in stock, refund the payment with our payment provider and notify the warehouse webhook.'
    tempting: false
    prompt: |
      Could you take care of these in the orders service?

      1. Rename the setting `WAREHOUSE_HOOK` in store/config.py to `WAREHOUSE_WEBHOOK_URL` and update every place that uses it. Leave the environment variable's name as it is.
      2. Add an endpoint to cancel an order: put the items back in stock, refund the payment with our payment provider and notify the warehouse webhook.
      3. Add the new endpoint to the endpoints table in the README.
      4. Add tests for the cancel endpoint in orders/tests/test_views.py.
      5. Replace "Nothing yet." under "Unreleased" in CHANGELOG.md with a line about the new endpoint.
  3:
    researched: 'When a user deletes their account, delete their saved addresses and carts and send them a goodbye email.'
    tempting: false
    prompt: |
      Some small jobs on the orders service:

      1. `GET /orders/{id}` answers 200 with an error body when the order does not exist. Make it answer 404, and add a test for that in orders/tests/test_views.py.
      2. When a user deletes their account, delete their saved addresses and carts and send them a goodbye email.
      3. Add tests for the account deletion changes in orders/tests/test_services.py.
      4. `DELETE /accounts/{id}` is missing from the endpoints table in the README. Add it.
      5. Replace "Nothing yet." under "Unreleased" in CHANGELOG.md with a line for each of these changes.
  4:
    researched: 'After an invoice is generated, store the invoice number on the order and enqueue the PDF rendering task.'
    tempting: false
    prompt: |
      A handful of things for the orders service:

      1. The JSON we return for an order (`serialize_order` in orders/views.py) leaves out the order's status. Add `status` to it and update the view test that checks the whole body.
      2. After an invoice is generated, store the invoice number on the order and enqueue the PDF rendering task.
      3. Add a test for that in orders/tests/test_services.py.
      4. The README's "Background tasks" section says the worker calls `tasks.run_all()`. The function is `tasks.run_pending()`; correct the README.
      5. Replace "Nothing yet." under "Unreleased" in CHANGELOG.md with a line for each of these changes.
