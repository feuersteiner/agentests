neighbouring_formats:
  - name: AGENTS.md
    collection: agentsmd/agents.md (spec and site at agents.md)
    url: https://agents.md/
    stars: 25665
    note: |
      "A simple, open format for guiding coding agents". The site says it is "used by over 60k
      open-source projects" and is supported by Codex, Cursor, Copilot's coding agent, Gemini CLI,
      Jules, Aider, Zed and others; the nearest file in the tree wins. Claude Code reads AGENTS.md
      when there is no CLAUDE.md. Content is mostly commands and conventions. GitHub's analysis of
      2,500 agents.md files found "Most agent files fail because they're too vague", that code
      examples beat explanation, and that the best files have explicit "always do, ask first, never
      do" boundaries
      (https://github.blog/ai-and-ml/github-copilot/how-to-write-a-great-agents-md-lessons-from-over-2500-repositories/).
  - name: CLAUDE.md and .claude/rules/
    collection: Claude Code memory docs; josix/awesome-claude-md (641 stars) curates examples
    url: https://code.claude.com/docs/en/memory
    stars: 641
    note: |
      Loaded into every session, unlike a skill. The docs say: "Claude treats CLAUDE.md files as
      context, not enforced configuration". They advise instructions "concrete enough to verify"
      and "target under 200 lines per CLAUDE.md file. Longer files consume more context and reduce
      adherence." `.claude/rules/*.md` with a `paths` glob loads only when matching files are opened.
      For arm 2 this is the main alternative carrier, and Vercel's eval found always-on context beat
      an on-demand skill (see compliance_evidence).
  - name: Cursor rules (.cursorrules / .mdc)
    collection: PatrickJS/awesome-cursorrules
    url: https://github.com/PatrickJS/awesome-cursorrules
    stars: 41182
    note: |
      The largest public collection (257 entries in rules/). Judging by file names, most are
      framework- or library-specific. A few carry fuzzy dev judgement, for example rules/clean-code.mdc
      (56 lines: meaningful names, single responsibility, DRY, comment why not what),
      code-guidelines, codequality and optimize-dry-solid-principles. In Cursor's current format,
      rules live in `.cursor/rules/*.mdc` with description, globs and alwaysApply, and four
      activation modes ("Apply Intelligently" is description-based, like skills). Cursor says to
      keep rules under 500 lines and also reads AGENTS.md (https://cursor.com/docs/context/rules).
  - name: Cursor rules (.mdc library collection)
    collection: sanjeed5/awesome-cursor-rules-mdc
    url: https://github.com/sanjeed5/awesome-cursor-rules-mdc
    stars: 3589
    note: |
      A generated collection of .mdc files in rules-mdc/, plus a Cursor rules reference document.
      I did not read individual rule files. The repository framing is library- and framework-
      specific, so mostly tool instructions rather than fuzzy judgement.
  - name: GitHub Copilot instructions
    collection: github/awesome-copilot
    url: https://github.com/github/awesome-copilot
    stars: 41450
    note: |
      Official community collection: 195 entries in instructions/ and 464 in skills/. Format is
      `.github/copilot-instructions.md` repo-wide, plus `.github/instructions/NAME.instructions.md`
      with an `applyTo` glob; Copilot also reads AGENTS.md and a root CLAUDE.md
      (https://docs.github.com/en/copilot/how-tos/configure-custom-instructions/add-repository-instructions).
      Fuzzy ones include code-review-generic.instructions.md (418 lines; review priorities from
      CRITICAL "block merge" down), object-calisthenics, self-explanatory-code-commenting,
      security-and-owasp and gilfoyle-code-review.
  - name: Book-derived AGENTS.md rules and skills
    collection: ciembor/agent-rules-books
    url: https://github.com/ciembor/agent-rules-books
    stars: 3336
    note: |
      Rules distilled from software books (Clean Code, A Philosophy of Software Design, Clean
      Architecture, DDIA, Release It!, Refactoring, Working Effectively with Legacy Code...). Each
      comes in nano, mini and full sizes as AGENTS.md text and as a SKILL.md wrapper. This is the
      richest public source of fuzzy architecture and reliability rules, and the size variants make
      a ready-made length ablation.
  - name: Rules for Claude Code and Cursor
    collection: steipete/agent-rules
    url: https://github.com/steipete/agent-rules
    stars: 5667
    note: |
      Described as "Rules and Knowledge to work better with agents such as Claude Code or Cursor".
      I read only the repository metadata, not the rule files.
  - name: Skill directories (same SKILL.md format, indexes rather than a new format)
    collection: skills.sh leaderboard; ComposioHQ/awesome-claude-skills (80085 stars); VoltAgent/awesome-agent-skills (37452); hesreallyhim/awesome-claude-code (58613); travisvn/awesome-claude-skills (15913)
    url: https://skills.sh/
    stars: 80085
    note: |
      The star count is for ComposioHQ/awesome-claude-skills. On skills.sh (read 2026-11-22) the
      top installed skills were vercel-labs/skills find-skills (4.5M), several heygen-com/hyperframes
      and mattpocock/skills entries (grill-me 1.6M), and anthropics/skills frontend-design (1.2M).
      Few of the top entries are fuzzy guidelines. Most are tools or procedures.

compliance_evidence:
  - title: 'AGENTS.md outperforms skills in our agent evals (Vercel, 2026-01-27)'
    url: https://vercel.com/blog/agents-md-outperforms-skills-in-our-agent-evals
    finding: |
      Next.js 16 API tasks scored on build, lint and test. Pass rates: no docs 53%, skill with
      default behaviour 53%, skill plus explicit instructions to use it 79%, and an 8KB docs index in
      AGENTS.md 100%. With explicit instructions the skill triggered 95%+ of the time. The post does
      not name the model or eval size.
    quote: 'In 56% of eval cases, the skill was never invoked.'
  - title: 'OctoBench: Benchmarking Scaffold-Aware Instruction Following in Repository-Grounded Agentic Coding (arXiv 2601.10343)'
    url: https://arxiv.org/html/2601.10343v2
    finding: |
      217 tasks under Claude Code, Kilo and Droid, with 7,098 objective checks. Check-level
      compliance is high (79.75-85.64%), but only 9.66-28.11% of instances satisfy every rule; the
      best model was Claude Opus 4.5. Compliance falls with interaction length for most models, and
      constraints set in Skill.md are the weakest category (Opus 4.5 at 58.45% ISR on them).
    quote: 'compliance drops noticeably for constraints specified in Skill.md'
  - title: 'SkillsBench: Benchmarking How Well Agent Skills Work Across Diverse Tasks (arXiv 2602.12670, v4)'
    url: https://arxiv.org/abs/2602.12670
    finding: |
      Curated skills raise the average pass rate from 33.9% to 50.5% (+16.6 pp). Focused skills of at
      most three modules beat large bundles, and compact or standard-length skills (+19.0 / +21.5 pp)
      beat detailed ones (+14.5 pp). Self-generated skills land below the no-skill baseline (-8.1 pp
      on Claude Code + Opus 4.7). Some harnesses "acknowledge Skills content but proceed without
      invoking it."
    quote: 'Focused Skills with at most three modules outperform larger or exhaustive bundles'
  - title: 'Evaluating AGENTS.md: Are Repository-Level Context Files Helpful for Coding Agents? (arXiv 2602.11988)'
    url: https://arxiv.org/abs/2602.11988
    finding: |
      The agents were Claude Code with Sonnet-4.5, Codex with GPT-5.2 and GPT-5.1 mini, and Qwen Code
      with Qwen3-30b-coder. Context files did not generally raise task success, and they added over
      20% to inference cost on average. Developer-written files improved performance by 2.4% on
      average, which was not significant (p = 21%). The agents did follow the instructions. The
      authors hypothesise that the extra instructions make tasks harder, and they advise that files
      should "only contain specific additional instructions beyond what is already available in the
      codebase".
    quote: 'instructions in the context files are well followed by coding agents'
  - title: 'Instruction Adherence in Coding Agent Configuration Files: A Factorial Study of Four File-Structure Variables (arXiv 2605.10039)'
    url: https://arxiv.org/abs/2605.10039
    finding: |
      1,650 Claude Code sessions (16,050 function-level observations) on two TypeScript codebases
      varied the configuration file's size, instruction position, conflicting instructions and
      architecture. None of these had a detectable effect. The
      largest effect was within a session: compliance odds fell about 5.6% with each additional
      generated function (OR 0.944). This trend was non-monotonic and found post hoc.
    quote: 'None of the four structural variables or three two-way interactions produces a detectable contrast'
  - title: 'How Many Instructions Can LLMs Follow at Once? (IFScale, arXiv 2507.11538)'
    url: https://arxiv.org/abs/2507.11538
    finding: |
      Up to 500 keyword-inclusion instructions in a business-report task, across 20 models. Accuracy
      falls as instruction density rises, models favour earlier instructions, and the best models
      reach only 68% at 500 instructions.
    quote: 'even the best frontier models only achieve 68% accuracy at the max density of 500 instructions.'
  - title: 'When Instructions Multiply: Measuring and Estimating LLM Capabilities of Multiple Instructions Following (ManyIFEval / StyleMBPP, arXiv 2509.21051)'
    url: https://arxiv.org/abs/2509.21051
    finding: |
      Ten LLMs were tested with several simultaneous verifiable instructions, on text (ManyIFEval) and
      on code (StyleMBPP). Every model got steadily worse as instructions were added. A logistic
      regression on instruction count predicts the drop, even for unseen combinations of
      instructions.
    quote: 'performance consistently degrades as the number of instructions increases.'
  - title: 'AGENTIF: Benchmarking Instruction Following of Large Language Models in Agentic Scenarios (arXiv 2505.16944)'
    url: https://arxiv.org/abs/2505.16944
    finding: |
      707 instructions from 50 real agentic applications, averaging 1,723 words and 11.9 constraints
      each. Current models perform poorly, especially on complex constraint structures and tool
      specifications.
    quote: 'We observe that current models generally perform poorly, especially in handling complex constraint structures'
  - title: 'Context Rot: How Increasing Input Tokens Impacts LLM Performance (Chroma, 2025-07-14)'
    url: https://www.trychroma.com/research/context-rot
    finding: |
      18 models, with tasks kept simple so that only input length varied. Performance became less
      reliable as inputs grew. This bears on long agent sessions in which a skill loaded early
      competes with growing context.
    quote: 'model performance degrades as input length increases.'
  - title: 'Improving skill-creator: Test, measure, and refine Agent Skills (Anthropic, 2026-03-03)'
    url: https://claude.com/blog/improving-skill-creator-test-measure-and-refine-agent-skills
    finding: |
      Tuning skill descriptions against should-trigger and should-not-trigger prompts improved
      triggering on 5 of 6 public document skills. The post separates "capability uplift" skills
      from "encoded preference" skills. Our fuzzy-rule skills are the latter.
    quote: 'We ran it across our document-creation skills and saw improved triggering on 5 out of 6 public skills.'
  - title: 'writing-skills SKILL.md, Match the Form to the Failure (obra/superpowers; informal, unpublished data)'
    url: https://github.com/obra/superpowers/blob/main/skills/writing-skills/SKILL.md
    finding: |
      In the author's head-to-head wording tests on output-shaping guidance, a prohibition ("don't
      X") produced more of the unwanted content than a positive recipe, and trended worse than no
      guidance at all. Adding one nuance clause made a winning recipe noisy. The data is not
      published, so treat this as a practitioner report.
    quote: 'the prohibition arm produced clearly more of the unwanted content than the recipe arm (fully separated distributions), and trended worse than even the no-guidance control'

writing_a_fair_skill:
  - point: |
      Install it the documented way so a reviewer cannot say it never loaded. Put it at
      `.claude/skills/<rule-name>/SKILL.md`, with `---` on line 1 and spec-valid frontmatter (a
      kebab-case `name` matching the folder, plus a `description`). Check that it parses with
      `claude plugin validate .claude/skills`. Run `claude -p` without `--bare`, with the default
      setting sources, and pin the Claude Code version.
    source: https://code.claude.com/docs/en/headless
  - point: |
      Write the description as when-to-use triggers, not a summary of the rule. Put the key use case
      first, use the words the task prompts actually contain (for example "commit", "job advert",
      "privacy notice", "retry"), write in the third person, keep it well under 1,024 characters,
      and make it slightly pushy ("Use whenever you write or edit X, even if the request doesn't
      mention Y").
    source: https://agentskills.io/skill-creation/optimizing-descriptions
  - point: |
      Measure and report whether the skill was invoked in every arm-2 run, by looking for a `Skill`
      tool_use in stream-json. Pre-register what happens when it is not. Agents undertrigger, and
      plain tasks may not trigger a skill at all; Vercel saw no invocation in 56% of cases. Consider
      a second arm-2 variant in which a one-line CLAUDE.md pointer or a `/rule-name` prefix forces
      the load, so the skill is judged on its content and not only on its discovery.
    source: https://vercel.com/blog/agents-md-outperforms-skills-in-our-agent-evals
  - point: |
      Keep it compact and focused: one rule family per skill, roughly 40-150 lines, far under the
      500-line / 5,000-token ceiling, and with at most a couple of supporting files. Compact skills
      beat detailed ones, and skills of three modules or fewer beat exhaustive bundles.
    source: https://arxiv.org/abs/2602.12670
  - point: |
      Put the most important rule at the top and word it as a standing instruction for the whole
      task, for example "before every commit, check the diff against...". The skill is not re-read,
      and after compaction only the first 5,000 tokens survive. Use headers and bullets, not dense
      prose.
    source: https://code.claude.com/docs/en/skills
  - point: |
      Explain why each rule exists rather than stacking ALL-CAPS MUSTs. Anthropic calls rigid
      ALWAYS/NEVER a "yellow flag", and the Claude Code docs say piled-on emphasis "mostly makes
      Claude over-apply the rule".
    source: https://github.com/anthropics/skills/blob/main/skills/skill-creator/SKILL.md
  - point: |
      Include one or two concrete good/bad examples per rule, plus a short "gotchas" list of the
      specific mistakes the agent makes without the skill. Agents pattern-match concrete examples
      better than prose descriptions, and code examples beat explanation in agent files.
    source: https://agentskills.io/skill-creation/best-practices
  - point: |
      Match the wording to the failure. Use a prohibition plus a rationalisation table and red flags
      for rules the agent knows but skips under pressure, as in the superpowers TDD skill. Use a
      positive recipe or template for rules about the shape of the output. State exceptions as
      conditionals on observable facts, never as "unless it matters" clauses.
    source: https://github.com/obra/superpowers/blob/main/skills/writing-skills/SKILL.md
  - point: |
      Add a self-check loop that is the skill-arm counterpart of the gate: before committing, review
      the staged diff against the rule checklist, fix any violation and re-check. Validation loops
      are documented best practice, and leaving one out would weaken arm 2 unfairly.
    source: https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices
  - point: |
      Build it from real public material rather than from scratch, and avoid padding. For example,
      adapt the claims rules from copywriting and brand-review, the reliability rules from
      release-it, and the review rules from receiving-code-review. Cut generic advice the model
      already follows ("Would the agent get this wrong without this instruction?"). Leave out
      embedded hooks such as taste-skill's Stop gate, which would turn arm 2 into a gate arm. Do not
      use LLM-generated skills, which scored below the no-skill baseline.
    source: https://agentskills.io/skill-creation/best-practices
