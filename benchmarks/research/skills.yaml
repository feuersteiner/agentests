# Research: public skills and rule files for coding agents, as a fair opponent (arm 2).
# Every URL, star count and quote below was opened in this session on 2026-11-22.
# Star counts are the numbers GitHub's API returned that day; I did not audit them for inflation.

format:
  summary: |
    A project skill is a folder `.claude/skills/<skill-name>/` holding a `SKILL.md` file:
    YAML frontmatter between `---` markers, then Markdown instructions. Supporting files can sit
    beside it. Claude Code follows the open Agent Skills standard (agentskills.io) and adds its own
    fields. When a session starts, only each skill's name and description go into a skill listing
    in context. The body loads when Claude decides to invoke the skill (a `Skill` tool call), or
    when the prompt starts with `/skill-name`. Supporting files load only when the body tells Claude
    to read them. This is "progressive disclosure". Once invoked, the rendered SKILL.md enters the
    conversation as one message, stays there and is not re-read. After compaction, only the first
    5,000 tokens of each invoked skill are re-attached. `claude -p` without `--bare` discovers
    project skills just as an interactive session does. With `--bare` it skips skill discovery, and
    the model never gets the skill listing.
  location: |
    `.claude/skills/<skill-name>/SKILL.md` in the repository. Claude Code loads `.claude/skills/` from
    the directory where it starts and from every parent directory up to the repository root.
    A nested `<subdir>/.claude/skills/` loads only after Claude first reads or edits a file in that
    subdirectory. For the open spec, the frontmatter `name` must match the folder name.
  frontmatter: |
    Claude Code: "All fields are optional. Only `description` is recommended so Claude knows when to
    use the skill." If `description` is missing, Claude Code uses the first non-empty line of the body.
    Claude Code fields: name (defaults to the directory name), description, when_to_use,
    argument-hint, arguments, disable-model-invocation (default false), user-invocable (default true),
    allowed-tools, disallowed-tools, model, effort, context (fork), agent, background, hooks, paths,
    shell, metadata, license, compatibility. Claude Code ignores unknown field names without an error.
    It reads frontmatter only when the opening `---` is the first line of the file. If the YAML does
    not parse, the skill still loads, but with no fields set.
    Agent Skills open spec: `name` and `description` are required. name is 1-64 characters of
    lowercase a-z, 0-9 and hyphens, with no hyphen at the start or end, no double hyphen, and it
    must match the parent directory. description is 1-1024 characters and should say what the skill
    does and when to use it. The optional spec fields are license, compatibility (at most 500
    characters), metadata (a map of strings) and allowed-tools (experimental).
    Anthropic's platform best practices add that name and description cannot contain XML tags, and
    that name cannot contain the reserved words "anthropic" or "claude".
    claude.ai uploads and the Skills API accept only the six spec fields, and any other key fails
    with a hard error. Claude Code accepts all six.
  triggering: |
    Before invocation, the model sees only the description and when_to_use text, so they decide
    whether the skill loads. Claude Code cuts each entry's combined description and when_to_use at
    1,536 characters. The whole listing has a budget of 1% of the context window. When the listing
    overflows, Claude Code drops descriptions first for the skills invoked least.
    Documented advice:
    - Put the key use case first.
    - Use keywords that users would naturally say.
    - Say both what the skill does and when to use it.
    - Write the description in the third person (platform best practices).
    - agentskills.io adds: phrase it as an imperative ("Use this skill when..."), focus on what the
      user is trying to do, and "Err on the side of being pushy".
    - Anthropic's skill-creator skill says Claude tends to "undertrigger" skills, and so recommends
      descriptions that are a little "pushy".
    - obra/superpowers found that a description which summarises the workflow makes the agent follow
      the summary and skip the body. Its advice is that the description should state only when to use
      the skill.
    Agents usually consult a skill only for tasks they cannot easily handle alone. A simple one-step
    request may not trigger a skill even when the description matches perfectly.
    Documented ways a skill fails to load or trigger:
    - Malformed YAML (the body loads, but Claude "can't match against your description").
    - `---` that is not on the first line.
    - Misspelled field names.
    - `disable-model-invocation: true`, which keeps the description out of context.
    - Listing-budget overflow.
    - `paths` globs that do not match the files Claude touches.
    - Forbidden characters or reserved names in the skill name.
    Making it reliable: measure the trigger rate with about 20 labelled queries, 3 runs each, and
    look for a `Skill` tool_use in `claude -p --output-format json`. A prompt that starts with
    `/skill-name` runs the skill directly. For a rule that must hold every time, the docs say to move
    it into a hook. Guidance that needs judgement should be written to cover the whole task, and the
    most important instructions should go near the top so that they survive compaction.
  headless: |
    Skills do load in headless mode unless you use `--bare`. The headless page says that without
    `--bare`, "`claude -p` discovers and loads them as an interactive session would, including
    anything configured in the working directory or `~/.claude`."
    `--bare` skips auto-discovery of skills, and Claude "doesn't get the list of available skills".
    The page also says `--bare` "will become the default for `-p` in a future release". Arm 2 must
    therefore not run with `--bare`, and should pin the Claude Code version.
    "User-invoked skills and custom commands work. Include `/skill-name` in the prompt string and
    Claude Code expands it before running." Through `-p`, Claude Code loads only the first of several
    stacked skills.
    In the Agent SDK, skills are discovered through the `user` and `project` setting sources, which
    are loaded by default. "If you set `settingSources`/`setting_sources` explicitly and omit those
    sources, the SDK doesn't load skills". If you pass an explicit `tools` list, it must include
    "Skill". For skills in added directories, the CLI docs say `--safe-mode` and a
    `strictPluginOnlyCustomization` policy restrict loading further.
    A `-p` session shows no workspace-trust dialog. It applies a project skill's `allowed-tools` even
    in a folder that was never trusted.
  sources:
    - title: 'Extend Claude with skills (Claude Code docs)'
      url: https://code.claude.com/docs/en/skills
      quote: 'All fields are optional. Only `description` is recommended so Claude knows when to use the skill.'
    - title: 'Extend Claude with skills (Claude Code docs) - location table'
      url: https://code.claude.com/docs/en/skills
      quote: 'Claude Code loads project skills from `.claude/skills/` in the directory where you start it and in every parent directory up to the repository root'
    - title: 'Extend Claude with skills (Claude Code docs) - invocation'
      url: https://code.claude.com/docs/en/skills
      quote: "In a regular session, skill descriptions are loaded into context so Claude knows what's available, but full skill content only loads when invoked."
    - title: 'Extend Claude with skills (Claude Code docs) - description field'
      url: https://code.claude.com/docs/en/skills
      quote: 'Put the key use case first: the combined `description` and `when_to_use` text is truncated at 1,536 characters in the skill listing to reduce context usage.'
    - title: 'Extend Claude with skills (Claude Code docs) - Skill not triggering'
      url: https://code.claude.com/docs/en/skills
      quote: "If the frontmatter YAML is malformed, Claude Code loads the skill body with empty metadata, so `/skill-name` still works but Claude can't match against your `description`."
    - title: 'Extend Claude with skills (Claude Code docs) - Claude stops following a skill'
      url: https://code.claude.com/docs/en/skills
      quote: 'Claude skipped a rule that must hold every time: move the rule into a hook'
    - title: 'Extend Claude with skills (Claude Code docs) - skill content lifecycle'
      url: https://code.claude.com/docs/en/skills
      quote: 'Claude Code does not re-read the skill file on later turns, so write guidance that should apply throughout a task as standing instructions rather than one-time steps.'
    - title: 'Run Claude Code programmatically (headless docs)'
      url: https://code.claude.com/docs/en/headless
      quote: 'Without it, `claude -p` discovers and loads them as an interactive session would, including anything configured in the working directory or `~/.claude`.'
    - title: 'Run Claude Code programmatically (headless docs) - bare mode'
      url: https://code.claude.com/docs/en/headless
      quote: "it doesn't get the list of available skills, including skills from an `--add-dir` folder."
    - title: 'Run Claude Code programmatically (headless docs) - commands in -p'
      url: https://code.claude.com/docs/en/headless
      quote: 'User-invoked skills and custom commands work. Include `/skill-name` in the prompt string and Claude Code expands it before running.'
    - title: 'Agent Skills in the SDK'
      url: https://code.claude.com/docs/en/agent-sdk/skills
      quote: 'If you also pass an explicit `tools` list, include `"Skill"` in that list so Claude can invoke skills.'
    - title: 'Agent Skills specification'
      url: https://agentskills.io/specification
      quote: 'Metadata (~100 tokens): The `name` and `description` fields are loaded at startup for all skills'
    - title: 'Optimizing skill descriptions (agentskills.io)'
      url: https://agentskills.io/skill-creation/optimizing-descriptions
      quote: 'A simple, one-step request like "read this PDF" may not trigger a PDF skill even if the description matches perfectly, because the agent can handle it with basic tools.'
    - title: 'Skill authoring best practices (Claude platform docs)'
      url: https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices
      quote: 'Always write in third person. The description is injected into the system prompt, and inconsistent point-of-view can cause discovery problems.'
    - title: 'skill-creator SKILL.md (anthropics/skills)'
      url: https://github.com/anthropics/skills/blob/main/skills/skill-creator/SKILL.md
      quote: 'currently Claude has a tendency to "undertrigger" skills -- to not use them when they''d be useful. To combat this, please make the skill descriptions a little bit "pushy".'
    - title: 'Equipping agents for the real world with Agent Skills (Anthropic engineering, 2025-10-16)'
      url: https://www.anthropic.com/engineering/equipping-agents-for-the-real-world-with-agent-skills
      quote: 'At startup, the agent pre-loads the `name` and `description` of every installed skill into its system prompt.'

skills:
  # Ordered by strength as an opponent for fuzzy rules. All stars were read on 2026-11-22.
  - name: frontend-design
    repository: anthropics/skills
    url: https://github.com/anthropics/skills/blob/main/skills/frontend-design/SKILL.md
    stars: 199078
    stars_read_on: 2026-11-22
    licence: Apache-2.0 (LICENSE.txt in the skill folder)
    kind: fuzzy-guideline
    domain: dev
    what_it_says: |
      Act as the design lead of a studio known for distinctive work. Ground every choice in the
      subject matter, and avoid the "defaults rather than choices" that AI-generated pages cluster
      around, which it names with concrete examples such as the cream background, the SaaS-card kit
      and ALL-CAPS eyebrow labels. It sets a two-pass process (plan, review the plan against the
      brief, then build), restraint ("spend your boldness in one place"), self-critique and
      UI-writing rules.
    length_lines: 71
    usable_as_opponent: 'yes'
    why: |
      This is the best-regarded pure judgement skill: Anthropic-authored, and listed with 1.2M
      installs on the skills.sh leaderboard. It shows how to state a fuzzy design or brand rule with
      named failure patterns and a review step, which makes it a model for design-judgement and
      UI-copy rules.
  - name: brand-review
    repository: anthropics/knowledge-work-plugins
    url: https://github.com/anthropics/knowledge-work-plugins/blob/HEAD/marketing/skills/brand-review/SKILL.md
    stars: 36701
    stars_read_on: 2026-11-22
    licence: Apache-2.0
    kind: fuzzy-guideline
    domain: business
    what_it_says: |
      Review content against brand voice, terminology, messaging pillars and the style guide, and
      flag deviations by severity with before/after fixes. A section that is "always checked"
      flags unsubstantiated superlatives, missing disclaimers, comparative claims, regulatory
      language and testimonial issues. It also includes voice-attribute spectrums and tone-by-channel
      tables.
    length_lines: 276
    usable_as_opponent: 'yes'
    why: |
      Anthropic-authored. It covers two of our business rule families directly, brand voice and
      marketing claims. It is review-shaped, so for arm 2 the checklist should be reworded as
      standing instructions for drafting.
  - name: copywriting
    repository: coreyhaines31/marketingskills
    url: https://github.com/coreyhaines31/marketingskills/blob/HEAD/skills/copywriting/SKILL.md
    stars: 62086
    stars_read_on: 2026-11-22
    licence: MIT
    kind: fuzzy-guideline
    domain: business
    what_it_says: |
      Conversion copywriting principles: clarity over cleverness, benefits over features,
      specificity, customer language, and one idea per section. Its section "Claims Must Be
      Supportable" says to write only claims the source supports, and to name each declined claim
      with the evidence that would unlock it. It also lists AI tells to avoid, and adds page-structure
      and CTA guidance.
    length_lines: 343
    usable_as_opponent: 'yes'
    why: |
      This is the most-starred marketing skill collection. Its supportable-claims section is a
      strong, real version of a "no unsubstantiated marketing claims" rule. It is long, though, so
      trim it to the claims and voice sections.
  - name: receiving-code-review
    repository: obra/superpowers
    url: https://github.com/obra/superpowers/blob/main/skills/receiving-code-review/SKILL.md
    stars: 324270
    stars_read_on: 2026-11-22
    licence: MIT
    kind: fuzzy-guideline
    domain: dev
    what_it_says: |
      Treat code review feedback with technical rigour rather than performative agreement. Read,
      restate, verify against the codebase, evaluate, then respond or push back. Do not say "You're
      absolutely right!", and stop to ask when any item is unclear.
    length_lines: 205
    usable_as_opponent: 'yes'
    why: |
      It comes from the most-starred skills framework and states a review-judgement rule in a
      testable form. It is a template for review-practice rules.
  - name: test-driven-development
    repository: obra/superpowers
    url: https://github.com/obra/superpowers/blob/main/skills/test-driven-development/SKILL.md
    stars: 324270
    stars_read_on: 2026-11-22
    licence: MIT
    kind: mixed
    domain: dev
    what_it_says: |
      An "Iron Law" that no production code is written without a failing test first. It lays out the
      red-green-refactor cycle, says code written before its test must be deleted, and lists the
      allowed exceptions. It also has rationalisation tables and red flags against skipping the
      discipline.
    length_lines: 330
    usable_as_opponent: 'yes'
    why: |
      This is the strongest real discipline-enforcing skill. It was written and pressure-tested to
      resist rationalisation, which makes it a fair opponent for testing-practice rules.
  - name: verification-before-completion
    repository: obra/superpowers
    url: https://github.com/obra/superpowers/blob/main/skills/verification-before-completion/SKILL.md
    stars: 324270
    stars_read_on: 2026-11-22
    licence: MIT
    kind: fuzzy-guideline
    domain: dev
    what_it_says: |
      "Evidence before claims, always." Do not claim work is complete, fixed or passing until the
      verification command has been run in this message. It includes a gate function to run before
      any success claim, before committing or before opening a PR.
    length_lines: 120
    usable_as_opponent: 'yes'
    why: |
      Compact, and it acts at commit time, the same moment our gate fires. It is a natural opponent
      for reliability rules and "don't overclaim" rules.
  - name: codebase-design
    repository: mattpocock/skills
    url: https://github.com/mattpocock/skills/blob/HEAD/skills/engineering/codebase-design/SKILL.md
    stars: 330636
    stars_read_on: 2026-11-22
    licence: MIT
    kind: fuzzy-guideline
    domain: dev
    what_it_says: |
      Design "deep modules": a lot of behaviour behind a small interface, placed at a clean seam and
      testable through that interface. It gives a strict glossary (module, interface, depth, seam,
      adapter, leverage, locality) and principles for judging deep versus shallow modules.
    length_lines: 114
    usable_as_opponent: 'yes'
    why: |
      This is the most-installed architecture judgement skill (985.9K installs on skills.sh) from
      the most-starred skills repository. It is a good opponent for architecture and modularity rules.
  - name: release-it
    repository: ciembor/agent-rules-books
    url: https://github.com/ciembor/agent-rules-books/blob/HEAD/release-it/release-it.mini.md
    stars: 3336
    stars_read_on: 2026-11-22
    licence: MIT
    kind: fuzzy-guideline
    domain: dev
    what_it_says: |
      Production-reliability decision rules after Nygard's Release It!: explicit timeouts on every
      outbound call, bounded retries with backoff that are used only when the call is safe to repeat,
      circuit breakers and bulkheads, finite queues, and observability at boundaries. It also has
      trigger rules ("When adding an outbound call... define timeout, retry eligibility...") and a
      final checklist. A short SKILL.md (11 lines) points to this mini file.
    length_lines: 48
    usable_as_opponent: 'yes'
    why: |
      This is a near-perfect real version of a reliability rule set. It is also published in nano,
      mini and full sizes, so the length of arm 2 can be varied.
  - name: internal-comms
    repository: anthropics/skills
    url: https://github.com/anthropics/skills/blob/main/skills/internal-comms/SKILL.md
    stars: 199078
    stars_read_on: 2026-11-22
    licence: Apache-2.0 (LICENSE.txt in the skill folder)
    kind: mixed
    domain: business
    what_it_says: |
      A router: identify the type of internal communication (3P update, newsletter, FAQ, status or
      incident report), then load the matching guideline file from `examples/`, and follow its
      format and tone. The SKILL.md itself carries little of the rule. The guidance lives in the
      example files.
    length_lines: 32
    usable_as_opponent: 'partly'
    why: |
      It is the official example of a tone/format skill for business writing, and of how to split a
      rule into progressive-disclosure files. On its own, though, the router body is too thin to
      state a rule.
  - name: humanizer
    repository: blader/humanizer
    url: https://github.com/blader/humanizer/blob/HEAD/SKILL.md
    stars: 72394
    stars_read_on: 2026-11-22
    licence: MIT
    kind: fuzzy-guideline
    domain: business
    what_it_says: |
      Rewrite AI-sounding text so it reads like the writer without changing what it says. It
      explains why models write that way, then lists 26 numbered patterns, strongest first
      (not-X-but-Y contrasts, one-line closers, forced triads, inflation, sales language, bold as
      decoration...). A "how to work" loop ends with a fact-preservation check.
    length_lines: 504
    usable_as_opponent: 'partly'
    why: |
      This is the most-starred standalone writing-style skill and a good model for voice rules. At
      504 lines it is over the 500-line guidance and exhaustive, so use it as a source and trim it.
  - name: api-and-interface-design
    repository: addyosmani/agent-skills
    url: https://github.com/addyosmani/agent-skills/blob/HEAD/skills/api-and-interface-design/SKILL.md
    stars: 119803
    stars_read_on: 2026-11-22
    licence: MIT
    kind: fuzzy-guideline
    domain: dev
    what_it_says: |
      Design interfaces that are hard to misuse. Topics include Hyrum's Law, contract first,
      consistent error semantics, validating at boundaries, preferring addition over modification,
      predictable naming and idempotency keys. It also gives REST and TypeScript patterns, a
      rationalisation table and red flags.
    length_lines: 369
    usable_as_opponent: 'yes'
    why: |
      A well-regarded architecture skill whose principles can be judged in a diff. It is fairly
      long, so cut the REST and TypeScript pattern sections for arm 2.
  - name: code-review-and-quality
    repository: addyosmani/agent-skills
    url: https://github.com/addyosmani/agent-skills/blob/HEAD/skills/code-review-and-quality/SKILL.md
    stars: 119803
    stars_read_on: 2026-11-22
    licence: MIT
    kind: mixed
    domain: dev
    what_it_says: |
      A five-axis review (correctness, readability, architecture, security, performance). Its
      approval standard is that a change "definitely improves overall code health". It adds change
      sizing, a review process, dead-code hygiene, honesty in review and a checklist template.
    length_lines: 402
    usable_as_opponent: 'partly'
    why: |
      It is strong on review judgement, but it is long and shaped for reviewing someone else's
      change. As a self-review step before commit it is a fair arm-2 source for review rules.
  - name: tdd
    repository: mattpocock/skills
    url: https://github.com/mattpocock/skills/blob/HEAD/skills/engineering/tdd/SKILL.md
    stars: 330636
    stars_read_on: 2026-11-22
    licence: MIT
    kind: fuzzy-guideline
    domain: dev
    what_it_says: |
      Tests verify behaviour through public interfaces, not implementation details. Tests live only
      at agreed seams. It names anti-patterns (implementation-coupled, tautological, horizontal
      slicing) and rules of the loop (red before green, one slice at a time). Its examples are in
      tests.md and mocking.md.
    length_lines: 38
    usable_as_opponent: 'yes'
    why: |
      A very compact, judgement-heavy testing rule. It is a good counterpoint to the long superpowers
      TDD skill if arm 2 needs a short variant. It asks the user to confirm seams, which a headless
      run cannot do.
