# Public list prices (Standard tier, USD) of the benchmark's decision models, read on the providers' own pages on the readOn date.
readOn: '2026-11-22'
currency: USD
models:
  gpt-6-luna:
    inputPerMillion: 0.10 # USD per million uncached input tokens on POST /v1/decisions
    outputPerMillion: 0 # output tokens are not charged on POST /v1/decisions
    perRequest: 0 # no per-request, per-question or minimum charge is stated
    source: https://developers.openai.com/api/docs/guides/decisions
    quote: 'With gpt-6-luna, uncached input costs $0.10 per 1M tokens. Prompt cache hits receive discounted input pricing; cache writes are charged. Cache-read and cache-write rates match the standard gpt-6-luna prompt caching rates. Output tokens are not charged. Regional processing premiums and long-context input pricing multipliers apply. These rates apply to /v1/decisions; other requests using gpt-6-luna follow the applicable model and processing-tier pricing.'
    notes: 'The decisions endpoint is priced differently from ordinary gpt-6-luna generation. The model page (https://developers.openai.com/api/docs/models/gpt-6-luna) lists ordinary text rates per 1M tokens of Input $0.10, Cached input $0.01, Cache writes $0.125 and Output $0.50. On /v1/decisions only input is charged. Cache reads cost $0.01 and cache writes $0.125 per 1M tokens, because the guide says decisions use the standard caching rates. Decisions sets an implicit cache breakpoint at the end of shared input by default. The reusable prefix must be at least 1,024 tokens. usage.input_tokens already includes usage.input_tokens_details.cached_tokens and cache_write_tokens. The AI SDK puts only input_tokens and output_tokens in usage and keeps the details in providerMetadata.openai.usage. Exact cost = (input_tokens - cached_tokens - cache_write_tokens) * 0.10/1e6 + cached_tokens * 0.01/1e6 + cache_write_tokens * 0.125/1e6. input_tokens * 0.10/1e6 is exact only when there is no cache activity. The model page says prompts over 272K input tokens are priced at 2x input and cache rates for the full request, and regional processing adds a 10% premium. Neither applies to direct global Standard calls under 272K tokens. num_model_requests counts requests, not questions. The guide gives no per-question fee, per-request fee or minimum.'
  jev-latest:
    inputPerMillion: 0.042 # USD per million input tokens ($42 per billion)
    outputPerMillion: 0 # output tokens are free
    perRequest: 0 # no per-request, per-question or minimum charge is stated
    source: https://docs.typesafe.ai/models
    quote: 'Price (per Btok / per Mtok) | $42 / $0.042 | $42 / $0.042 ... Price: You pay per input token. Output tokens are free. A Btok is a billion tokens and an Mtok is a million tokens.'
    notes: 'The quoted table row covers jev-1.14.0 and jev-1.13.0, which have the same price. The Aliases table on the same page says jev-latest points to jev-1.14.0, "The most recent stable, official release". Jev 1.14 has been available since October 14, 2026. An alias can move without notice, so check the model field of each response. typesafe.ai/pricing redirects to this page, and the homepage also shows "$42 Per Billion input tokens." Every Jev model is served by POST /v1/systemone, so there is no separate ordinary-generation rate. The API reference (https://docs.typesafe.ai/api/system-one) defines usage.input_tokens as "Number of billable input tokens used to evaluate the request" and says output tokens "are currently free of charge". Images are billed as input tokens at the same price and are included in usage.input_tokens. Long context costs the same per token. Cost = usage.input_tokens * 0.042/1e6. The docs say Jev "reads the state once, so you pay for the state once" per request. The decide engine sends one request per criterion, so it pays for the state once per criterion. No cached-input discount, per-request fee, per-question fee or minimum charge is stated in the docs or on the homepage. The homepage FAQ "Are these prices temporary or subsidized?" has no readable answer text.'
